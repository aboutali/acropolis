<title>Acropolis of Athens</title>
<meta name="description" content="Interactive 3D reconstruction of the Acropolis of Athens, rendered procedurally with three.js.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&display=swap">
<style>
  :root { --ink: #f2ece0; --panel: rgba(20, 24, 30, .62); --accent: #e3c78a; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: #87b6de; color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { position: fixed; inset: 0; z-index: 0; }
  #legend, #hint, #autorot, #debug { z-index: 5; }
  #app canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; }
  #legend { position: fixed; left: 12px; bottom: 12px; max-width: min(300px, 46vw); padding: 10px 12px; border-radius: 10px;
    background: var(--panel); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); font-size: 12px; line-height: 1.5; }
  #legend h1 { margin: 0 0 4px; font: 600 14px/1.3 Cinzel, "Trajan Pro", Georgia, serif; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  #legend ul { margin: 0; padding: 0; list-style: none; }
  #legend li::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; background: var(--dot, #e8e0cf); vertical-align: middle; }
  #hint { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); padding: 6px 12px; border-radius: 999px; background: var(--panel);
    backdrop-filter: blur(6px); font-size: 12px; white-space: nowrap; transition: opacity 1.2s ease; pointer-events: none; }
  #autorot { position: fixed; right: 12px; bottom: 12px; width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--panel);
    color: var(--ink); font-size: 20px; cursor: pointer; backdrop-filter: blur(6px); }
  #autorot.off { opacity: .5; }
  #debug { position: fixed; top: 12px; right: 12px; padding: 4px 8px; border-radius: 6px; background: var(--panel); font: 12px ui-monospace, Menlo, Consolas, monospace; }
  #legend li { display: flex; align-items: baseline; }
  #legend li::before { flex: none; }
  #legend button { all: unset; cursor: pointer; border-radius: 4px; }
  #legend button:hover { color: var(--accent); }
  #legend button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 640px) { #legend { font-size: 11px; padding: 8px 10px; } #legend h1 { font-size: 13px; } }
</style>
<div id="app"></div>
<div id="legend">
  <h1>Acropolis of Athens</h1>
  <ul>
    <li style="--dot:#e8e0cf"><button data-view="parthenon">Parthenon, 447–432 BC</button></li>
    <li style="--dot:#d8cdb6"><button data-view="erechtheion">Erechtheion &amp; Caryatids</button></li>
    <li style="--dot:#cfc4ad"><button data-view="propylaea">Propylaea &amp; Temple of Athena Nike</button></li>
    <li style="--dot:#6f5b3e"><button data-view="promachos">Athena Promachos</button></li>
    <li style="--dot:#9a8f7a"><button data-view="southslope">Theatre of Dionysus &amp; Odeon</button></li>
    <li style="--dot:transparent"><button data-view="overview">Whole hill</button></li>
  </ul>
  </ul>
</div>
<div id="hint">drag to orbit · pinch to zoom · tap a name to fly</div>
<button id="autorot" aria-pressed="true" title="Toggle auto-rotate">⟳</button>
<div id="debug" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script data-module="00-config.js">
// 00-config: shared constants
window.CFG = (function () {
  var mobile = (typeof innerWidth === 'number') && innerWidth < 640;
  return {
    PLATEAU_H: 80, PLATEAU_X: 300, PLATEAU_Z: 150, PLATEAU_CX: -45, PLATEAU_CZ: 0,
    MOBILE: mobile,
    SEG: mobile ? { colRadial: 24, colHeight: 2, capital: 16 } : { colRadial: 40, colHeight: 4, capital: 24 }
  };
})();

</script>
<script data-module="01-mats.js">
// Module 01: photoreal procedural material + texture library.
// Fast ImageData synthesis (seeded hash noise, deterministic, no RNG calls), Sobel-derived normal maps,
// world-scale-aware UV re-projection via mats.finishScene(scene, renderer).
window.buildMats = function (THREE) {
  var HAS_DOC = typeof document !== 'undefined';
  var MOBILE = !!(window.CFG && window.CFG.MOBILE);
  var SIZE = MOBILE ? 512 : 1024;      // final texture size
  var GEN = MOBILE ? 192 : 384;        // synthesis resolution for the primary (hero) fields
  var GEN_S = MOBILE ? 128 : 256;      // synthesis resolution for secondary fields
  var ALL_TEX = [];

  // ---------------------------------------------------------------
  // Seeded, trig-free integer hash -> tileable value noise -> fbm.
  // Periods are always integral so RepeatWrapping textures tile seamlessly.
  // ---------------------------------------------------------------
  function hashP(ix, iz, seed, px, pz) {
    ix = ((ix % px) + px) % px;
    iz = ((iz % pz) + pz) % pz;
    var h = (ix * 374761393 + iz * 668265263 + seed * 2246822519) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h = h ^ (h >>> 16);
    return (h >>> 0) / 4294967295;
  }
  function vnoiseP(x, z, seed, px, pz) {
    var xi = Math.floor(x), zi = Math.floor(z);
    var xf = x - xi, zf = z - zi;
    var u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
    var h00 = hashP(xi, zi, seed, px, pz), h10 = hashP(xi + 1, zi, seed, px, pz);
    var h01 = hashP(xi, zi + 1, seed, px, pz), h11 = hashP(xi + 1, zi + 1, seed, px, pz);
    return (h00 * (1 - u) + h10 * u) * (1 - v) + (h01 * (1 - u) + h11 * u) * v;
  }
  // Seamlessly tileable fbm over u,v in [0,1). fx/fz = base cell counts per axis (independent -> anisotropic stretch).
  function fbmTile(u, v, seed, fx, fz, oct, gain) {
    var amp = 0.5, sum = 0, norm = 0, mul = 1, i;
    for (i = 0; i < oct; i++) {
      var px = Math.max(1, Math.round(fx * mul)), pz = Math.max(1, Math.round(fz * mul));
      sum += amp * vnoiseP(u * px, v * pz, seed + i * 101, px, pz);
      norm += amp; amp *= gain; mul *= 2;
    }
    return sum / norm;
  }
  function warpTile(u, v, seed, fx, fz, oct, gain, warpAmt) {
    if (!warpAmt) return fbmTile(u, v, seed, fx, fz, oct, gain);
    var wf = Math.max(1, Math.round(fx * 0.4));
    var wu = fbmTile(u, v, seed + 811, wf, wf, 3, 0.5) - 0.5;
    var wv = fbmTile(u, v, seed + 1637, wf, wf, 3, 0.5) - 0.5;
    return fbmTile(u + wu * warpAmt, v + wv * warpAmt, seed, fx, fz, oct, gain);
  }
  function ridgeTile(u, v, seed, fx, fz, oct) {
    var amp = 0.5, sum = 0, norm = 0, mul = 1, i;
    for (i = 0; i < oct; i++) {
      var px = Math.max(1, Math.round(fx * mul)), pz = Math.max(1, Math.round(fz * mul));
      var n = vnoiseP(u * px, v * pz, seed + i * 53, px, pz);
      var r = 1 - Math.abs(2 * n - 1);
      sum += amp * r * r; norm += amp; amp *= 0.5; mul *= 2;
    }
    return sum / norm;
  }
  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function smooth(a, b, x) { var t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function byte(x) { x = x < 0 ? 0 : x > 255 ? 255 : x; return x | 0; }
  function fastHash(ix, iz, seed) {
    var h = (ix * 1274126177 + iz * 668265263 + seed * 374761393) | 0;
    h = Math.imul(h ^ (h >>> 15), 2246822519);
    h = h ^ (h >>> 13);
    return (h >>> 0) / 4294967295;
  }

  // ---------------------------------------------------------------
  // Canvas plumbing
  // ---------------------------------------------------------------
  function newCanvas(n) { var c = document.createElement('canvas'); c.width = c.height = n; return c; }
  function arrToCanvas(data, res) {
    var c = newCanvas(res), ctx = c.getContext('2d');
    var img = ctx.createImageData(res, res);
    img.data.set(data);
    ctx.putImageData(img, 0, 0);
    return c;
  }
  function upscale(src, size) {
    if (src.width === size) return src;
    var c = newCanvas(size), ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(src, 0, 0, size, size);
    return c;
  }
  function addFineGrain(canvas, amount, seed) {
    var res = canvas.width, ctx = canvas.getContext('2d');
    var img = ctx.getImageData(0, 0, res, res), d = img.data, x, y;
    for (y = 0; y < res; y++) {
      for (x = 0; x < res; x++) {
        var g = (fastHash(x, y, seed) - 0.5) * amount * 255;
        var i = (y * res + x) * 4;
        d[i] = byte(d[i] + g); d[i + 1] = byte(d[i + 1] + g); d[i + 2] = byte(d[i + 2] + g);
      }
    }
    ctx.putImageData(img, 0, 0);
  }
  // Very sparse, very-high-frequency bright specks (quartz-sparkle proxy). Applied at
  // full canvas resolution (post-upscale) so it stays crisp instead of blurring away.
  function addSparkle(canvas, density, seed) {
    var res = canvas.width, ctx = canvas.getContext('2d');
    var img = ctx.getImageData(0, 0, res, res), d = img.data, x, y;
    var thresh = 1 - density;
    for (y = 0; y < res; y++) {
      for (x = 0; x < res; x++) {
        var h = fastHash(x, y, seed);
        if (h > thresh) {
          var boost = ((h - thresh) / density) * 44;
          var i = (y * res + x) * 4;
          d[i] = byte(d[i] + boost); d[i + 1] = byte(d[i + 1] + boost); d[i + 2] = byte(d[i + 2] + boost * 0.9);
        }
      }
    }
    ctx.putImageData(img, 0, 0);
  }
  function toTexture(canvas, srgb) {
    var t = new THREE.CanvasTexture(canvas);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    if (srgb) t.encoding = THREE.sRGBEncoding;
    t.needsUpdate = true;
    ALL_TEX.push(t);
    return t;
  }
  // Sobel filter over a wrapped height field -> tangent-space normal map canvas.
  function heightToNormalCanvas(height, res, strength) {
    var out = new Uint8ClampedArray(res * res * 4);
    function h(x, z) { x = ((x % res) + res) % res; z = ((z % res) + res) % res; return height[z * res + x]; }
    var x, z;
    for (z = 0; z < res; z++) {
      for (x = 0; x < res; x++) {
        var tl = h(x - 1, z - 1), tc = h(x, z - 1), tr = h(x + 1, z - 1);
        var l = h(x - 1, z), r = h(x + 1, z);
        var bl = h(x - 1, z + 1), bc = h(x, z + 1), br = h(x + 1, z + 1);
        var gx = (tr + 2 * r + br) - (tl + 2 * l + bl);
        var gy = (bl + 2 * bc + br) - (tl + 2 * tc + tr);
        var nx = -gx * strength, ny = -gy * strength, nz = 1;
        var len = Math.sqrt(nx * nx + ny * ny + nz * nz);
        nx /= len; ny /= len; nz /= len;
        var i = (z * res + x) * 4;
        out[i] = byte((nx * 0.5 + 0.5) * 255);
        out[i + 1] = byte((ny * 0.5 + 0.5) * 255);
        out[i + 2] = byte((nz * 0.5 + 0.5) * 255);
        out[i + 3] = 255;
      }
    }
    return arrToCanvas(out, res);
  }

  // Applies a pronounced grounding grime: surfaces darken and warm toward their own base
  // (ancient-marble water-runoff + dust look), heaviest right at grade and fading out over
  // the lower few metres. Uses LOCAL (pre-modelMatrix) vertex Y, not world Y: per the helper
  // contract (H.makeSteppedBase/makeEntablature/makeDoricColumns etc.) each architectural
  // piece is authored with its own y=0 at its base, so this reads correctly on every group
  // regardless of how high that group's platform sits in world space (Parthenon +1.65,
  // Erechtheion +1, Nike bastion +4, ...) — a world-Y version would put whole raised
  // buildings entirely above the darkening threshold and never show any grime on them.
  // Cheap: a few shader-chunk string replacements, no extra texture samples.
  // roughWeather=true (marble family only) also grades roughnessFactor from the same
  // local-height signal: polished-feeling near the top of a piece, much rougher/weathered
  // right at its own base -- addresses the "should graduate polished -> very rough" note.
  function addGroundGrime(mat, roughWeather) {
    mat.onBeforeCompile = function (shader) {
      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', '#include <common>\nvarying float vGrimeY;')
        .replace('#include <begin_vertex>', '#include <begin_vertex>\nvGrimeY = transformed.y;');
      var frag = shader.fragmentShader
        .replace('#include <common>', '#include <common>\nvarying float vGrimeY;');
      if (roughWeather) {
        frag = frag.replace('#include <roughnessmap_fragment>',
          '#include <roughnessmap_fragment>\n' +
          '{ float rG = clamp(1.0 - (vGrimeY + 1.0) / 4.0, 0.0, 1.0); rG *= rG; ' +
          'roughnessFactor = clamp(roughnessFactor * (0.8 + rG * 0.5), 0.0, 1.0); }');
      }
      frag = frag.replace('#include <dithering_fragment>',
        '#include <dithering_fragment>\n' +
        '{ float gGrime = clamp(1.0 - (vGrimeY + 1.0) / 4.0, 0.0, 1.0); gGrime *= gGrime; ' +
        'gl_FragColor.rgb = mix(gl_FragColor.rgb, gl_FragColor.rgb * vec3(0.46, 0.38, 0.30), gGrime * 0.55); }');
      shader.fragmentShader = frag;
    };
  }

  var mats = {};

  // No-canvas environments (should not occur in practice: index.html always runs in a
  // browser) get flat-color materials so the module never throws.
  if (!HAS_DOC) {
    function flat(hex, rough, metal) { return new THREE.MeshStandardMaterial({ color: hex, roughness: rough, metalness: metal || 0 }); }
    mats.marble = flat(0xe4d8ba, 0.72); mats.marbleWorn = flat(0xcfbd96, 0.85); mats.marbleShadowed = flat(0xb9ac8f, 0.88);
    mats.rock = flat(0xa2957a, 0.95); mats.rockDark = flat(0x7d735f, 0.97); mats.ground = flat(0xa08a63, 0.98);
    mats.city = flat(0xcfc4ab, 0.9); mats.terracotta = flat(0xb0603a, 0.75); mats.bronze = flat(0x5a4a34, 0.4, 0.9);
    mats.foliageOlive = flat(0x6e7b57, 0.95); mats.foliageCypress = flat(0x38492f, 0.95); mats.trunk = flat(0x584634, 0.95);
    mats.marbleStatue = flat(0xe9e0c8, 0.5); mats.marbleRelief = flat(0xcfbd96, 0.85); mats.bronzePatina = flat(0x4c6656, 0.7, 0.4);
    mats.gold = flat(0xc9a04a, 0.3, 1); mats.ivory = flat(0xf0e6cf, 0.5); mats.grass = flat(0x8c8552, 0.95);
    mats.scrub = flat(0x7c7848, 0.95); mats.plaster = flat(0xe0d6c2, 0.9);
    mats.finishScene = function () {};
    return mats;
  }

  // =================================================================
  // MARBLE FAMILY: one hero field (marble/marbleWorn/marbleShadowed/marbleRelief share
  // it, only colour grading + weathering weight differ) and one finer field for statues.
  // =================================================================
  function genMarbleField(res, seed) {
    var color = new Uint8ClampedArray(res * res * 4);
    var height = new Float32Array(res * res);
    var patina = new Float32Array(res * res);
    var streak = new Float32Array(res * res);
    var vein = new Float32Array(res * res);
    var x, y;
    for (y = 0; y < res; y++) {
      var v = (y + 0.5) / res;
      for (x = 0; x < res; x++) {
        var u = (x + 0.5) / res, i = y * res + x;
        var grain = warpTile(u, v, seed, 5, 5, 6, 0.5, 0.4);           // fine crystalline grain, warped, 6 octaves
        var vr = ridgeTile(u * 1.0, v * 1.0, seed + 71, 4, 4, 3);
        var vn = smooth(0.72, 0.94, vr) * 0.75;                        // thin grey veins
        var pn = smooth(0.42, 0.8, warpTile(u, v, seed + 233, 3, 3, 4, 0.5, 0.5)); // honey/iron patches, wider spread
        var sk = warpTile(u, v * 0.4, seed + 577, 6, 16, 4, 0.5, 0.55) * smooth(0.35, 0.88, warpTile(u * 2.3, v, seed + 900, 7, 5, 3, 0.5, 0.35)); // vertical streak blobs, warped to avoid a regular repeat
        // Fine stress-crack network: high-octave ridge noise, mid-scale-fbm-warped so cracks
        // meander instead of forming a rigid grid, isolated to sparse thin ridge peaks only.
        var crackWarpU = u + (fbmTile(u, v, seed + 811, 6, 6, 3, 0.5) - 0.5) * 0.18;
        var crackWarpV = v + (fbmTile(u, v, seed + 812, 6, 6, 3, 0.5) - 0.5) * 0.18;
        var crackN = ridgeTile(crackWarpU, crackWarpV, seed + 950, 27, 27, 7);
        var crackAmt = smooth(0.8, 0.965, crackN);
        height[i] = clamp01(0.5 + (grain - 0.5) * 0.5 - vn * 0.35 - crackAmt * 0.42);
        vein[i] = vn; patina[i] = pn; streak[i] = clamp01(sk);
        var base = [241, 222, 180];        // warmer, more golden honey/cream Pentelic base
        var veinCol = [180, 174, 160];
        var patinaCol = [191, 133, 56];    // more saturated iron-oxide patina
        var c = lerpC(base, veinCol, vn * 0.55);
        c = lerpC(c, patinaCol, pn * 0.48);
        var gshade = (grain - 0.5) * 26 - crackAmt * 16;
        var di = i * 4;
        color[di] = byte(c[0] + gshade); color[di + 1] = byte(c[1] + gshade * 0.92); color[di + 2] = byte(c[2] + gshade * 0.8); color[di + 3] = 255;
      }
    }
    return { color: color, height: height, patina: patina, streak: streak, vein: vein, res: res };
  }
  function lerpC(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }

  function paintMarbleVariant(field, opts) {
    var res = field.res, out = new Uint8ClampedArray(res * res * 4), rm = new Uint8ClampedArray(res * res * 4);
    var grimeCol = [86, 78, 65];
    var i, di;
    for (i = 0; i < res * res; i++) {
      di = i * 4;
      var r = field.color[di], g = field.color[di + 1], b = field.color[di + 2];
      var patina = field.patina[i] * opts.patina;
      var streak = field.streak[i] * opts.streak;
      var grime = Math.max(patina * 0.4, streak) * opts.grime;
      var c = lerpC([r, g, b], grimeCol, clamp01(grime));
      c = [c[0] * opts.darken, c[1] * opts.darken, c[2] * opts.darken];
      out[di] = byte(c[0]); out[di + 1] = byte(c[1]); out[di + 2] = byte(c[2]); out[di + 3] = 255;
      var rough = clamp01(opts.roughBase + (patina + streak) * opts.roughVar - (field.height[i] - 0.5) * 0.06);
      rm[di] = 255; rm[di + 1] = byte(rough * 255); rm[di + 2] = 0; rm[di + 3] = 255;
    }
    var smallCanvas = arrToCanvas(out, res);
    if (opts.grainAmt) addFineGrain(smallCanvas, opts.grainAmt, opts.seed || 1);
    var colorCanvas = upscale(smallCanvas, SIZE);
    // Sparkle (sparse quartz-fleck highlights) is applied at full SIZE resolution, post-
    // upscale, so those single-pixel specks stay crisp instead of being blurred away by the
    // upscale blit; it's cheap because the density is very low (few flagged pixels per tile).
    if (opts.sparkleAmt) addSparkle(colorCanvas, opts.sparkleAmt, (opts.seed || 1) + 4000);
    var m = {};
    m.map = toTexture(colorCanvas, true);
    m.roughnessMap = toTexture(upscale(arrToCanvas(rm, res), SIZE), false);
    m.normalMap = toTexture(upscale(heightToNormalCanvas(field.height, res, opts.normalStrength), SIZE), false);
    return m;
  }

  var marbleFieldA = genMarbleField(GEN, 401);
  var marbleFieldB = genMarbleField(Math.round(GEN * 0.85), 907); // statue: independent, finer-feeling field

  // normalStrength (the Sobel gradient multiplier) raised ~1.5x across the marble family so
  // crystalline grain, tool-marks and the new crack network read with real physical relief
  // instead of looking airbrushed; normalScale raised into the 1.5-2.0 range to match.
  var mA = paintMarbleVariant(marbleFieldA, { patina: 0.38, streak: 0.24, grime: 0.24, darken: 1.0, roughBase: 0.6, roughVar: 0.22, normalStrength: 3.3, grainAmt: 0.03, sparkleAmt: 0.01, seed: 11 });
  mats.marble = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, metalness: 0, map: mA.map, normalMap: mA.normalMap, roughnessMap: mA.roughnessMap, normalScale: new THREE.Vector2(1.7, 1.7) });

  var mW = paintMarbleVariant(marbleFieldA, { patina: 0.72, streak: 0.64, grime: 0.6, darken: 0.8, roughBase: 0.8, roughVar: 0.18, normalStrength: 3.45, grainAmt: 0.032, sparkleAmt: 0.006, seed: 12 });
  mats.marbleWorn = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, metalness: 0, map: mW.map, normalMap: mW.normalMap, roughnessMap: mW.roughnessMap, normalScale: new THREE.Vector2(1.9, 1.9) });

  var mS = paintMarbleVariant(marbleFieldA, { patina: 0.4, streak: 0.32, grime: 0.55, darken: 0.6, roughBase: 0.85, roughVar: 0.12, normalStrength: 3.3, grainAmt: 0.02, seed: 13 });
  mats.marbleShadowed = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, metalness: 0, map: mS.map, normalMap: mS.normalMap, roughnessMap: mS.roughnessMap, normalScale: new THREE.Vector2(1.6, 1.6) });

  var mR = paintMarbleVariant(marbleFieldA, { patina: 0.58, streak: 0.42, grime: 0.4, darken: 0.88, roughBase: 0.76, roughVar: 0.16, normalStrength: 2.4, grainAmt: 0.026, seed: 14 });
  mats.marbleRelief = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, metalness: 0, map: mR.map, normalMap: mR.normalMap, roughnessMap: mR.roughnessMap, normalScale: new THREE.Vector2(1.1, 1.1) });

  var mSt = paintMarbleVariant(marbleFieldB, { patina: 0.08, streak: 0.04, grime: 0.08, darken: 1.03, roughBase: 0.4, roughVar: 0.1, normalStrength: 1.95, grainAmt: 0.014, sparkleAmt: 0.014, seed: 15 });
  mats.marbleStatue = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, metalness: 0, map: mSt.map, normalMap: mSt.normalMap, roughnessMap: mSt.roughnessMap, normalScale: new THREE.Vector2(0.6, 0.6) });

    var friezeH = h * (isIonic ? 0.30 : 0.34);
    var corniceH = h * (isIonic ? 0.30 : 0.28);
    var archThickness = Math.max(0.9, Math.min(w, d) * 0.045);

    function ring(h0, hgt, thick, mat) {
      var geos = [
        new THREE.BoxGeometry(w, hgt, thick), new THREE.BoxGeometry(w, hgt, thick),
        new THREE.BoxGeometry(thick, hgt, d), new THREE.BoxGeometry(thick, hgt, d)

      var wHalf = w / 2 - thick / 2, dHalf = d / 2 - thick / 2;
      var poses = [[0, h0 + hgt / 2, dHalf], [0, h0 + hgt / 2, -dHalf], [wHalf, h0 + hgt / 2, 0], [-wHalf, h0 + hgt / 2, 0]];
      for (var k = 0; k < 4; k++) addMesh(group, geos[k], mat, poses[k]);
    }

    // ---- Architrave ------------------------------------------------
    if (isIonic) {
      var bands = 3, bh = archH / bands;
      for (var b = 0; b < bands; b++) {
        var over = archThickness * (1 + b * 0.10);

      }
    } else {
      ring(0, archH, archThickness, mats.marble);
      // Taenia: raised fillet along the top edge of the architrave.
      var taeniaH = archH * 0.09;
      ring(archH - taeniaH, taeniaH, archThickness + 0.05, mats.marbleWorn);
    }

    // ---- Frieze ------------------------------------------------------
    var xStep = w / (triglyphCount + 1), zStep = d / (zCount + 1);
    var trigTransforms = [], reguT = [], guttaT = [], mutuleT = [], mutGuttaT = [];
    var trigW = isIonic ? 0 : 0.85;
    if (triglyphs) {
      // Real geometric grooves, not painted-on strips: a recessed base plate
      // plus three proud vertical ridges (two true channels between them,
      // the base's own edges reading as the classical half-glyphs) gives an
      // actual ~3-4 cm normal-facing step that catches real shadow under the
      // scene's sun light, instead of a flat co-planar colour difference.
      var grooveDepth = Math.max(0.022, trigW * 0.045);
      var trigGeo = new THREE.BoxGeometry(trigW, friezeH, 0.12 - grooveDepth);
      var ridgeW = trigW * 0.2;
      var ridgeGeo = new THREE.BoxGeometry(ridgeW, friezeH * 0.97, 0.10);
      for (var i = 1; i <= triglyphCount; i++) {
        trigTransforms.push({ p: [-(w / 2) + xStep * i, archH + friezeH / 2, d / 2 + 0.06], r: [0, 0, 0] });
        trigTransforms.push({ p: [-(w / 2) + xStep * i, archH + friezeH / 2, -d / 2 - 0.06], r: [0, PI, 0] });
      }
      for (var i2 = 1; i2 <= zCount; i2++) {
        trigTransforms.push({ p: [w / 2 + 0.06, archH + friezeH / 2, -(d / 2) + zStep * i2], r: [0, PI / 2, 0] });
        trigTransforms.push({ p: [-w / 2 - 0.06, archH + friezeH / 2, -(d / 2) + zStep * i2], r: [0, -PI / 2, 0] });
      }
      // Split triglyphs between clean and rain-streaked marble so the frieze
      // reads as patchily weathered rather than one uniform flat colour.
      var trigT = [], trigWornT = [], ridgeT = [], ridgeWornT = [];
      for (var t = 0; t < trigTransforms.length; t++) {
        var tt = trigTransforms[t];
        var worn = rnd() < 0.3;
        // Outward normal for this face (see H.makeEntablature's mutule/gutta
        // math below for the same convention): nx=sin(ry), nz=cos(ry).
        var nx = sin(tt.r[1]), nz = cos(tt.r[1]);
        var basePos = [tt.p[0] - nx * grooveDepth * 0.5, tt.p[1], tt.p[2] - nz * grooveDepth * 0.5];
        (worn ? trigWornT : trigT).push({ p: basePos, r: tt.r });
        // Tangent (local width axis) for the ridge offsets.
        var ca = cos(tt.r[1]), sa = sin(tt.r[1]);
        var tx = ca, tz = -sa;
        var ridgeList = worn ? ridgeWornT : ridgeT;
        for (var rIdx = -1; rIdx <= 1; rIdx++) {
          var off = rIdx * ridgeW * 1.35;
          ridgeList.push({
            p: [tt.p[0] + tx * off + nx * grooveDepth * 0.5, tt.p[1], tt.p[2] + tz * off + nz * grooveDepth * 0.5],
            r: tt.r
          });
        }
      }
      group.add(H.instance(trigGeo, mats.marble, trigT));
      if (trigWornT.length) group.add(H.instance(trigGeo, mats.marbleWorn, trigWornT));
      group.add(H.instance(ridgeGeo, mats.marble, ridgeT));
      if (ridgeWornT.length) group.add(H.instance(ridgeGeo, mats.marbleWorn, ridgeWornT));

      // Regulae + guttae under the taenia, aligned above each triglyph —
      // sized up ~40% over the previous pass so they read as distinct
      // hanging studs rather than a faint speckle at normal view distance.
      if (guttae && !isIonic) {
        var reguGeo = new THREE.BoxGeometry(trigW * 0.94, archH * 0.075, 0.13);
        var guttaGeo = new THREE.CylinderGeometry(0.034, 0.06, 0.10, 6);
        for (var t2 = 0; t2 < trigTransforms.length; t2++) {
          var g = trigTransforms[t2];
          var facing = [sin(g.r[1]) * 0.14, -cos(g.r[1]) * 0.14];
          reguT.push({ p: [g.p[0] - facing[0], archH - archH * 0.032, g.p[2] - facing[1]], r: g.r });
          for (var gx = -1; gx <= 1; gx++) for (var gy = 0; gy < 2; gy++) {
            guttaT.push({ p: [g.p[0] - facing[0] + gx * trigW * 0.28, archH - archH * 0.09 - gy * 0.075, g.p[2] - facing[1]], r: [PI, 0, 0] });
          }
        }
        group.add(H.instance(reguGeo, mats.marble, reguT));
        group.add(H.instance(guttaGeo, mats.marbleShadowed, guttaT));
      }
    } else if (isIonic) {
      // Continuous plain frieze band (Ionic friezes are often carved
      // continuously; keep it a clean recessed band here).
      ring(archH, friezeH, archThickness - 0.06, mats.marbleShadowed);
    }

    // Metopes: place a relief/plate in every bay between triglyphs (front/back
    // long faces and both short ends), using the caller-supplied maker so this
    // shared helper never hardcodes any one building's iconography.
    if (triglyphs && metopeMaker) {
      var idx = 0;
      // metopeMaker's own carving detail comes from another stream's module;
      // regardless of how much detail it puts in the plate, every bay also
      // gets a cheap instanced figure group standing proud of the plate face
      // (torso + head + a raised weapon/limb accent), so the frieze always
      // reads as carved sculpture with real light/shadow rather than a row
      // of blank rectangles even if the plate itself is plain.
      var relH = friezeH * 0.86;
      // Figure geometry is scaled up ~40% over the bay proportion so the
      // accent sculpture reads clearly at normal viewing distance instead of
      // as small barely-noticeable bumps; relH itself still drives placement
      // within the bay.
      var figScale = 1.4;
      var fH = relH * figScale;
      var figTorsoGeo = new THREE.BoxGeometry(fH * 0.24, fH * 0.5, 0.1);
      var figHeadGeo = new THREE.SphereGeometry(fH * 0.1, 8, 6);
      var figLimbGeo = new THREE.CylinderGeometry(fH * 0.045, fH * 0.045, fH * 0.34, 6);
      var figPropGeo = new THREE.CylinderGeometry(fH * 0.028, fH * 0.028, fH * 0.72, 5);
      var torsoT = [], headT = [], limbT = [], propT = [];
      function addFigure(baseX, baseY, baseZ, rightX, rightZ, outX, outZ, ry, lx, tilt, outJitter, withProp) {
        var out = 0.15 + outJitter;
        var fx = baseX + rightX * lx + outX * out, fz = baseZ + rightZ * lx + outZ * out;
        torsoT.push({ p: [fx, baseY, fz], r: [0, ry, tilt * 0.3] });
        headT.push({ p: [fx + rightX * tilt * fH * 0.12, baseY + fH * 0.33, fz + rightZ * tilt * fH * 0.12], r: [0, ry, 0] });
        limbT.push({ p: [fx - rightX * fH * 0.1, baseY - fH * 0.02, fz - rightZ * fH * 0.1], r: [0, ry, PI / 2 + tilt * 0.6] });
        // Small weapon/staff prop on some figures — a diagonal rod crossing
        // the torso silhouette, breaking up the outline like a spear or
        // walking-staff would on a real carved combatant/traveller figure.
        if (withProp) {
          propT.push({ p: [fx + rightX * fH * 0.05, baseY + fH * 0.05, fz + rightZ * fH * 0.05], r: [0, ry, PI / 4 + tilt * 0.5] });
        }
      }
      function metopeRow(count, step, axisIsX, sign) {
        var rightX = axisIsX ? 1 : 0, rightZ = axisIsX ? 0 : 1;
        var outX = axisIsX ? 0 : sign, outZ = axisIsX ? sign : 0;
        var ry = axisIsX ? (sign > 0 ? 0 : PI) : (sign > 0 ? PI / 2 : -PI / 2);
        for (var n = 0; n < count + 1; n++) {
          var c = -((axisIsX ? w : d) / 2) + step * (n + 0.5);
          var mw = Math.min(step * 0.82, 1.4);
          var mesh = metopeMaker(idx++, mw, relH);
          var baseX = axisIsX ? c : sign * (w / 2 + 0.03);
          var baseZ = axisIsX ? sign * (d / 2 + 0.03) : c;
          var baseY = archH + friezeH / 2;
          if (mesh) {
            mesh.position.set(baseX, baseY, baseZ);
            mesh.rotation.y = ry;
            group.add(mesh);
          }
          var duo = rnd() < 0.4;
          // Front-to-back and left-right stagger: each figure gets its own
          // outward-standoff jitter (not a fixed 0.15) and a wider lateral
          // spread so a duo visibly overlaps in depth rather than sitting on
          // one flat plane.
          addFigure(baseX, baseY - fH * 0.05, baseZ, rightX, rightZ, outX, outZ, ry, duo ? -mw * 0.2 : 0, (rnd() - 0.5) * 2, (rnd() - 0.5) * 0.1, rnd() < 0.35);
          if (duo) addFigure(baseX, baseY - fH * 0.08, baseZ, rightX, rightZ, outX, outZ, ry, mw * 0.22, (rnd() - 0.5) * 2, (rnd() - 0.5) * 0.1 - 0.04, rnd() < 0.35);

      }
      metopeRow(triglyphCount, xStep, true, 1);
      metopeRow(triglyphCount, xStep, true, -1);
      metopeRow(zCount, zStep, false, 1);
      metopeRow(zCount, zStep, false, -1);

      group.add(H.instance(figHeadGeo, mats.marbleRelief, headT));
      group.add(H.instance(figLimbGeo, mats.marbleShadowed, limbT));
      if (propT.length) group.add(H.instance(figPropGeo, mats.marbleShadowed, propT));

    // ---- Cornice -------------------------------------------------------
    if (cornice) {
      var cornOvhg = 0.45;
      // Rain-washed corona: this is the most weather-exposed horizontal
      // surface on the whole order, so it takes the "worn" variant rather
      // than pristine marble.
      ring(archH + friezeH, corniceH, archThickness + 2 * cornOvhg, mats.marbleWorn);
      // Drip-edge throat: a thin shadowed groove along the underside outer
      // lip of the corona (the classical cyma reversa drip channel), which
      // both reads as authentic detailing and gives the cornice a hard
      // shadow line instead of a flat slab silhouette.
      var dripT = archThickness + 2 * cornOvhg - 0.08;
      ring(archH + friezeH + corniceH * 0.06, corniceH * 0.05, dripT, mats.marbleShadowed);

      if (isIonic) {
        // Egg-and-dart band under the cornice soffit.

        var eodT = [];
        var perim = 2 * (w + d), eodCount = Math.max(8, Math.round(perim / (MOBILE ? 1.4 : 0.9)));
        for (var e = 0; e < eodCount; e++) {
          var tpar = e / eodCount, px2, pz2, ry;
          if (tpar < 0.25) { px2 = -w / 2 + (tpar / 0.25) * w; pz2 = d / 2 + cornOvhg * 0.5; ry = 0; }
          else if (tpar < 0.5) { px2 = w / 2 + cornOvhg * 0.5; pz2 = d / 2 - ((tpar - 0.25) / 0.25) * d; ry = PI / 2; }
          else if (tpar < 0.75) { px2 = w / 2 - ((tpar - 0.5) / 0.25) * w; pz2 = -d / 2 - cornOvhg * 0.5; ry = PI; }
          else { px2 = -w / 2 - cornOvhg * 0.5; pz2 = -d / 2 + ((tpar - 0.75) / 0.25) * d; ry = -PI / 2; }
          eodT.push({ p: [px2, archH + friezeH + corniceH * 0.1, pz2], r: [PI / 2, ry, 0], s: [0.12, 1, 0.12] });

        var mGuttaGeo = new THREE.CylinderGeometry(0.032, 0.054, 0.09, 6);
        for (var t3 = 0; t3 < trigTransforms.length; t3++) {
          var g2 = trigTransforms[t3];
          var facing2 = [sin(g2.r[1]) * (0.62 / 2 + 0.02), -cos(g2.r[1]) * (0.62 / 2 + 0.02)];
          var soffitY = archH + friezeH + corniceH * 0.55;

            var lo = rotXZ(mgx * 0.32, mgz * 0.18, g2.r[1]);
            mutGuttaT.push({ p: [g2.p[0] + facing2[0] + lo[0], soffitY - 0.05, g2.p[2] + facing2[1] + lo[1]], r: [PI, 0, 0] });

        group.add(H.instance(mutGeo, mats.marble, mutuleT));
        group.add(H.instance(mGuttaGeo, mats.marbleShadowed, mutGuttaT));

      // Sima along the flank eaves, with lion-head spouts (Doric).
      if (sima) {
        var simaH = corniceH * 0.35;
        ring(archH + friezeH + corniceH, simaH, archThickness + 2 * cornOvhg - 0.1, mats.marbleWorn);
        if (lionSpouts) {
          var headGeo = new THREE.SphereGeometry(0.16, 8, 6);
          var snoutGeo = new THREE.ConeGeometry(0.09, 0.16, 6);
          var streakH = corniceH + friezeH * 0.7;
          var streakGeo = new THREE.PlaneGeometry(0.14, streakH);
          var spacing = o.lionSpacing || Math.max(2.2, d / 10);
          var count = Math.max(2, Math.floor(d / spacing));
          var headT = [], snoutT = [], streakT = [];
          for (var li = 0; li < count; li++) {
            var lz = -d / 2 + (li + 0.5) * (d / count);
            var ly = archH + friezeH + corniceH + simaH * 0.4;
            headT.push({ p: [w / 2 + cornOvhg, ly, lz], s: [1, 0.8, 0.8] });
            headT.push({ p: [-w / 2 - cornOvhg, ly, lz], s: [1, 0.8, 0.8] });
            snoutT.push({ p: [w / 2 + cornOvhg + 0.18, ly, lz], r: [0, 0, -PI / 2] });
            snoutT.push({ p: [-w / 2 - cornOvhg - 0.18, ly, lz], r: [0, 0, PI / 2] });

            // iron/algae streak down the cornice and frieze face beneath it.
            var streakY = archH + friezeH + corniceH - streakH / 2;
            streakT.push({ p: [w / 2 + 0.015, streakY, lz], r: [0, PI / 2, 0] });
            streakT.push({ p: [-(w / 2 + 0.015), streakY, lz], r: [0, -PI / 2, 0] });
          }
          group.add(H.instance(headGeo, mats.marbleShadowed, headT));
          group.add(H.instance(snoutGeo, mats.marbleShadowed, snoutT));
          group.add(H.instance(streakGeo, mats.marbleShadowed, streakT));
        }
      }
    }

    return group;
  };

  // =====================================================================
  // PEDIMENT: recessed tympanum behind the raking cornice, a horizontal
  // geison at the base, sima along the rake, and sculpture figures whose
  // pose flattens toward the corners.
  // =====================================================================
  H.makePediment = function (w, d, h, o) {
    o = o || {};
    var figures = o.figures !== undefined ? o.figures : 9;
    var recess = o.recess !== undefined ? o.recess : Math.max(0.12, d * 0.12);
    var group = new THREE.Group();

    // Horizontal geison at the base of the pediment — a heavily rain-washed
    // exposed ledge, so it takes the worn variant.
    var geisonH = Math.max(0.12, h * 0.05);
    addMesh(group, new THREE.BoxGeometry(w + 0.5, geisonH, d + 0.35), mats.marbleWorn, [0, geisonH / 2, 0]);

    // Tympanum, recessed behind the raking cornice plane.
    var shape = new THREE.Shape();

    shape.lineTo(w / 2, 0);
    shape.lineTo(0, h);
    shape.lineTo(-w / 2, 0);
    var tympGeo = new THREE.ExtrudeGeometry(shape, { depth: d, bevelEnabled: false });
    // Shallow carved relief on the front face: broad noise roughness plus a
    // few narrow periodic recession lines suggesting panel/figure-niche
    // divisions, so the tympanum reads as worked stone instead of a flat
    // monochrome triangle even where it stands in as a figure placeholder.
    var pedSeed = Math.round(w * 53 + h * 911 + d * 17) + 13;
    var tPos = tympGeo.getAttribute('position'), tArr = tPos.array;

    tympGeo.translate(0, geisonH, -d / 2 - recess);

    // geison: a thin picture-frame border sitting just proud of the recess
    // plane, which reads as a hard shadow line and sharpens the perceived
    // depth of the recess from a distance.
    var frameMargin = Math.min(0.4, Math.max(w, d) * 0.02);

    outerShape.moveTo(-w / 2 - 0.1, 0);
    outerShape.lineTo(w / 2 + 0.1, 0);
    outerShape.lineTo(0, h + 0.08);
    outerShape.lineTo(-w / 2 - 0.1, 0);
    var innerPath = new THREE.Path();
    innerPath.moveTo(-w / 2 + frameMargin, frameMargin * 0.6);
    innerPath.lineTo(w / 2 - frameMargin, frameMargin * 0.6);
    innerPath.lineTo(0, h - frameMargin);
    innerPath.lineTo(-w / 2 + frameMargin, frameMargin * 0.6);
    outerShape.holes.push(innerPath);
    var frameGeo = new THREE.ExtrudeGeometry(outerShape, { depth: 0.05, bevelEnabled: false });

    addMesh(group, frameGeo, mats.marbleShadowed, [0, 0, 0]);

    var slopeLen = sqrt((w / 2) * (w / 2) + h * h) + 0.4;
    var angle = atan2(h, w / 2);
    var rakingGeo = new THREE.BoxGeometry(slopeLen, 0.4, d + 0.6);
    var simaGeo = new THREE.BoxGeometry(slopeLen, 0.14, d + 0.7);
    var rakingPos = [[w / 4, geisonH + h / 2, 0], [-w / 4, geisonH + h / 2, 0]];
    var rakingRot = [[0, 0, -angle], [0, 0, angle]];
    for (var i = 0; i < 2; i++) {
      // The raking cornice is exposed on its top face along the whole roofline
      // — worn, like the horizontal corona — while the recessed tympanum
      // behind stays comparatively sheltered and darker.
      addMesh(group, rakingGeo.clone(), mats.marbleWorn, rakingPos[i], rakingRot[i]);
      addMesh(group, simaGeo.clone(), mats.marbleWorn, [rakingPos[i][0], rakingPos[i][1] + 0.27, rakingPos[i][2]], rakingRot[i]);

    // toward the low corners — matches the shrinking triangular field.
    for (var f = 0; f < figures; f++) {

  // =====================================================================
  // ROOF: Laconian pan-and-cover marble tiling (long strips, not per-tile
  // bricks — far cheaper and reads correctly from a distance), antefixes
  // at the eaves, ridge palmettes, and floral acroteria.
  // =====================================================================

    for (var i = 0; i < 2; i++) {
      var slabMesh = addMesh(group, slab[i], mats.terracotta, slabPos[i], slabRot[i]);
      slabMesh.castShadow = false; // thin edge-on pair meeting at the ridge — same shadow-acne risk as the tiles above them
    }

    // A stylised palmette (fan of tapering lobes, shallow-extruded so its own
    // bevel already reads as carved relief) shared by the ridge finials,
    // acroteria and antefixes below — replaces the old plain cone/box forms.
    // Built once per roof at a nominal unit size; every use scales it via
    // the instance transform's `s`, and two copies crossed 90 deg apart give
    // a readable silhouette from any orbit angle instead of only face-on.
    function palmetteShape(lobeCount) {
      var shp = new THREE.Shape();
      var lobes = lobeCount || 5;
      var tip = [];
      for (var li = 0; li <= lobes; li++) {
        var t = li / lobes;
        var ang2 = (t - 0.5) * 1.7;
        var lenFrac = 0.5 + 0.5 * (1 - abs(t - 0.5) * 2);

      shp.moveTo(-0.055, 0);
      shp.lineTo(tip[0][0] * 0.3, tip[0][1] * 0.15);
      for (var pi = 0; pi < tip.length; pi++) {

            // length to how far this tile's centre actually sits from

          antefixT.push({ p: [ax, 0.16, -d / 2 - 0.02], r: [0, PI, 0] });

      var panMesh = H.instance(panGeo, mats.terracotta, panT);
      panMesh.castShadow = false;

      coverMesh.castShadow = false;
      group.add(coverMesh);

      var acroPos = [[0, ridgeH, d / 2], [0, ridgeH, -d / 2], [w / 2, 0, d / 2], [-w / 2, 0, d / 2], [w / 2, 0, -d / 2], [-w / 2, 0, -d / 2]];

    var jointGapH = 0.06;  // bed joint between courses

      wallRun(-dxSign * (halfW + thickness / 2), 0, d, 0, 1, thickness);
      wallRun(dxSign * (halfW + thickness / 2), -doorWidth / 2 - flankLenX / 2, flankLenX, 0, 1, thickness);
      wallRun(dxSign * (halfW + thickness / 2), doorWidth / 2 + flankLenX / 2, flankLenX, 0, 1, thickness);

    if (blockShadowedT.length) group.add(H.instance(blockGeo, mats.marbleShadowed, blockShadowedT));

      addMesh(group, jambGeo, mats.marble, [center[0] - (dw / 2) * cos(ry), (dh - lintelH) / 2, center[2] + (dw / 2) * sin(ry)], [0, ry, 0]);

// Terrain: plateau surface, stratified cliffs, hillside descending to the plain, city, sacred way
window.buildTerrain = function (THREE, mats, H) {
  var group = new THREE.Group();
  var MOBILE = !!(window.CFG && window.CFG.MOBILE);
  var PI = Math.PI, sin = Math.sin, cos = Math.cos, sqrt = Math.sqrt;

  function lcg(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }
  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }

  // Weathering tint shared by the plateau + cliff: broad honey/iron patches plus darker
  // streak/lichen zones, sampled straight off world x,z (playing the role of a normal map's
  // discoloration channel, since materials and textures belong to the module that builds mats).
  // The macro/macro2/patch layers sit at 0.018-0.07 Hz -- well below the 0.32/0.58/1.05 Hz used
  // by fineWeather()'s height displacement -- and are multiplied together (rather than summed)
  // so colour patches read as chaotic 30-55m blotches independent of the terrain's own ripple,
  // instead of tracing it.
  function weatherTint(x, z, seed, vparams) {
    var macro = H.noise2(x * 0.018, z * 0.022, seed + 5);    // ~45-55m broad discoloration blobs
    var macro2 = H.noise2(x * 0.031, z * 0.026, seed + 6);   // second, differently-oriented low-freq layer
    var patch = H.noise2(x * 0.07, z * 0.06, seed + 1);      // mid-scale honey patches
    var fine = H.noise2(x * 0.15, z * 0.16, seed + 3);       // fine mottling, kept below vertex-grid Nyquist to avoid banding
    var honey = (0.5 + 0.5 * macro) * (0.55 + 0.45 * (0.5 + 0.5 * macro2)) * (0.7 + 0.3 * (0.5 + 0.5 * patch));
    var mult = 0.8 + 0.36 * honey + 0.04 * fine;
    var streakN = H.noise2(x * 0.013, z * 0.016, seed + 2);   // very broad water-streak/lichen bands
    // Wide, soft-edged falloff (rather than a hard threshold) so the darkened bands blend across
    // the coarse cliff mesh instead of showing as blocky facets at close range.
    var streak = clamp01((-0.05 - streakN) / 0.85);
    if (vparams) {
      // Directional water-stain / iron-oxide streaks down the cliff face: a sine wave along the
      // cliff's arc length whose phase is perturbed by low-frequency noise (so streaks land
      // irregularly rather than at perfectly even intervals), gated to a band per streak, and
      // ramped so staining concentrates near the base and fades out toward the plateau rim.
      var s = vparams.a * 130; // approx arc-length coordinate around the ellipse
      var phase = s * 0.28 + H.noise2(s * 0.015, 0, seed + 11) * 5;
      var band = Math.pow(Math.max(0, cos(phase)), 6);
      var ramp = clamp01((-vparams.y) / 46);
      var irregular = 0.4 + 0.6 * (0.5 + 0.5 * H.noise2(s * 0.05, vparams.y * 0.08, seed + 12));
      streak = clamp01(streak * 0.55 + band * ramp * irregular);
    }
    var r = mult * (1 - 0.28 * streak);
    var g = mult * (1 - 0.11 * streak); // lichen reads greenish: green channel darkens least
    var b = mult * (1 - 0.32 * streak);
    return [clamp01(r), clamp01(g), clamp01(b)];
  }
  function paintVertexColors(geo, seed, cliffMode) {
    var pos = geo.attributes.position, arr = pos.array, n = pos.count;
    var col = new Float32Array(n * 3);
    for (var vi = 0; vi < n; vi++) {
      var x = arr[vi * 3], y = arr[vi * 3 + 1], z = arr[vi * 3 + 2];
      var vparams = cliffMode ? { y: y, a: Math.atan2((z - CZ) / RZ, (x - CX) / RX) } : null;
      var c = weatherTint(x, z, seed, vparams);
      col[vi * 3] = c[0]; col[vi * 3 + 1] = c[1]; col[vi * 3 + 2] = c[2];
    }
    geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  }
  function weatheredMat(base, seed, uvScaleOverride) {
    var m = base.clone();
    m.vertexColors = true;
    m.userData = {}; // fresh object: don't mutate the shared mats.* material's userData
    for (var uk in base.userData) m.userData[uk] = base.userData[uk]; // keep uvScale for finishScene's box-projected UVs
    // mats.rock's baked texture has horizontal strata bands at its native 14m tile: correct for a
    // vertical cliff face, but box-projected onto a horizontal surface (top-down u=x,v=z) they
    // show up as a tight, unnaturally regular ripple every ~2.3m -- a texture-tiling artifact, not
    // a geometry one, so it survives any change to the height-field or vertex-colour noise alone.
    // A much larger tile on this clone only spreads that same texture into broad, soft bands.
    if (uvScaleOverride) m.userData.uvScale = uvScaleOverride;
    return m;
  }

  // ---------------- 1. Plateau top: worn limestone, bedrock patches, cuttings ----------------
  var PW = 300, PD = 150, segX = MOBILE ? 72 : 130, segZ = MOBILE ? 36 : 66;
  var topGeo = new THREE.PlaneGeometry(PW, PD, segX, segZ);
  topGeo.rotateX(-PI / 2);
  var cuttings = [
    { x: -95, z: 30, w: 16, d: 10, depth: 1.4 },
    { x: 35, z: -50, w: 12, d: 8, depth: 1.0 },
    { x: -20, z: 55, w: 20, d: 9, depth: 0.9 }
  ];
  function cutAt(x, z) {
    var cut = 0;
    for (var i = 0; i < cuttings.length; i++) {
      var c = cuttings[i];
      var dx = Math.abs(x - c.x) / (c.w / 2), dz = Math.abs(z - c.z) / (c.d / 2);
      var r = Math.max(dx, dz);
      if (r < 1) cut = Math.max(cut, c.depth * (1 - r * r) );
    }
    return cut;
  }
  // Fractal weathering detail: extra octaves layered on top of the broad shape so the surface
  // reads as irregularly worn limestone rather than a smooth digital ripple. Frequencies are kept
  // well below the plateau mesh's own vertex density (~2.3m desktop, ~4.2m mobile spacing) --
  // the previous 0.58/1.05 Hz octaves sat far past that grid's Nyquist limit, which produced a
  // severe aliasing artifact (regular "corduroy" banding under raking light) rather than organic
  // irregularity. Kept small in amplitude so it reads as surface texture, not landform.
  function fineWeather(x, z) {
    return 0.6 * H.noise2(x * 0.045, z * 0.05, 511) + 0.4 * H.noise2(x * 0.085, z * 0.09, 517);
  }
  var pos = topGeo.attributes.position, arr = pos.array;
  for (var i = 0; i < arr.length; i += 3) {
    var x = arr[i], z = arr[i + 2];
    var e = sqrt((x / 150) * (x / 150) + (z / 75) * (z / 75));
    var base = 4 * (0.6 * H.noise2(x * 0.02, z * 0.02, 7) + 0.4 * H.noise2(x * 0.08, z * 0.08, 16));
    var bedrock = H.noise2(x * 0.04, z * 0.055, 23);
    var patch = bedrock > 0.42 ? (bedrock - 0.42) * 5.5 : 0; // exposed bedrock ridges poke up
    var y = base + patch;
    if (e < 0.6) y *= 0.22 + 0.15 * Math.max(0, bedrock); // mostly flat esplanade, bedrock still shows
    else if (e > 0.88) y -= (e - 0.88) * 40; // fold down toward the cliff edge
    y += 0.22 * fineWeather(x, z) * (e < 0.6 ? 1 : 0.6); // fine weathering irregularity, breaks the uniform ripple
    y -= cutAt(x, z);
    arr[i + 1] = y;
  }
  pos.needsUpdate = true;
  topGeo.computeVertexNormals();
  paintVertexColors(topGeo, 700);
  var top = new THREE.Mesh(topGeo, weatheredMat(mats.rock, 700, 150));
  top.position.set(-45, 0, 0);
  top.receiveShadow = true;
  group.add(top);
  function plateauHeight(lx, lz) {
    var e = sqrt((lx / 150) * (lx / 150) + (lz / 75) * (lz / 75));
    var base = 4 * (0.6 * H.noise2(lx * 0.02, lz * 0.02, 7) + 0.4 * H.noise2(lx * 0.08, lz * 0.08, 16));
    var bedrock = H.noise2(lx * 0.04, lz * 0.055, 23);
    var patch = bedrock > 0.42 ? (bedrock - 0.42) * 5.5 : 0;
    var y = base + patch;
    if (e < 0.6) y *= 0.22 + 0.15 * Math.max(0, bedrock);
    else if (e > 0.88) y -= (e - 0.88) * 40;
    y += 0.22 * fineWeather(lx, lz) * (e < 0.6 ? 1 : 0.6);
    return y - cutAt(lx, lz);
  }

  // Scattered marble fragments: broken column-drum stubs, capital blocks and slabs, tinted
  // per-batch (light/mid/dark weathering) since InstancedMesh in r128 has no per-instance colour.
  var fragR = lcg(51);
  var drumGeo = new THREE.CylinderGeometry(0.55, 0.6, 0.5, 10);
  var capGeo = new THREE.BoxGeometry(0.9, 0.45, 0.9);
  var slabGeo = new THREE.BoxGeometry(1.3, 0.3, 0.8);
  var fragBuckets = { drum: [[], [], []], cap: [[], [], []], slab: [[], [], []] };
  var fragCount = MOBILE ? 26 : 48;
  for (var f = 0; f < fragCount; f++) {
    // 60% cluster within ~10m of the perimeter (where walls/structures actually shed debris via
    // collapse and quarrying), 40% scattered across the open plateau centre.
    var rim = fragR() < 0.6;
    var a = fragR() * PI * 2;
    var e2 = rim ? (0.80 + fragR() * 0.15) : (0.05 + fragR() * 0.68);
    var lx = cos(a) * 150 * e2, lz = sin(a) * 75 * e2;
    var ly = plateauHeight(lx, lz);
    var tiltX = (fragR() - 0.5) * 0.9, tiltZ = (fragR() - 0.5) * 0.9;
    var bucket = (fragR() * 3) | 0;
    var yaw = fragR() * PI * 2; // full 360-degree orientation
    var scaleV = 0.5 + fragR() * 2.0; // 0.5x - 2.5x relative size
    var pick = fragR();
    if (pick < 0.45) fragBuckets.drum[bucket].push({ p: [lx, ly + 0.25 * scaleV, lz], r: [tiltX, yaw, tiltZ * 0.6], s: [scaleV, scaleV, scaleV] });
    else if (pick < 0.7) fragBuckets.cap[bucket].push({ p: [lx, ly + 0.22 * scaleV, lz], r: [tiltX * 0.5, yaw, tiltZ * 0.5], s: [scaleV, scaleV, scaleV] });
    else fragBuckets.slab[bucket].push({ p: [lx, ly + 0.15 * scaleV, lz], r: [tiltX * 0.5, yaw, tiltZ * 0.5], s: [scaleV, scaleV, scaleV] });
  }
  var fragGroup = new THREE.Group();
  fragGroup.position.set(-45, 0, 0);
  var fragTints = [0.76, 0.94, 1.08]; // weathered dark -> clean-ish, simulating lichen/patina variety
  [['drum', drumGeo], ['cap', capGeo], ['slab', slabGeo]].forEach(function (entry) {
    var shape = entry[0], geo = entry[1];
    for (var b = 0; b < 3; b++) {
      var list = fragBuckets[shape][b];
      if (!list.length) continue;
      var m = mats.marbleWorn.clone();
      m.color.setScalar(fragTints[b]);
      fragGroup.add(H.instance(geo, m, list));
    }
  });
  group.add(fragGroup);

  // Sparse dry grass tufts near the plateau edge
  var grassR = lcg(93);
  var bladeGeo = new THREE.ConeGeometry(0.18, 0.7, 4);
  var tuftT = [];
  var tuftCount = MOBILE ? 30 : 90;
  for (var g = 0; g < tuftCount; g++) {
    var ga = grassR() * PI * 2, ge = 0.72 + grassR() * 0.22;
    var gx = cos(ga) * 150 * ge, gz = sin(ga) * 75 * ge;
    var gy = plateauHeight(gx, gz);
    for (var b2 = 0; b2 < 2; b2++) {
      var jx = gx + (grassR() - 0.5) * 0.6, jz = gz + (grassR() - 0.5) * 0.6;
      tuftT.push({ p: [jx, gy + 0.3, jz], r: [(grassR() - 0.5) * 0.3, grassR() * PI * 2, (grassR() - 0.5) * 0.3], s: [1, 0.7 + grassR() * 0.6, 1] });
    }
  }
  var grassGroup = new THREE.Group();
  grassGroup.position.set(-45, 0, 0);
  grassGroup.add(H.instance(bladeGeo, mats.grass, tuftT));
  group.add(grassGroup);

  // ---------------- 2. Stratified limestone cliff + talus, blending into the hillside ----------------
  // Radial profile from the plateau edge (t=0, y=0) down to the plain (t=1, y=-80), per-angle.
  var CX = -45, CZ = 0, RX = 150, RZ = 75;
  var CLIFF_T = 0.5; // near-vertical face below this t, scree apron above it
  function cliffRadiusMul(t, a, seed) {
    // Irregular strata ledges: band phase is offset per-angle so the courses are not
    // perfectly concentric rings (the "digitally obvious" flaw), depth also varies by angle.
    var phase = H.noise2(cos(a) * 3, sin(a) * 3, seed + 40) * 0.9;
    var bands = 9;
    var bt = t * bands + phase;
    var bandFrac = bt - Math.floor(bt);
    var ledgeDepth = 0.09 + 0.05 * H.noise2(cos(a) * 6.3, sin(a) * 6.3, seed + 41);
    var ledge = (t < CLIFF_T && bandFrac < 0.22) ? (0.22 - bandFrac) / 0.22 * ledgeDepth : 0;
    // Vertical erosion channels/fissures: frequency + amplitude both vary by location so
    // grooves read as natural crevices rather than a single regular sine ripple.
    var fissureFreq = 10 + 6 * H.noise2(cos(a) * 2.1, sin(a) * 2.1, seed + 42);
    var fissureAmp = 0.05 + 0.045 * H.noise2(cos(a) * 9, sin(a) * 9, seed + 43);
    var fissure = fissureAmp * Math.sin(a * fissureFreq + seed) * (1 - t * 0.4);
    // Patchy overhangs: only where a noise mask exceeds a threshold, not everywhere.
    var overhangMask = H.noise2(cos(a) * 11, sin(a) * 11, seed + 44);
    var overhang = (t > 0.08 && t < CLIFF_T - 0.02 && overhangMask > 0.22)
      ? (overhangMask - 0.22) * 0.6 * Math.sin((t - 0.08) / (CLIFF_T - 0.1) * PI)
      : 0;
    // Fine surface roughness so the rock face itself isn't a smooth ramp at any zoom level.
    var micro = 0.022 * H.noise2(cos(a) * 22 + t * 16, sin(a) * 22, seed + 45);
    var scree = t > CLIFF_T ? Math.pow((t - CLIFF_T) / (1 - CLIFF_T), 1.3) * 0.85 : 0;
    return 1 + ledge + fissure + overhang + scree + micro;
  }
  function cliffY(t) {
    // Steeper near-vertical face, easing into the gentler talus slope.
    if (t < CLIFF_T) return -t / CLIFF_T * 50;
    var tt = (t - CLIFF_T) / (1 - CLIFF_T);
    return -50 - (tt * tt * 0.55 + tt * 0.45) * 30;
  }
  function ringGeometry(rings, radial, matSeedOffset) {
    // Indexed grid with vertices shared between adjacent triangles (rather than duplicated per
    // face), so computeVertexNormals() averages normals across neighbouring faces and produces
    // smooth interpolated shading instead of hard per-facet boundaries at close range. The ellipse
    // is seamless in the angle parameter (cos/sin of a=2*PI give identical values at k=0 and
    // k=radial), so the radial direction wraps via modulo without needing a duplicate seam column.
    var vertCount = (rings + 1) * radial;
    var verts = new Float32Array(vertCount * 3);
    for (var r = 0; r <= rings; r++) {
      for (var k = 0; k < radial; k++) {
        var t = r / rings;
        var a = (k / radial) * PI * 2;
        var m = cliffRadiusMul(t, a, 5 + matSeedOffset);
        var idx = (r * radial + k) * 3;
        verts[idx] = CX + cos(a) * RX * m;
        verts[idx + 1] = cliffY(t);
        verts[idx + 2] = CZ + sin(a) * RZ * m;
      }
    }
    var indices = [];
    for (var r2 = 0; r2 < rings; r2++) {
      for (var k2 = 0; k2 < radial; k2++) {
        var k2n = (k2 + 1) % radial;
        var a0 = r2 * radial + k2, a1 = r2 * radial + k2n;
        var b0 = (r2 + 1) * radial + k2, b1 = (r2 + 1) * radial + k2n;
        indices.push(a0, b0, b1, a0, b1, a1);
      }
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return geo;
  }
  var radialSeg = MOBILE ? 90 : 190, ringSeg = MOBILE ? 26 : 46;
  var cliffGeo = ringGeometry(ringSeg, radialSeg, 0);
  paintVertexColors(cliffGeo, 900, true);
  var cliffMesh = new THREE.Mesh(cliffGeo, weatheredMat(mats.rockDark, 900));
  cliffMesh.castShadow = true;
  cliffMesh.receiveShadow = true;
  group.add(cliffMesh);
  function hillHeight(wx, wz) {
    var dx = wx - CX, dz = wz - CZ;
    var a = Math.atan2(dz / RZ, dx / RX);
    var e = sqrt((dx / RX) * (dx / RX) + (dz / RZ) * (dz / RZ));
    // invert e (roughly 1..1.85) back to t via the same profile shape
    var t = Math.min(1, Math.max(0, (e - 1) / 0.85));
    return cliffY(t);
  }

  // Ground plain
  var groundGeo = new THREE.PlaneGeometry(3400, 3400, 2, 2);
  groundGeo.rotateX(-PI / 2);
  var groundMesh = new THREE.Mesh(groundGeo, mats.ground);
  groundMesh.position.y = -80.4;
  groundMesh.receiveShadow = true;
  group.add(groundMesh);

  // ---------------- 3. Hillside vegetation: Aleppo pines, dense scrub clumps, talus debris ----------------
  var hillR = lcg(140);
  var trunkGeo = new THREE.CylinderGeometry(0.14, 0.22, 2.6, 6);
  var pineGeo = new THREE.IcosahedronGeometry(1.6, 0);
  var scrubGeo = new THREE.IcosahedronGeometry(0.55, 0);
  var pineTrunkT = [], pineCanopyT = [], scrubT = [];
  var pineCount = MOBILE ? 26 : 60;
  for (var p = 0; p < pineCount; p++) {
    var pa = hillR() * PI * 2, pt = 0.35 + hillR() * 0.55;
    var m = cliffRadiusMul(pt, pa, 5);
    var px = CX + cos(pa) * RX * m, pz = CZ + sin(pa) * RZ * m, py = cliffY(pt);
    var psc = 0.7 + hillR() * 0.6;
    pineTrunkT.push({ p: [px, py + 1.3 * psc, pz], s: [psc, psc, psc] });
    pineCanopyT.push({ p: [px, py + 2.9 * psc, pz], s: [psc * 1.1, psc * 0.55, psc * 1.1] });
  }
  // Dense scrub: clustered clumps (3-5 tufts within ~2m) rather than one tuft per sample point,
  // covering the whole slope down toward the plain, each tuft randomly rotated/scaled.
  var clusterCount = MOBILE ? 42 : 110;
  for (var sc = 0; sc < clusterCount; sc++) {
    var sa = hillR() * PI * 2, st = 0.4 + hillR() * 0.58;
    var sm = cliffRadiusMul(st, sa, 5);
    var sx = CX + cos(sa) * RX * sm, sz = CZ + sin(sa) * RZ * sm, sy = cliffY(st);
    var clumpN = 3 + ((hillR() * 3) | 0); // 3-5 tufts per clump
    for (var ci = 0; ci < clumpN; ci++) {
      var jang = hillR() * PI * 2, jr = hillR() * 2.0;
      var jx = sx + cos(jang) * jr, jz = sz + sin(jang) * jr;
      var ssc = 0.5 + hillR() * 0.75;
      scrubT.push({ p: [jx, sy + 0.32 * ssc, jz], r: [0, hillR() * PI * 2, 0], s: [ssc * (0.8 + hillR() * 0.4), ssc * 0.7, ssc * (0.8 + hillR() * 0.4)] });
    }
  }
  group.add(H.instance(trunkGeo, mats.trunk, pineTrunkT));
  group.add(H.instance(pineGeo, mats.foliageOlive, pineCanopyT));
  group.add(H.instance(scrubGeo, mats.scrub, scrubT));

  // Talus debris: a handful of large fallen boulders plus scattered small rubble in the
  // scree/talus band, so the cliff-to-plain transition reads as rockfall, not an abrupt seam.
  var taluR = lcg(271);
  // Warmer/brighter than the surrounding rock so the scree band separates visually at overview
  // distance -- component increments are allowed to push a channel past 1 (ACES tone mapping
  // compresses that back into a genuinely brighter highlight rather than a flat white clip).
  function warmBrighten(baseMat, dr, dg, db) {
    var m = baseMat.clone();
    m.color = new THREE.Color(m.color.r + dr, m.color.g + dg, m.color.b + db);
    return m;
  }
  var taluBoulderMat = warmBrighten(mats.rockDark, 0.18, 0.14, 0.06);
  var taluRubbleMat = warmBrighten(mats.rock, 0.16, 0.13, 0.07);
  var boulderGeo = new THREE.IcosahedronGeometry(1, 1);
  var boulderT = [];
  var boulderCount = MOBILE ? 8 : 14; // 1.5x the prior density
  for (var bo = 0; bo < boulderCount; bo++) {
    var ba = taluR() * PI * 2, btq = CLIFF_T + 0.06 + taluR() * 0.5;
    var bm = cliffRadiusMul(btq, ba, 5);
    var bx = CX + cos(ba) * RX * bm, bz = CZ + sin(ba) * RZ * bm, by = cliffY(btq);
    var bsc = 2.0 + taluR() * 3.5; // ~4-9m boulders (icosahedron radius 1 -> diameter 2*scale)
    boulderT.push({ p: [bx, by + bsc * 0.35, bz], r: [taluR() * PI, taluR() * PI, taluR() * PI], s: [bsc, bsc * (0.7 + taluR() * 0.4), bsc * (0.85 + taluR() * 0.3)] });
  }
  group.add(H.instance(boulderGeo, taluBoulderMat, boulderT));
  var rubbleGeo = new THREE.IcosahedronGeometry(0.32, 0);
  var rubbleT = [];
  var rubbleCount = MOBILE ? 110 : 260;
  for (var ru = 0; ru < rubbleCount; ru++) {
    var ra = taluR() * PI * 2, rtq = CLIFF_T + 0.02 + taluR() * 0.68;
    var rm2 = cliffRadiusMul(rtq, ra, 5);
    var rx = CX + cos(ra) * RX * rm2, rz = CZ + sin(ra) * RZ * rm2, ry = cliffY(rtq);
    var rsc = 0.5 + taluR() * 1.1;
    rubbleT.push({ p: [rx, ry + rsc * 0.2, rz], r: [taluR() * PI, taluR() * PI, taluR() * PI], s: [rsc, rsc * 0.8, rsc] });
  }
  group.add(H.instance(rubbleGeo, taluRubbleMat, rubbleT));

  // ---------------- 4. City of Athens: whitewashed houses along radiating streets ----------------
  var cityR = lcg(7);
  var bodyGeo = new THREE.BoxGeometry(1, 1, 1);
  var roofGeo = new THREE.ConeGeometry(0.82, 0.6, 4, 1);
  roofGeo.rotateY(PI / 4);
  var farGeo = new THREE.BoxGeometry(1, 1, 1);
  var microGeo = new THREE.BoxGeometry(1, 1, 1);
  var houseT = [], farT = [], microT = [];
  // Weathered terracotta roof variants (rust-brown, dusty ochre, dark/aged, weathered tan, plus a
  // toned-down "fresher" tone) so roofs stop reading as one flat saturated orange. The variant is
  // chosen from a low-frequency noise field sampled at the house's own position (not per-house
  // random pick), so neighbouring houses on the same block share a weathering state.
  var terracottaVariants = [
    [0.90, 0.42, 0.20], // fresher orange-red, still toned down from the old flat saturated hue
    [0.80, 0.50, 0.20], // rust-brown
    [0.90, 0.70, 0.40], // dusty ochre
    [0.62, 0.40, 0.27], // dark, aged
    [0.74, 0.56, 0.32]  // weathered tan
  ];
  var terracottaMats = terracottaVariants.map(function (c) {
    var m = mats.terracotta.clone();
    m.color.setRGB(c[0], c[1], c[2]);
    return m;
  });
  var roofBuckets = [[], [], [], [], []];
  function roofVariantAt(hx, hz) {
    var n = H.noise2(hx * 0.018, hz * 0.021, 601); // broad enough that whole blocks share a variant
    return Math.min(4, Math.max(0, Math.floor((n * 0.5 + 0.5) * 5)));
  }
  var placed = []; // coarse min-spacing check against already-placed houses
  var MIN_SPACING = 5.5;
  function tooClose(hx, hz) {
    for (var pi = 0; pi < placed.length; pi++) {
      var dx0 = placed[pi][0] - hx, dz0 = placed[pi][1] - hz;
      if (dx0 * dx0 + dz0 * dz0 < MIN_SPACING * MIN_SPACING) return true;
    }
    return false;
  }
  // Pale ground-texture cue along each street centreline, so the radial corridors read clearly
  // from an oblique view even where the houses along them thin out.
  var streetStripGeo = new THREE.BoxGeometry(1000, 0.05, 3.0);
  var streetStripT = [];
  var spokes = MOBILE ? 14 : 26;
  for (var sIdx = 0; sIdx < spokes; sIdx++) {
    var ang = (sIdx / spokes) * PI * 2 + cityR() * 0.1;
    streetStripT.push({ p: [-45 + cos(ang) * 695, -80.34, 0 + sin(ang) * 695], r: [0, -ang, 0] });
    var r = 210;
    var placedInSpoke = 0; // strict alternation -> the street corridor reads as a clean line, not a scatter
    while (r < 1250) {
      var density = clamp01(1 - r / 900); // continuous falloff: dense near the hill, thin with distance
      var step = (13 + cityR() * 9) / Math.max(0.14, density);
      r += step;
      if (cityR() > density + 0.12) continue;
      // Street corridor: keep an empty band straddling the spoke centreline (now 8-10m wide total),
      // houses set back from it on strictly alternating sides -> reads as buildings facing a street.
      var streetHalf = 4 + cityR() * 1;
      var setback = streetHalf + 1.5 + cityR() * (10 + r * 0.05);
      var side = (placedInSpoke % 2 === 0) ? 1 : -1;
      var jitter = side * setback;
      var hx = -45 + cos(ang) * r + cos(ang + PI / 2) * jitter;
      var hz = 0 + sin(ang) * r + sin(ang + PI / 2) * jitter;
      var dxk = hx + 45, dzk = hz;
      if ((dxk / 160) * (dxk / 160) + (dzk / 85) * (dzk / 85) < 1) continue;
      if (tooClose(hx, hz)) continue;
      placed.push([hx, hz]);
      placedInSpoke++;
      var yaw = cityR() * PI * 2;
      if (r < 780) {
        var sxh = 5 + cityR() * 6, szh = 5 + cityR() * 6, syh = 3.2 + cityR() * 3.2;
        houseT.push({ p: [hx, -80 + syh / 2, hz], r: [0, yaw, 0], s: [sxh, syh, szh] });
        roofBuckets[roofVariantAt(hx, hz)].push({ p: [hx, -80 + syh + 0.3 * ((sxh + szh) / 2) * 0.35, hz], r: [0, yaw, 0], s: [(sxh + szh) / 2 * 1.05, (sxh + szh) / 2 * 0.9, (sxh + szh) / 2 * 1.05] });
      } else if (r < 1050) {
        var sx2 = 6 + cityR() * 12, sz2 = 6 + cityR() * 12, sy2 = 4 + cityR() * 8;
        farT.push({ p: [hx, -80 + sy2 / 2, hz], r: [0, yaw, 0], s: [sx2, sy2, sz2] });
      } else {
        // Micro size class: distant buildings resolve to only a few pixels, so keep them tiny
        // and cheap while still reading as a townscape fading into the haze.
        var sx3 = 2.4 + cityR() * 3.2, sz3 = 2.4 + cityR() * 3.2, sy3 = 3 + cityR() * 4.5;
        microT.push({ p: [hx, -80 + sy3 / 2, hz], r: [0, yaw, 0], s: [sx3, sy3, sz3] });
      }
    }
  }
  var cityGroup = new THREE.Group();
  cityGroup.add(H.instance(bodyGeo, mats.plaster, houseT));
  for (var rv = 0; rv < 5; rv++) {
    if (roofBuckets[rv].length) cityGroup.add(H.instance(roofGeo, terracottaMats[rv], roofBuckets[rv]));
  }
  cityGroup.add(H.instance(farGeo, mats.city, farT));
  if (microT.length) cityGroup.add(H.instance(microGeo, mats.city, microT));
  if (streetStripT.length) cityGroup.add(H.instance(streetStripGeo, mats.plaster, streetStripT));
  group.add(cityGroup);

  // Cheap plain-shaft columns for distant background landmarks (no fluting/entasis: they read
  // as small silhouettes in the haze, so a full H.makeDoricColumns/H.makeIonicColumns colonnade
  // would spend triangles the viewer will never resolve).
  function cheapColonnade(positions, height, r, capMat, shaftMat) {
    var g = new THREE.Group();
    var shaftGeo = new THREE.CylinderGeometry(r * 0.85, r, height, 8);
    var capGeo2 = new THREE.BoxGeometry(r * 2.6, height * 0.06, r * 2.6);
    var shaftT = [], capT2 = [];
    for (var i = 0; i < positions.length; i++) {
      var px = positions[i][0], pz = positions[i][1];
      shaftT.push({ p: [px, height / 2, pz] });
      capT2.push({ p: [px, height + height * 0.03, pz] });
    }
    g.add(H.instance(shaftGeo, shaftMat, shaftT));
    g.add(H.instance(capGeo2, capMat, capT2));
    return g;
  }

  // Hephaisteion-like temple on a knoll, NW of the hill (a small, hazy silhouette)
  (function () {
    var knoll = new THREE.Mesh(new THREE.ConeGeometry(30, 9, 10), mats.rock);
    knoll.position.set(-500, -79, -300);
    knoll.receiveShadow = true;
    group.add(knoll);
    var tGroup = new THREE.Group();
    tGroup.position.set(-500, -75, -300);
    var cols = [];
    var colW = 5.6, colD = 12, nx = 6, nz = 10;
    for (var cx2 = 0; cx2 < nx; cx2++) cols.push([-colW / 2 + cx2 * (colW / (nx - 1)), -colD / 2]);
    for (var cx3 = 0; cx3 < nx; cx3++) cols.push([-colW / 2 + cx3 * (colW / (nx - 1)), colD / 2]);
    for (var cz2 = 1; cz2 < nz - 1; cz2++) { cols.push([-colW / 2, -colD / 2 + cz2 * (colD / (nz - 1))]); cols.push([colW / 2, -colD / 2 + cz2 * (colD / (nz - 1))]); }
    tGroup.add(cheapColonnade(cols, 4.2, 0.26, mats.marble, mats.marble));
    var base = new THREE.Mesh(new THREE.BoxGeometry(colW + 1.2, 0.6, colD + 1.2), mats.marble);
    base.position.y = 0.3;
    base.receiveShadow = true;
    tGroup.add(base);
    var roof = new THREE.Mesh(new THREE.ConeGeometry(Math.max(colW, colD) * 0.72, 2.2, 4), mats.terracotta);
    roof.rotation.y = PI / 4;
    roof.position.y = 4.2 + 1.7;
    roof.scale.set(1, 1, colD / colW);
    roof.castShadow = true;
    tGroup.add(roof);
    group.add(tGroup);
  })();

  // Stoa of Attalos: a long colonnaded portico facing the ancient agora (background silhouette)
  (function () {
    var sGroup = new THREE.Group();
    sGroup.position.set(-330, -80, -160);
    sGroup.rotation.y = 0.5;
    var n = 15, len = 56, colsA = [];
    for (var i2 = 0; i2 < n; i2++) colsA.push([-len / 2 + i2 * (len / (n - 1)), 0]);
    sGroup.add(cheapColonnade(colsA, 5.2, 0.24, mats.marble, mats.marble));
    var back = new THREE.Mesh(new THREE.BoxGeometry(len + 2, 6.2, 1.2), mats.city);
    back.position.set(0, 3.1, -5.5);
    back.castShadow = true; back.receiveShadow = true;
    sGroup.add(back);
    var stoaRoof = new THREE.Mesh(new THREE.BoxGeometry(len + 3, 0.4, 8), mats.terracotta);
    stoaRoof.position.set(0, 6.4, -2.5);
    stoaRoof.castShadow = true; stoaRoof.receiveShadow = true;
    sGroup.add(stoaRoof);
    group.add(sGroup);
  })();

  // ---------------- 5. Sacred Way ----------------
  var sacredTransforms = [];
  for (var sw = 0; sw < 30; sw++) {
    var t2 = sw / 29;
    var swx = -200 + t2 * 60, swy = -60 + t2 * 58, swz = 40 + t2 * (-36);
    sacredTransforms.push({ p: [swx, swy, swz], r: [0, 0, 0], s: [6, 0.3, 5] });
  }
  var sacredMesh = H.instance(new THREE.BoxGeometry(1, 1, 1), mats.marbleShadowed, sacredTransforms);
  sacredMesh.castShadow = false;
  sacredMesh.receiveShadow = true;
  group.add(sacredMesh);

  return group;
};
