<title>Acropolis of Athens</title>
<meta name="description" content="Interactive 3D reconstruction of the Acropolis of Athens, rendered procedurally with three.js.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&display=swap">
<style>
  :root { --ink: #f2ece0; --panel: rgba(20, 24, 30, .62); --accent: #e3c78a; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: #87b6de; color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { position: fixed; inset: 0; z-index: 0; }
  #legend, #hint, #autorot, #debug { z-index: 5; }
  #app canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; }
  #legend { position: fixed; left: 12px; bottom: 12px; max-width: min(300px, 46vw); padding: 10px 12px; border-radius: 10px;
    background: var(--panel); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); font-size: 12px; line-height: 1.5; }
  #legend h1 { margin: 0 0 4px; font: 600 14px/1.3 Cinzel, "Trajan Pro", Georgia, serif; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  #legend ul { margin: 0; padding: 0; list-style: none; }
  #legend li::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; background: var(--dot, #e8e0cf); vertical-align: middle; }
  #hint { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); padding: 6px 12px; border-radius: 999px; background: var(--panel);
    backdrop-filter: blur(6px); font-size: 12px; max-width: calc(100vw - 32px); box-sizing: border-box; text-align: center; transition: opacity 1.2s ease; pointer-events: none; }
  #autorot { position: fixed; right: 12px; bottom: 12px; width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--panel);
    color: var(--ink); font-size: 20px; cursor: pointer; backdrop-filter: blur(6px); }
  #autorot.off { opacity: .5; }
  #debug { position: fixed; top: 12px; right: 12px; padding: 4px 8px; border-radius: 6px; background: var(--panel); font: 12px ui-monospace, Menlo, Consolas, monospace; }
  #legend li { display: flex; align-items: baseline; }
  #legend li::before { flex: none; }
  #legend .credits { margin: 6px 0 0; font-size: 10px; line-height: 1.35; opacity: .7; }
  #legend button { all: unset; cursor: pointer; border-radius: 4px; }
  #legend button:hover { color: var(--accent); }
  #legend button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 640px) { #legend { font-size: 11px; padding: 8px 10px; } #legend h1 { font-size: 13px; } }
</style>

</div>

<script data-module="00-config.js">
// 00-config: shared constants
window.CFG = (function () {
  var mobile = (typeof innerWidth === 'number') && innerWidth < 640;
  return {
    PLATEAU_H: 80, PLATEAU_X: 300, PLATEAU_Z: 150, PLATEAU_CX: -45, PLATEAU_CZ: 0,
    MOBILE: mobile,
    SEG: mobile ? { colRadial: 24, colHeight: 2, capital: 16 } : { colRadial: 40, colHeight: 4, capital: 24 }
  };
})();

</script>
<script data-module="01-mats.js">
// Module 01: photoreal procedural material + texture library.
// Fast ImageData synthesis (seeded hash noise, deterministic, no RNG calls), Sobel-derived normal maps,
// world-scale-aware UV re-projection via mats.finishScene(scene, renderer).
window.buildMats = function (THREE) {
  var HAS_DOC = typeof document !== 'undefined';
  var MOBILE = !!(window.CFG && window.CFG.MOBILE);
  // realism phase 2: these procedural fields are now only the instant-first-frame fallback
  // (assets/tex/*.jpg swap in moments later via mats.finishScene's progressive loader), so
  // the synthesis budget is cut well below the old "final" quality target.
  var SIZE = 512;                      // final texture size
  var GEN = MOBILE ? 160 : 256;        // synthesis resolution for the primary (hero) fields
  var GEN_S = MOBILE ? 112 : 176;      // synthesis resolution for secondary fields
  var ALL_TEX = [];

  // ---------------------------------------------------------------
  // Seeded, trig-free integer hash -> tileable value noise -> fbm.
  // Periods are always integral so RepeatWrapping textures tile seamlessly.
  // ---------------------------------------------------------------
  function hashP(ix, iz, seed, px, pz) {
    ix = ((ix % px) + px) % px;
    iz = ((iz % pz) + pz) % pz;
    var h = (ix * 374761393 + iz * 668265263 + seed * 2246822519) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h = h ^ (h >>> 16);
    return (h >>> 0) / 4294967295;
  }
  function vnoiseP(x, z, seed, px, pz) {
    var xi = Math.floor(x), zi = Math.floor(z);
    var xf = x - xi, zf = z - zi;
    var u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
    var h00 = hashP(xi, zi, seed, px, pz), h10 = hashP(xi + 1, zi, seed, px, pz);
    var h01 = hashP(xi, zi + 1, seed, px, pz), h11 = hashP(xi + 1, zi + 1, seed, px, pz);
    return (h00 * (1 - u) + h10 * u) * (1 - v) + (h01 * (1 - u) + h11 * u) * v;
  }
  // Seamlessly tileable fbm over u,v in [0,1). fx/fz = base cell counts per axis (independent -> anisotropic stretch).
  function fbmTile(u, v, seed, fx, fz, oct, gain) {
    var amp = 0.5, sum = 0, norm = 0, mul = 1, i;
    for (i = 0; i < oct; i++) {
      var px = Math.max(1, Math.round(fx * mul)), pz = Math.max(1, Math.round(fz * mul));
      sum += amp * vnoiseP(u * px, v * pz, seed + i * 101, px, pz);
      norm += amp; amp *= gain; mul *= 2;
    }
    return sum / norm;
  }
  function warpTile(u, v, seed, fx, fz, oct, gain, warpAmt) {
    if (!warpAmt) return fbmTile(u, v, seed, fx, fz, oct, gain);
    var wf = Math.max(1, Math.round(fx * 0.4));
    var wu = fbmTile(u, v, seed + 811, wf, wf, 3, 0.5) - 0.5;
    var wv = fbmTile(u, v, seed + 1637, wf, wf, 3, 0.5) - 0.5;
    return fbmTile(u + wu * warpAmt, v + wv * warpAmt, seed, fx, fz, oct, gain);
  }
  function ridgeTile(u, v, seed, fx, fz, oct) {
    var amp = 0.5, sum = 0, norm = 0, mul = 1, i;
    for (i = 0; i < oct; i++) {
      var px = Math.max(1, Math.round(fx * mul)), pz = Math.max(1, Math.round(fz * mul));
      var n = vnoiseP(u * px, v * pz, seed + i * 53, px, pz);
      var r = 1 - Math.abs(2 * n - 1);
      sum += amp * r * r; norm += amp; amp *= 0.5; mul *= 2;
    }
    return sum / norm;
  }
  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function smooth(a, b, x) { var t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function byte(x) { x = x < 0 ? 0 : x > 255 ? 255 : x; return x | 0; }
  function fastHash(ix, iz, seed) {
    var h = (ix * 1274126177 + iz * 668265263 + seed * 374761393) | 0;
    h = Math.imul(h ^ (h >>> 15), 2246822519);
    h = h ^ (h >>> 13);
    return (h >>> 0) / 4294967295;
  }

  // ---------------------------------------------------------------
  // Canvas plumbing
  // ---------------------------------------------------------------
  function newCanvas(n) { var c = document.createElement('canvas'); c.width = c.height = n; return c; }
  function arrToCanvas(data, res) {
    var c = newCanvas(res), ctx = c.getContext('2d');
    var img = ctx.createImageData(res, res);
    img.data.set(data);
    ctx.putImageData(img, 0, 0);
    return c;
  }
  function upscale(src, size) {
    if (src.width === size) return src;
    var c = newCanvas(size), ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(src, 0, 0, size, size);
    return c;
  }
  function addFineGrain(canvas, amount, seed) {
    var res = canvas.width, ctx = canvas.getContext('2d');
    var img = ctx.getImageData(0, 0, res, res), d = img.data, x, y;
    for (y = 0; y < res; y++) {
      for (x = 0; x < res; x++) {
        var g = (fastHash(x, y, seed) - 0.5) * amount * 255;
        var i = (y * res + x) * 4;
        d[i] = byte(d[i] + g); d[i + 1] = byte(d[i + 1] + g); d[i + 2] = byte(d[i + 2] + g);
      }
    }
    ctx.putImageData(img, 0, 0);
  }
  // Very sparse, very-high-frequency bright specks (quartz-sparkle proxy). Applied at
  // full canvas resolution (post-upscale) so it stays crisp instead of blurring away.
  function addSparkle(canvas, density, seed) {
    var res = canvas.width, ctx = canvas.getContext('2d');
    var img = ctx.getImageData(0, 0, res, res), d = img.data, x, y;
    var thresh = 1 - density;
    for (y = 0; y < res; y++) {
      for (x = 0; x < res; x++) {
        var h = fastHash(x, y, seed);
        if (h > thresh) {
          var boost = ((h - thresh) / density) * 44;
          var i = (y * res + x) * 4;
          d[i] = byte(d[i] + boost); d[i + 1] = byte(d[i + 1] + boost); d[i + 2] = byte(d[i + 2] + boost * 0.9);
        }
      }
    }
    ctx.putImageData(img, 0, 0);
  }
  function toTexture(canvas, srgb) {
    var t = new THREE.CanvasTexture(canvas);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    if (srgb) t.encoding = THREE.sRGBEncoding;
    t.needsUpdate = true;
    ALL_TEX.push(t);
    return t;
  }
  // Sobel filter over a wrapped height field -> tangent-space normal map canvas.
  function heightToNormalCanvas(height, res, strength) {
    var out = new Uint8ClampedArray(res * res * 4);
    function h(x, z) { x = ((x % res) + res) % res; z = ((z % res) + res) % res; return height[z * res + x]; }
    var x, z;
    for (z = 0; z < res; z++) {
      for (x = 0; x < res; x++) {
        var tl = h(x - 1, z - 1), tc = h(x, z - 1), tr = h(x + 1, z - 1);
        var l = h(x - 1, z), r = h(x + 1, z);
        var bl = h(x - 1, z + 1), bc = h(x, z + 1), br = h(x + 1, z + 1);
        var gx = (tr + 2 * r + br) - (tl + 2 * l + bl);
        var gy = (bl + 2 * bc + br) - (tl + 2 * tc + tr);
        var nx = -gx * strength, ny = -gy * strength, nz = 1;
        var len = Math.sqrt(nx * nx + ny * ny + nz * nz);
        nx /= len; ny /= len; nz /= len;
        var i = (z * res + x) * 4;
        out[i] = byte((nx * 0.5 + 0.5) * 255);
        out[i + 1] = byte((ny * 0.5 + 0.5) * 255);
        out[i + 2] = byte((nz * 0.5 + 0.5) * 255);
        out[i + 3] = 255;
      }
    }
    return arrToCanvas(out, res);
  }

  // Applies a pronounced grounding grime: surfaces darken and warm toward their own base
  // (ancient-marble water-runoff + dust look), heaviest right at grade and fading out over
  // the lower few metres. Uses LOCAL (pre-modelMatrix) vertex Y, not world Y: per the helper
  // contract (H.makeSteppedBase/makeEntablature/makeDoricColumns etc.) each architectural
  // piece is authored with its own y=0 at its base, so this reads correctly on every group
  // regardless of how high that group's platform sits in world space (Parthenon +1.65,
  // Erechtheion +1, Nike bastion +4, ...) — a world-Y version would put whole raised
  // buildings entirely above the darkening threshold and never show any grime on them.
  // Cheap: a few shader-chunk string replacements, no extra texture samples.
  // roughWeather=true (marble family only) also grades roughnessFactor from the same
  // local-height signal: polished-feeling near the top of a piece, much rougher/weathered
  // right at its own base -- addresses the "should graduate polished -> very rough" note.
  function addGroundGrime(mat, roughWeather) {
    mat.onBeforeCompile = function (shader) {
      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', '#include <common>\nvarying float vGrimeY;')
        .replace('#include <begin_vertex>', '#include <begin_vertex>\nvGrimeY = transformed.y;');
      var frag = shader.fragmentShader
        .replace('#include <common>', '#include <common>\nvarying float vGrimeY;');
      if (roughWeather) {
        frag = frag.replace('#include <roughnessmap_fragment>',
          '#include <roughnessmap_fragment>\n' +
          '{ float rG = clamp(1.0 - (vGrimeY + 1.0) / 4.0, 0.0, 1.0); rG *= rG; ' +
          'roughnessFactor = clamp(roughnessFactor * (0.8 + rG * 0.5), 0.0, 1.0); }');
      }
      frag = frag.replace('#include <dithering_fragment>',
        '#include <dithering_fragment>\n' +
        '{ float gGrime = clamp(1.0 - (vGrimeY + 1.0) / 4.0, 0.0, 1.0); gGrime *= gGrime; ' +
        'gl_FragColor.rgb = mix(gl_FragColor.rgb, gl_FragColor.rgb * vec3(0.46, 0.38, 0.30), gGrime * 0.55); }');
      shader.fragmentShader = frag;
    };
  }

  var mats = {};

  // No-canvas environments (should not occur in practice: index.html always runs in a
  // browser) get flat-color materials so the module never throws.
  if (!HAS_DOC) {
    function flat(hex, rough, metal) { return new THREE.MeshStandardMaterial({ color: hex, roughness: rough, metalness: metal || 0 }); }
    mats.marble = flat(0xe9decc, 0.72); mats.marbleWorn = flat(0xd6c9ac, 0.85); mats.marbleShadowed = flat(0xc4b89c, 0.88);
    mats.rock = flat(0xb2aa99, 0.95); mats.rockDark = flat(0x767065, 0.97); mats.ground = flat(0xaca595, 0.98);
    mats.city = flat(0xcfc4ab, 0.9); mats.terracotta = flat(0xa05f46, 0.75); mats.bronze = flat(0x63503a, 0.4, 0.9);
    mats.foliageOlive = flat(0x6e7b57, 0.95); mats.foliageCypress = flat(0x38492f, 0.95); mats.trunk = flat(0x584634, 0.95);
    mats.marbleStatue = flat(0xe9e0c8, 0.5); mats.marbleRelief = flat(0xd6c9ac, 0.85); mats.bronzePatina = flat(0x5a7869, 0.7, 0.5);
    mats.gold = flat(0xc9a04a, 0.3, 1); mats.ivory = flat(0xf0e6cf, 0.5); mats.grass = flat(0x8c8552, 0.95);
    mats.scrub = flat(0x7c7848, 0.95); mats.plaster = flat(0xe0d6c2, 0.9);
    mats.finishScene = function () {};
    return mats;
  }

  // =================================================================
  // MARBLE FAMILY: one hero field (marble/marbleWorn/marbleShadowed/marbleRelief share
  // it, only colour grading + weathering weight differ) and one finer field for statues.
  // =================================================================
  function genMarbleField(res, seed) {
    var color = new Uint8ClampedArray(res * res * 4);
    var height = new Float32Array(res * res);
    var patina = new Float32Array(res * res);
    var streak = new Float32Array(res * res);
    var vein = new Float32Array(res * res);
    var x, y;
    for (y = 0; y < res; y++) {
      var v = (y + 0.5) / res;
      for (x = 0; x < res; x++) {
        var u = (x + 0.5) / res, i = y * res + x;
        var grain = warpTile(u, v, seed, 5, 5, 6, 0.5, 0.4);           // fine crystalline grain, warped, 6 octaves
        var vr = ridgeTile(u * 1.0, v * 1.0, seed + 71, 4, 4, 3);
        var vn = smooth(0.72, 0.94, vr) * 0.75;                        // thin grey veins
        var pn = smooth(0.42, 0.8, warpTile(u, v, seed + 233, 3, 3, 4, 0.5, 0.5)); // honey/iron patches, wider spread
        var sk = warpTile(u, v * 0.4, seed + 577, 6, 16, 4, 0.5, 0.55) * smooth(0.35, 0.88, warpTile(u * 2.3, v, seed + 900, 7, 5, 3, 0.5, 0.35)); // vertical streak blobs, warped to avoid a regular repeat
        // Fine stress-crack network: high-octave ridge noise, mid-scale-fbm-warped so cracks
        // meander instead of forming a rigid grid, isolated to sparse thin ridge peaks only.
        var crackWarpU = u + (fbmTile(u, v, seed + 811, 6, 6, 3, 0.5) - 0.5) * 0.18;
        var crackWarpV = v + (fbmTile(u, v, seed + 812, 6, 6, 3, 0.5) - 0.5) * 0.18;
        var crackN = ridgeTile(crackWarpU, crackWarpV, seed + 950, 27, 27, 8);
        // Per-pixel threshold jitter (art-director r2 note) so the ridge-noise crack network
        // doesn't read as a perfectly regular repeat: +-0.03 shifts the onset threshold,
        // giving ~10-20% amplitude variation across the field.
        var crackJit = (fbmTile(u, v, seed + 960, 5, 5, 3, 0.5) - 0.5) * 0.06;
        var crackAmt = smooth(0.8 + crackJit, 0.965, crackN);
        height[i] = clamp01(0.5 + (grain - 0.5) * 0.5 - vn * 0.12 - crackAmt * 0.17);
        vein[i] = vn; patina[i] = pn; streak[i] = clamp01(sk);
        var base = [233, 222, 200];        // creamy white Pentelic base (art-director spec)
        var veinCol = [196, 188, 172];
        var patinaCol = [214, 190, 150];   // soft honey/ochre wash (art-director spec)
        var c = lerpC(base, veinCol, vn * 0.35);
        c = lerpC(c, patinaCol, pn * 0.42);
        var gshade = (grain - 0.5) * 26 - crackAmt * 6;
        var di = i * 4;
        color[di] = byte(c[0] + gshade); color[di + 1] = byte(c[1] + gshade * 0.92); color[di + 2] = byte(c[2] + gshade * 0.8); color[di + 3] = 255;
      }
    }
    return { color: color, height: height, patina: patina, streak: streak, vein: vein, res: res };
  }
  function lerpC(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }

  function paintMarbleVariant(field, opts) {
    var res = field.res, out = new Uint8ClampedArray(res * res * 4), rm = new Uint8ClampedArray(res * res * 4);
    var grimeCol = [86, 78, 65];
    var i, di;
    for (i = 0; i < res * res; i++) {
      di = i * 4;
      var r = field.color[di], g = field.color[di + 1], b = field.color[di + 2];
      var patina = field.patina[i] * opts.patina;
      var streak = field.streak[i] * opts.streak;
      var grime = Math.max(patina * 0.4, streak) * opts.grime;
      var c = lerpC([r, g, b], grimeCol, clamp01(grime));
      c = [c[0] * opts.darken, c[1] * opts.darken, c[2] * opts.darken];
      out[di] = byte(c[0]); out[di + 1] = byte(c[1]); out[di + 2] = byte(c[2]); out[di + 3] = 255;
      var rough = clamp01(opts.roughBase + (patina + streak) * opts.roughVar - (field.height[i] - 0.5) * 0.06);
      rm[di] = 255; rm[di + 1] = byte(rough * 255); rm[di + 2] = 0; rm[di + 3] = 255;
    }
    var smallCanvas = arrToCanvas(out, res);
    if (opts.grainAmt) addFineGrain(smallCanvas, opts.grainAmt, opts.seed || 1);
    var colorCanvas = upscale(smallCanvas, SIZE);
    // Sparkle (sparse quartz-fleck highlights) is applied at full SIZE resolution, post-
    // upscale, so those single-pixel specks stay crisp instead of being blurred away by the
    // upscale blit; it's cheap because the density is very low (few flagged pixels per tile).
    if (opts.sparkleAmt) addSparkle(colorCanvas, opts.sparkleAmt, (opts.seed || 1) + 4000);
    var m = {};
    m.map = toTexture(colorCanvas, true);
    m.roughnessMap = toTexture(upscale(arrToCanvas(rm, res), SIZE), false);
    m.normalMap = toTexture(upscale(heightToNormalCanvas(field.height, res, opts.normalStrength), SIZE), false);
    return m;
  }

        var basePos = [tt.p[0] - nx * grooveDepth * 0.5, tt.p[1], tt.p[2] - nz * grooveDepth * 0.5];
        (worn ? trigWornT : trigT).push({ p: basePos, r: tt.r });
        // Tangent (local width axis) for the ridge offsets.
        var ca = cos(tt.r[1]), sa = sin(tt.r[1]);
        var tx = ca, tz = -sa;
        var ridgeList = worn ? ridgeWornT : ridgeT;
        for (var rIdx = -1; rIdx <= 1; rIdx++) {
          var off = rIdx * ridgeW * 1.35;
          ridgeList.push({
            p: [tt.p[0] + tx * off + nx * grooveDepth * 0.5, tt.p[1], tt.p[2] + tz * off + nz * grooveDepth * 0.5],
            r: tt.r
          });
        }
      }
      group.add(H.instance(trigGeo, mats.marble, trigT));
      if (trigWornT.length) group.add(H.instance(trigGeo, mats.marbleWorn, trigWornT));
      group.add(H.instance(ridgeGeo, mats.marble, ridgeT));
      if (ridgeWornT.length) group.add(H.instance(ridgeGeo, mats.marbleWorn, ridgeWornT));

      // Regulae + guttae under the taenia, aligned above each triglyph —
      // sized up ~40% over the previous pass so they read as distinct
      // hanging studs rather than a faint speckle at normal view distance.
      if (guttae && !isIonic) {
        var reguGeo = new THREE.BoxGeometry(trigW * 0.94, archH * 0.075, 0.13);
        var guttaGeo = new THREE.CylinderGeometry(0.034, 0.06, 0.10, 4);
        for (var t2 = 0; t2 < trigTransforms.length; t2++) {
          var g = trigTransforms[t2];
          var facing = [sin(g.r[1]) * 0.14, -cos(g.r[1]) * 0.14];
          reguT.push({ p: [g.p[0] - facing[0], archH - archH * 0.032, g.p[2] - facing[1]], r: g.r });
          // A single row of 3 (not 2 rows of 3): still reads as a hanging
          // stud row at normal viewing distance, at half the instance cost.
          for (var gx = -1; gx <= 1; gx++) {
            guttaT.push({ p: [g.p[0] - facing[0] + gx * trigW * 0.28, archH - archH * 0.09, g.p[2] - facing[1]], r: [PI, 0, 0] });
          }
        }
        group.add(H.instance(reguGeo, mats.marble, reguT));
        group.add(H.instance(guttaGeo, mats.marbleShadowed, guttaT));
      }
    } else if (isIonic) {
      // Continuous plain frieze band (Ionic friezes are often carved
      // continuously; keep it a clean recessed band here).
      ring(archH, friezeH, archThickness - 0.06, mats.marbleShadowed);
    }

    // Metopes: place a relief/plate in every bay between triglyphs (front/back
    // long faces and both short ends), using the caller-supplied maker so this
    // shared helper never hardcodes any one building's iconography.
    if (triglyphs && metopeMaker) {
      var idx = 0;
      // metopeMaker's own mesh (another stream's module) already carries
      // whatever carved-figure detail it wants per plate — placing a second,
      // independent instanced figure rig on top of every bay here was pure
      // duplicate geometry (the plate's own relief already reads as carved
      // sculpture), so this just seats the caller's mesh in each bay.
      var relH = friezeH * 0.86;
      function metopeRow(count, step, axisIsX, sign) {
        var ry = axisIsX ? (sign > 0 ? 0 : PI) : (sign > 0 ? PI / 2 : -PI / 2);
        for (var n = 0; n < count + 1; n++) {
          var c = -((axisIsX ? w : d) / 2) + step * (n + 0.5);
          var mw = Math.min(step * 0.82, 1.4);
          var mesh = metopeMaker(idx++, mw, relH);
          if (!mesh) continue;
          var baseX = axisIsX ? c : sign * (w / 2 + 0.03);
          var baseZ = axisIsX ? sign * (d / 2 + 0.03) : c;
          mesh.position.set(baseX, archH + friezeH / 2, baseZ);
          mesh.rotation.y = ry;
          group.add(mesh);
        }
      }
      metopeRow(triglyphCount, xStep, true, 1);
      metopeRow(triglyphCount, xStep, true, -1);
      metopeRow(zCount, zStep, false, 1);
      metopeRow(zCount, zStep, false, -1);
    }

    // ---- Cornice -------------------------------------------------------
    if (cornice) {
      var cornOvhg = 0.45;
      // Rain-washed corona: this is the most weather-exposed horizontal
      // surface on the whole order, so it takes the "worn" variant rather
      // than pristine marble.
      ring(archH + friezeH, corniceH, archThickness + 2 * cornOvhg, mats.marbleWorn);
      // Drip-edge throat: a thin shadowed groove along the underside outer
      // lip of the corona (the classical cyma reversa drip channel), which
      // both reads as authentic detailing and gives the cornice a hard
      // shadow line instead of a flat slab silhouette.
      var dripT = archThickness + 2 * cornOvhg - 0.08;
      ring(archH + friezeH + corniceH * 0.06, corniceH * 0.05, dripT, mats.marbleShadowed);

      if (isIonic) {
        // Egg-and-dart band under the cornice soffit.
        var eodGeo = new THREE.CylinderGeometry(1, 1, corniceH * 0.16, 8, 1, true);
        var eodT = [];
        var perim = 2 * (w + d), eodCount = Math.max(8, Math.round(perim / (MOBILE ? 1.4 : 0.9)));
        for (var e = 0; e < eodCount; e++) {
          var tpar = e / eodCount, px2, pz2, ry;
          if (tpar < 0.25) { px2 = -w / 2 + (tpar / 0.25) * w; pz2 = d / 2 + cornOvhg * 0.5; ry = 0; }
          else if (tpar < 0.5) { px2 = w / 2 + cornOvhg * 0.5; pz2 = d / 2 - ((tpar - 0.25) / 0.25) * d; ry = PI / 2; }
          else if (tpar < 0.75) { px2 = w / 2 - ((tpar - 0.5) / 0.25) * w; pz2 = -d / 2 - cornOvhg * 0.5; ry = PI; }
          else { px2 = -w / 2 - cornOvhg * 0.5; pz2 = -d / 2 + ((tpar - 0.75) / 0.25) * d; ry = -PI / 2; }
          eodT.push({ p: [px2, archH + friezeH + corniceH * 0.1, pz2], r: [PI / 2, ry, 0], s: [0.12, 1, 0.12] });
        }
        group.add(H.instance(eodGeo, mats.marbleWorn, eodT));
      } else {
        // Mutules + guttae on the soffit, one set per triglyph position.

        var mGuttaGeo = new THREE.CylinderGeometry(0.032, 0.054, 0.09, 4);
        for (var t3 = 0; t3 < trigTransforms.length; t3++) {
          var g2 = trigTransforms[t3];
          var facing2 = [sin(g2.r[1]) * (0.62 / 2 + 0.02), -cos(g2.r[1]) * (0.62 / 2 + 0.02)];
          var soffitY = archH + friezeH + corniceH * 0.55;
          mutuleT.push({ p: [g2.p[0] + facing2[0], soffitY, g2.p[2] + facing2[1]], r: [0, g2.r[1], 0] });
          // A 3x2 grid (6 guttae, not the old 2x2 corner-only 4): the art
          // director flagged the soffit as reading visibly sparse next to a
          // real mutule's 3x3=9 drops. 6 is the cheapest step up that still
          // reads as a full row rather than just corner studs, at 1.5x the
          // old instance cost (still a single low-poly cone-cylinder each).
          for (var mgxi = -1; mgxi <= 1; mgxi++) for (var mgz = -1; mgz <= 1; mgz += 2) {

        group.add(H.instance(mGuttaGeo, mats.marbleShadowed, mutGuttaT));
      }

      // Sima along the flank eaves, with lion-head spouts (Doric).
      if (sima) {
        var simaH = corniceH * 0.35;
        ring(archH + friezeH + corniceH, simaH, archThickness + 2 * cornOvhg - 0.1, mats.marbleWorn);
        if (lionSpouts) {
          var headGeo = new THREE.SphereGeometry(0.16, 8, 6);
          var snoutGeo = new THREE.ConeGeometry(0.09, 0.16, 6);
          var streakH = corniceH + friezeH * 0.7;
          var streakGeo = new THREE.PlaneGeometry(0.14, streakH);
          var spacing = o.lionSpacing || Math.max(2.2, d / 10);
          var count = Math.max(2, Math.floor(d / spacing));
          var headT = [], snoutT = [], streakT = [];
          for (var li = 0; li < count; li++) {
            var lz = -d / 2 + (li + 0.5) * (d / count);
            var ly = archH + friezeH + corniceH + simaH * 0.4;
            headT.push({ p: [w / 2 + cornOvhg, ly, lz], s: [1, 0.8, 0.8] });
            headT.push({ p: [-w / 2 - cornOvhg, ly, lz], s: [1, 0.8, 0.8] });
            snoutT.push({ p: [w / 2 + cornOvhg + 0.18, ly, lz], r: [0, 0, -PI / 2] });
            snoutT.push({ p: [-w / 2 - cornOvhg - 0.18, ly, lz], r: [0, 0, PI / 2] });

            // iron/algae streak down the cornice and frieze face beneath it.

            streakT.push({ p: [-(w / 2 + 0.015), streakY, lz], r: [0, -PI / 2, 0] });

          group.add(H.instance(headGeo, mats.marbleShadowed, headT));
          group.add(H.instance(snoutGeo, mats.marbleShadowed, snoutT));
          group.add(H.instance(streakGeo, mats.marbleShadowed, streakT));
        }
      }
    }

    return group;
  };

  // =====================================================================
  // PEDIMENT: recessed tympanum behind the raking cornice, a horizontal
  // geison at the base, sima along the rake, and sculpture figures whose
  // pose flattens toward the corners.
  // =====================================================================
  H.makePediment = function (w, d, h, o) {
    o = o || {};
    var figures = o.figures !== undefined ? o.figures : 9;
    var recess = o.recess !== undefined ? o.recess : Math.max(0.12, d * 0.12);
    var group = new THREE.Group();

    // Horizontal geison at the base of the pediment — a heavily rain-washed
    // exposed ledge, so it takes the worn variant.
    var geisonH = Math.max(0.12, h * 0.05);
    addMesh(group, new THREE.BoxGeometry(w + 0.5, geisonH, d + 0.35), mats.marbleWorn, [0, geisonH / 2, 0]);

    shape.lineTo(w / 2, 0);
    shape.lineTo(0, h);
    shape.lineTo(-w / 2, 0);

    // monochrome triangle even where it stands in as a figure placeholder.

    var tPos = tympGeo.getAttribute('position'), tArr = tPos.array;

        var panel = 0.018 * Math.pow(Math.max(0, Math.sin(tx * (5 / Math.max(w, 1)) * PI)), 8);
        tArr[ti + 2] += rough - panel;

    }
    tPos.needsUpdate = true;
    tympGeo.computeVertexNormals();
    tympGeo.translate(0, geisonH, -d / 2 - recess);
    addMesh(group, tympGeo, mats.marbleShadowed, [0, 0, 0]);

    // Darker perimeter frame where the tympanum meets the raking cornice /
    // geison: a thin picture-frame border sitting just proud of the recess
    // plane, which reads as a hard shadow line and sharpens the perceived
    // depth of the recess from a distance.
    var frameMargin = Math.min(0.4, Math.max(w, d) * 0.02);
    var outerShape = new THREE.Shape();
    outerShape.moveTo(-w / 2 - 0.1, 0);
    outerShape.lineTo(w / 2 + 0.1, 0);
    outerShape.lineTo(0, h + 0.08);
    outerShape.lineTo(-w / 2 - 0.1, 0);
    var innerPath = new THREE.Path();
    innerPath.moveTo(-w / 2 + frameMargin, frameMargin * 0.6);
    innerPath.lineTo(w / 2 - frameMargin, frameMargin * 0.6);
    innerPath.lineTo(0, h - frameMargin);
    innerPath.lineTo(-w / 2 + frameMargin, frameMargin * 0.6);

    var frameGeo = new THREE.ExtrudeGeometry(outerShape, { depth: 0.05, bevelEnabled: false });
    frameGeo.translate(0, geisonH, -d / 2 - recess + 0.04);
    addMesh(group, frameGeo, mats.marbleShadowed, [0, 0, 0]);

    // Raking cornice (both slopes) with a thin sima ridge on top.
    var slopeLen = sqrt((w / 2) * (w / 2) + h * h) + 0.4;
    var angle = atan2(h, w / 2);
    var rakingGeo = new THREE.BoxGeometry(slopeLen, 0.4, d + 0.6);
    var simaGeo = new THREE.BoxGeometry(slopeLen, 0.14, d + 0.7);
    var rakingPos = [[w / 4, geisonH + h / 2, 0], [-w / 4, geisonH + h / 2, 0]];
    var rakingRot = [[0, 0, -angle], [0, 0, angle]];

      // — worn, like the horizontal corona — while the recessed tympanum
      // behind stays comparatively sheltered and darker.
      addMesh(group, rakingGeo.clone(), mats.marbleWorn, rakingPos[i], rakingRot[i]);

    }

      var fx = -w * 0.42 + xi * w * 0.84;

  };

  // =====================================================================
  // ROOF: Laconian pan-and-cover marble tiling (long strips, not per-tile
  // bricks — far cheaper and reads correctly from a distance), antefixes
  // at the eaves, ridge palmettes, and floral acroteria.
  // =====================================================================
  H.makeGableRoof = function (w, d, pitch, o) {

    var acroteria = o.acroteria !== undefined ? o.acroteria : false;
    var group = new THREE.Group();
    var ridgeH = (w / 2) * pitch;
    var angle = atan2(pitch, 1);
    // Real ancient roofs project the tile courses well past the cornice
    // face for drainage — the previous pass had the eave landing almost
    // exactly on the entablature edge (near-zero overhang, visible as a flat
    // roofline flush with the colonnade below in parthenon/erechtheion
    // shots). Extend the SAME slope past the original eave point by a
    // horizontal `ovhg`, computed from this call's own w so every building
    // gets a proportional overhang without callers needing to change their
    // w argument. The ridge position/pitch are untouched (only the eave end
    // of each slab moves outward and slightly down along the unchanged
    // slope line), so this cannot reopen the old tile-overshoot bug: tile/
    // cover rows below are still sized as a strict fraction of the (now
    // longer) slab length, never derived independently.
    var ovhg = Math.max(0.4, Math.min(1.0, w * 0.02));
    var slopeLenBase = sqrt((w / 2) * (w / 2) + ridgeH * ridgeH);
    var ovhgSlope = ovhg / cos(angle);
    var slopeLen = slopeLenBase + ovhgSlope;
    var halfLen = slopeLen / 2;
    var eaveHalfW = w / 2 + ovhg;   // extended eave line, x = ±eaveHalfW
    var eaveY = -ovhg * pitch;      // eave tip droops slightly below y=0

    // Two roof slabs (structural underlayment beneath the tile courses),
    // pinned at the ridge (0, ridgeH) and running the full extended length
    // to the new eave point (±eaveHalfW, eaveY) along the same slope angle.

    }

    // bevel already reads as carved relief) shared by the ridge finials,
    // acroteria and antefixes below — replaces the old plain cone/box forms.
    // Built once per roof at a nominal unit size; every use scales it via

      shp.lineTo(-0.055, 0);

    }

    // finials and acroteria, and a much cheaper flat, fewer-lobed one for
    // antefixes — there can be well over a hundred of those along a single
    // building's eaves, so per-instance triangle cost there matters far more
    // than surface polish (InstancedMesh keeps draw calls low regardless,

    var palmetteGeo = new THREE.ExtrudeGeometry(palmetteShape(5), {

    var panT = [], coverT = [], antefixT = [], antefixCapT = [];
    var rndRoof = seedRand(Math.round(w * 331 + d * 71 + pitch * 9007) + 3);

      // reusing the SAME position+rotation reference as the underlying slab
      // (slabPos/slabRot above) and only ever shrinking that footprint —
      // never re-deriving it from scratch — so a tile can never stick out

      var rowW = MOBILE ? 0.62 : 0.5;
      var rows = Math.max(2, Math.round(d / rowW));
      rowW = d / rows;

      // Fake pan-tile curvature: tilt the top/bottom face normals across the

      // per-instance slope rotation), so each flat board shades like a
      // shallow curved terracotta pan instead of a dead-flat plank — a real
      // curved-cylinder profile here would multiply triangles across every
      // one of these (there are dozens per roof), so this stays a zero-tri
      // shading trick instead of added geometry.
      pillowFace(panGeo, 1, 0.5, [2]);
      // Half-cylinder cap, unit length along local X (its own long axis),
      // reused for both the seam covers and — scaled — the eave antefixes.
      var coverGeo = new THREE.CylinderGeometry(1, 1, 1, MOBILE ? 6 : 8, 1, true, 0, PI);
      coverGeo.rotateZ(PI / 2);
      var antefixGeo = new THREE.BoxGeometry(0.05, 0.3, 1); // thin plaque; long axis (eave-parallel) sized via `s.z`
      for (var side = 0; side < 2; side++) {
        var sx = side === 0 ? 1 : -1;
        var baseX = slabPos[side][0], baseY = slabPos[side][1], rotZ = slabRot[side][2];

        // instead of z-fighting with it, however the slope is rotated.
        var liftDir = [-sin(rotZ), cos(rotZ)];
        for (var rIdx = 0; rIdx < rows; rIdx++) {
          var z = -d / 2 + (rIdx + 0.5) * rowW;

          var lift = 0.03 + rndRoof() * 0.015;
          panT.push({
            p: [baseX + liftDir[0] * lift, baseY + liftDir[1] * lift, z], r: [0, 0, rotZ],
            s: [slopeLen * lenFrac, 0.05, rowW - jointGap]
          });
        }
        // Cover caps over the interior seams only (never the gable-end
        // seams), each also sized as a strict fraction of the slope length —
        // same guarantee against overshoot as the pan tiles above. Lifted a
        // little higher than the pan tiles so it sits proud of them.
        var clift = 0.075;
        for (var seam = 1; seam < rows; seam++) {
          var sz = -d / 2 + seam * rowW;
          coverT.push({
            p: [baseX + liftDir[0] * clift, baseY + liftDir[1] * clift, sz], r: [0, 0, rotZ],
            s: [slopeLen * 0.97, rowW * 0.16, rowW * 0.16]

        }
        // Antefixes along the true (now overhanging) eave line, one per row,
        // spread along the full depth — the eave itself, not the rake.
        for (var ai = 0; ai < rows; ai += (MOBILE ? 2 : 1)) {

    stoaRoof.position.set(0, 6.4, -2.5);
    stoaRoof.castShadow = true; stoaRoof.receiveShadow = true;
    sGroup.add(stoaRoof);
    group.add(sGroup);
  })();

  // ---------------- 5. Sacred Way ----------------
  var sacredTransforms = [];
  for (var sw = 0; sw < 30; sw++) {
    var t2 = sw / 29;
    var swx = -200 + t2 * 60, swy = -60 + t2 * 58, swz = 40 + t2 * (-36);
    sacredTransforms.push({ p: [swx, swy, swz], r: [0, 0, 0], s: [6, 0.3, 5] });
  }
  var sacredMesh = H.instance(new THREE.BoxGeometry(1, 1, 1), mats.marbleShadowed, sacredTransforms);
  sacredMesh.castShadow = false;
  sacredMesh.receiveShadow = true;
  group.add(sacredMesh);

  return group;
};

</script>
<script data-module="04-parthenon.js">
// Module 04 - Parthenon
window.buildParthenon = function (THREE, mats, H) {
  // Runtime shim: 13-figures.js defines window.addFigureHelpers but nothing in
  // 12-main.js currently calls it, so H.makeRelief/makeStatue/makePromachos
  // would otherwise never exist. Wire it in once, defensively, from here
  // (buildParthenon runs first in the builder list).
  if (window.addFigureHelpers && !window.__figuresWired) {
    window.__figuresWired = true;
    window.addFigureHelpers(THREE, mats, H);
  }

  var group = new THREE.Group();
  // Raise the building so its three steps stand above the plateau
  group.position.y = 1.65;
  // Real Parthenon's 70m axis runs east-west with the entrance facing east;
  // the geometry below is authored long-axis-along-z with the entrance
  // (pronaos/front pediment) on local +z, so rotate 90 deg about y to send
  // local +z to world +x (east).
  group.rotation.y = Math.PI / 2;

  // Crepidoma: three steps, with the top (stylobate) step curving gently
  // upward toward mid-length (H.makeSteppedBase applies this automatically
  // for a building this size).
  var stylobate = H.makeSteppedBase(30.9, 69.5, 3, 0.55, 0.7);
  group.add(stylobate);

  // Peristyle columns - 8 × 17 = 46 columns
  // Rectangle inset 1.3 from stylobate edge: x = ±14.15, z = ±33.45
  var colPositions = [];

  // Short sides: 8 columns at z = ±33.45
  for (var i = 0; i < 8; i++) {
    var x = -14.15 + (28.3 / 7) * i;
    colPositions.push([x, 33.45]);
    colPositions.push([x, -33.45]);
  }

  // Long sides: 17 columns at x = ±14.15, excluding corners
  for (var i = 1; i < 16; i++) {
    var z = -33.45 + (66.9 / 16) * i;
    colPositions.push([14.15, z]);
    colPositions.push([-14.15, z]);
  }

  var colGroup = H.makeDoricColumns(colPositions, { height: 10.43, baseD: 1.91, topD: 1.48, flutes: 20 });
  group.add(colGroup);

  // Entablature at y = 10.43. 13 + 31 triglyph-bay counts give exactly
  // 92 metopes (28 on the ends, 64 on the flanks), matching the real temple.
  var metopeSeedBase = 3000;
  var entablature = H.makeEntablature(30.9, 69.5, 3.3, {
    triglyphs: true, triglyphCount: 13, zCount: 31,
    // Director's r2 review (v-parth-w/-se): metopes read as blank cream
    // plaques from normal viewing distance — a low-detail figure at the
    // panel's native (very shallow) carve depth doesn't cast enough shadow
    // to read as sculpture from outside the colonnade. Dropping lowDetail
    // adds the figure's drape-fold box back for a touch more surface break,
    // and scaling the returned mesh along its own carve axis (z, anchored at
    // the panel's front face) exaggerates the relief depth ~3.2x without
    // touching H.makeRelief itself — the panel's footprint in the frieze
    // band is unchanged, only how far the figure projects (and the slab
    // recedes) grows, giving real cast shadow at normal viewing distance.
    // Kept to 1 figure/metope (not 2) to hold the triangle budget.
    metopeMaker: H.makeRelief ? function (idx, mw, mh) {
      var m = H.makeRelief(mw, mh, { seed: metopeSeedBase + idx, figures: 1 });
      m.scale.z = 3.4;
      return m;
    } : null
  });
  entablature.position.y = 10.43;
  group.add(entablature);

  // Pediments (figures pose toward the corners automatically). Director's r2
  // review (v-parth-w/-se): the sparse 11-figure group left wide gaps of bare
  // tympanum between figures, reading as "mostly empty" at normal viewing
  // distance even though figures were technically present. 15 packs the
  // triangular field the way the real pedimental sculpture groups do —
  // Athena/Poseidon centre pair, kneeling attendants, reclining corner
  // figures — with no gap wide enough to read as missing sculpture.
  var pedimentFront = H.makePediment(30.9, 1.2, 3.4, { figures: 15 });
  pedimentFront.position.set(0, 13.73, 34.75);
  group.add(pedimentFront);

  var pedimentBack = H.makePediment(30.9, 1.2, 3.4, { figures: 15 });
  pedimentBack.position.set(0, 13.73, -34.75);
  pedimentBack.rotation.y = Math.PI;
  group.add(pedimentBack);

  // Roof at y = 13.7 (pan-and-cover tiles, antefixes, ridge palmettes, acroteria)
  var roof = H.makeGableRoof(31.5, 70, 0.22, { tiles: true, acroteria: true });
  roof.position.y = 13.7;
  group.add(roof);

  // Cella at (0, 0, 0) — ashlar-coursed walls with a framed east door
  var cella = H.makeCella(21.7, 59, 10.0, { doorWidth: 4.5, doorSide: '+z' });
  group.add(cella);

  // Pronaos: 6 Doric columns at z = +26, x evenly in [-9, 9]
  var pronaosCols = [];
  for (var i = 0; i < 6; i++) {
    var x = -9 + (18 / 5) * i;
    pronaosCols.push([x, 26]);
  }
  // Set back behind the peristyle (not a facade the camera gets close to);
  // the cheap unfluted variant keeps these in budget without a visible loss.
  var pronaoGroup = H.makeDoricColumns(pronaosCols, { height: 8.0, baseD: 1.5, topD: 1.2, simple: true });
  group.add(pronaoGroup);

  // Opisthodomos: 6 Doric columns at z = -26, x evenly in [-9, 9]
  var opisthodomosCols = [];
  for (var i = 0; i < 6; i++) {
    var x = -9 + (18 / 5) * i;
    opisthodomosCols.push([x, -26]);
  }
  var opisthodoGroup = H.makeDoricColumns(opisthodomosCols, { height: 8.0, baseD: 1.5, topD: 1.2, simple: true });
  group.add(opisthodoGroup);

  // Interior colonnade: two rows of 10 Doric columns at x = ±7.5, z evenly from -20 to +18
  // Deep inside the cella, behind the peristyle and (mostly) the doorway —
  // nobody gets close enough to read fluting here, so this uses the cheap
  // unfluted "simple" column variant (drops flutes/annulet/joint bands).
  var interiorCols = [];
  for (var i = 0; i < 10; i++) {
    var z = -20 + (38 / 9) * i;
    interiorCols.push([7.5, z]);
    interiorCols.push([-7.5, z]);
  }
  // Rear row: 5 columns at z = -23, x evenly in [-6, 6]
  for (var i = 0; i < 5; i++) {
    var x = -6 + (12 / 4) * i;
    interiorCols.push([x, -23]);
  }
  var interiorGroup = H.makeDoricColumns(interiorCols, { height: 5.0, baseD: 0.9, topD: 0.75, simple: true });
  group.add(interiorGroup);

  // Panathenaic frieze: continuous relief strips around the exterior of the
  // cella walls (hidden behind the peristyle, as in the real temple), just
  // below the roofline.
  if (H.makeRelief) {
    var friezeY = 9.15, friezeH = 1.0;
    var friezeSeed = 4000;
    var friezeSpecs = [
      { len: 21.7 + 2.4, x: 0, z: 59 / 2 + 0.7, ry: 0 },
      { len: 21.7 + 2.4, x: 0, z: -(59 / 2 + 0.7), ry: Math.PI },
      { len: 59 + 2.4, x: 21.7 / 2 + 0.7, z: 0, ry: Math.PI / 2 },
      { len: 59 + 2.4, x: -(21.7 / 2 + 0.7), z: 0, ry: -Math.PI / 2 }
    ];
    // The relief plate itself (13-figures.js owns H.makeRelief) already
    // bakes its own carved figures into the merged mesh — an extra layer of
    // free-floating instanced marching figures on top of every strip was
    // duplicate geometry for a band that is, per the comment above, mostly
    // hidden behind the peristyle anyway. One low-detail figure per strip
    // (via `figures: 1` below) keeps the frieze reading as carved sculpture
    // wherever a gap in the colonnade lets it show, at a fraction of the
    // triangle cost.
    for (var fs = 0; fs < friezeSpecs.length; fs++) {
      var spec = friezeSpecs[fs];
      var stripCount = Math.max(1, Math.round(spec.len / 8));
      var stripLen = spec.len / stripCount;
      var horiz = spec.ry === 0 || spec.ry === Math.PI;
      for (var si = 0; si < stripCount; si++) {
        var strip = H.makeRelief(stripLen * 0.98, friezeH, { lowDetail: true, seed: friezeSeed + fs * 20 + si, figures: 1 });
        var along = -spec.len / 2 + (si + 0.5) * stripLen;
        var ax = horiz ? along : 0;
        var az = horiz ? 0 : along;
        strip.position.set(spec.x + ax, friezeY, spec.z + az);
        strip.rotation.y = spec.ry;
        group.add(strip);
      }
    }
  } else {
    // Fallback if the figures module hasn't loaded: plain coursed band.
    var frieze = H.makeBlockCourse(22.5, 59.8, 1.0, 1.2);
    frieze.position.y = 9.0;
    group.add(frieze);
  }

  // Cult statue: chryselephantine Athena Parthenos — gold drapery, ivory flesh.
  if (H.makeStatue) {
    var statue = H.makeStatue({ height: 11.5, material: mats.gold });
    statue.traverse(function (o) {
      if (o.isMesh && !o.isInstancedMesh && o.geometry && o.geometry.type === 'SphereGeometry') {
        o.material = mats.ivory;
      }
    });
    statue.position.set(0, 0, -10);
    group.add(statue);
  } else {
    var statue = H.makeFigure(11.5);
    statue.position.set(0, 0, -10);
    statue.traverse(function (o) { if (o.isMesh) o.material = mats.gold; });
    group.add(statue);
  }

  return group;
};

</script>
<script data-module="05-erechtheion.js">
// Erechtheion: complex split-level temple with east/north/south/west porches and olive tree
window.buildErechtheion = function (THREE, mats, H) {
  if (window.addFigureHelpers && !window.__figuresWired) {
    window.__figuresWired = true;
    window.addFigureHelpers(THREE, mats, H);
  }

  var group = new THREE.Group();
  // y = 1.0 lifts the two base steps above the plateau
  group.position.set(-42, 1.0, -34);

  // Base: stepped base for the main structure
  var base = H.makeSteppedBase(22.8, 11.6, 2, 0.5);
  group.add(base);

  // Main block: ashlar-coursed cella with entablature and gable roof
  var cella = H.makeCella(19.0, 10.0, 6.6, { doorWidth: 3, doorSide: '+x', thickness: 0.8 });
  group.add(cella);

  // Ionic entablature: egg-and-dart cornice band, three-fascia architrave
  var entablatureMain = H.makeEntablature(22.8, 11.6, 1.6, { order: 'ionic', triglyphs: false });
  entablatureMain.position.y = 6.6;
  group.add(entablatureMain);

  var roofMain = H.makeGableRoof(11.6, 22.8, 0.2, { tiles: true });
  roofMain.rotation.y = Math.PI / 2;
  roofMain.position.y = 8.2;
  group.add(roofMain);

  // East porch: 6 Ionic columns at x = 11.0, z evenly spaced from -5.2 to 5.2
  // rotY orients the volute pair to face outward (east), across the porch front.
  var eastPositions = [
    [11.0, -5.2], [11.0, -3.12], [11.0, -1.04],
    [11.0, 1.04], [11.0, 3.12], [11.0, 5.2]
  ];
  var eastColumns = H.makeIonicColumns(eastPositions, { height: 6.6, baseD: 0.85, rotY: Math.PI / 2 });
  group.add(eastColumns);

  // North porch: split-level, 3.2 m below the main floor (left buried, as the
  // real porch is genuinely lower than the temple's east end — this is
  // architecturally correct, not a bug).
  // Floor slab
  var northFloor = new THREE.Mesh(new THREE.BoxGeometry(10.6, 0.5, 6.6), mats.marble);
  northFloor.position.set(-7, -3.45, -8.9);
  northFloor.castShadow = true; northFloor.receiveShadow = true;
  group.add(northFloor);

  // 4 front Ionic columns at z = -11.6, x evenly spaced from -11.2 to -2.8
  var northFrontPositions = [[-11.2, -11.6], [-8.4, -11.6], [-5.6, -11.6], [-2.8, -11.6]];
  var northFrontColumns = H.makeIonicColumns(northFrontPositions, { height: 7.63, baseD: 0.92, y: -3.2 });
  group.add(northFrontColumns);

  // 2 side columns
  var northSidePositions = [[-11.2, -8.6], [-2.8, -8.6]];
  var northSideColumns = H.makeIonicColumns(northSidePositions, { height: 7.63, baseD: 0.92, y: -3.2, rotY: Math.PI / 2 });
  group.add(northSideColumns);

  // North entablature (Ionic)
  var entablatureNorth = H.makeEntablature(10.6, 6.4, 1.2, { order: 'ionic', triglyphs: false });
  entablatureNorth.position.set(-7, 4.43, -8.9);
  group.add(entablatureNorth);

  // North roof slab
  var northRoof = new THREE.Mesh(new THREE.BoxGeometry(11.2, 0.6, 7.0), mats.marble);
  northRoof.position.set(-7, 5.93, -8.9);
  northRoof.castShadow = true; northRoof.receiveShadow = true;
  group.add(northRoof);

  // South porch: caryatid porch centred at (+6, 0, +7.35), in front of the south wall
  // Podium
  var caryatidPodium = new THREE.Mesh(new THREE.BoxGeometry(5.0, 1.8, 3.1), mats.marbleWorn);
  caryatidPodium.position.set(6, 0.9, 7.35);
  caryatidPodium.castShadow = true; caryatidPodium.receiveShadow = true;
  group.add(caryatidPodium);

  // 6 caryatids at y = 1.8
  var frontXPositions = [-1.9, -0.63, 0.63, 1.9];
  for (var i = 0; i < frontXPositions.length; i++) {
    var caryatid = H.makeCaryatid(2.3);
    caryatid.position.set(6 + frontXPositions[i], 1.8, 8.3);
    group.add(caryatid);
  }
  for (var j = 0; j < 2; j++) {
    var caryatidRear = H.makeCaryatid(2.3);
    var xPos = j === 0 ? 6 - 1.9 : 6 + 1.9;
    caryatidRear.position.set(xPos, 1.8, 6.6);
    group.add(caryatidRear);
  }

  // Caryatid porch entablature: a three-fascia Ionic architrave, a dentil
  // course, and a projecting cornice — not a plain slab. Cheap (a handful of
  // boxes plus one small instanced dentil row), but reads as a real order
  // resting on the maidens' heads instead of a block of stone.
  (function () {
    var capW = 5.4, capD = 3.5, capY = 1.8 + 2.3 + 0.05;
    // Dentils enlarged and spaced coarser (0.12x0.14 @ ~0.2 spacing -> 0.2x0.22
    // @ ~0.32 spacing, close to the art director's own suggested numbers):
    // the old row read as an indistinct speckle at normal viewing distance.
    // A dark recessed soffit backing sits directly behind the row (new) so
    // each tooth reads as a raised block against a shadowed background
    // instead of floating cubes with nothing behind them, and the teeth now
    // project past the fascia's own edge for a real cast-shadow line.
    var archH = 0.42, dentilH = 0.22, corniceH = 0.33;
    var fasciaH = archH / 3;
    for (var fb = 0; fb < 3; fb++) {
      var fw = capW - fb * 0.05, fd = capD - fb * 0.05;
      var fascia = new THREE.Mesh(new THREE.BoxGeometry(fw, fasciaH * 0.94, fd), mats.marble);
      fascia.position.set(6, capY + fasciaH * (fb + 0.5), 7.35);
      fascia.castShadow = true; fascia.receiveShadow = true;
      group.add(fascia);
    }
    var dentilY = capY + archH + dentilH / 2;
    var dentilSpacing = 0.32;
    var dCount = Math.max(3, Math.round(capW / dentilSpacing));
    dentilSpacing = capW / dCount;
    var dentilW = dentilSpacing * 0.62;
    var dentilDepth = 0.3;
    var soffitGeo = new THREE.BoxGeometry(capW - 0.08, dentilH * 0.92, 0.14);
    var soffitT = [
      { p: [6, dentilY, 7.35 + capD / 2 - 0.16] },
      { p: [6, dentilY, 7.35 - capD / 2 + 0.16] }
    ];
    group.add(H.instance(soffitGeo, mats.marbleShadowed, soffitT));
    var dentilGeo = new THREE.BoxGeometry(dentilW, dentilH, dentilDepth);
    var dentilT = [];
    for (var di = 0; di < dCount; di++) {
      var dx = 6 - capW / 2 + (di + 0.5) * dentilSpacing;
      dentilT.push({ p: [dx, dentilY, 7.35 + capD / 2 - 0.05 + dentilDepth * 0.15] });
      dentilT.push({ p: [dx, dentilY, 7.35 - capD / 2 + 0.05 - dentilDepth * 0.15] });
    }
    group.add(H.instance(dentilGeo, mats.marble, dentilT));
    var corniceOvh = 0.18;
    var cornice = new THREE.Mesh(new THREE.BoxGeometry(capW + 2 * corniceOvh, corniceH, capD + 2 * corniceOvh), mats.marbleWorn);
    cornice.position.set(6, capY + archH + dentilH + corniceH / 2, 7.35);
    cornice.castShadow = true; cornice.receiveShadow = true;
    group.add(cornice);
  })();

  // West wall: 4 engaged half-columns at x = -10.6, z evenly spaced from -4 to 4
  var westPositions = [[-10.6, -4], [-10.6, -1.33333], [-10.6, 1.33333], [-10.6, 4]];
  var westColumns = H.makeIonicColumns(westPositions, { height: 5.8, baseD: 0.7, rotY: Math.PI / 2 });
  group.add(westColumns);

  // Director's r2 review (v-cary/general envelope): the cella's plain coursed
  // walls read as an unbroken mass with no doors, windows or clear boundary
  // against the rocky plateau. Two framed window openings (dark recess plus a
  // marble surround) in the bays between the west engaged columns, and a
  // second monumental doorway on the north wall (the cella's only modelled
  // door was the east one) give the building envelope real architectural
  // punctuation without touching H.makeCella's shared wall generator.
  // H.makeCella's west end wall is centred at x=-9.9 with thickness 0.8, so
  // its true outer (west-facing) face sits at x=-10.3 — every added element
  // below stays outside that (more negative x) so the solid coursed wall
  // never occludes it.
  var westFaceX = -10.3;
  var winW = 1.0, winH = 2.3, winY = 3.0;
  var westWinZs = [-2.66667, 2.66667];
  var winJambGeo = new THREE.BoxGeometry(0.16, winH, 0.16);
  var winCapGeo = new THREE.BoxGeometry(0.2, 0.18, winW + 0.32);
  for (var wwi = 0; wwi < westWinZs.length; wwi++) {
    var wz2 = westWinZs[wwi];
    var winDark = new THREE.Mesh(new THREE.BoxGeometry(0.1, winH, winW), mats.rockDark);
    winDark.position.set(westFaceX - 0.03, winY, wz2);
    group.add(winDark);
    var jambA = new THREE.Mesh(winJambGeo, mats.marble);
    jambA.position.set(westFaceX - 0.08, winY, wz2 - winW / 2 - 0.08);
    jambA.castShadow = true; jambA.receiveShadow = true;
    group.add(jambA);
    var jambB = new THREE.Mesh(winJambGeo, mats.marble);
    jambB.position.set(westFaceX - 0.08, winY, wz2 + winW / 2 + 0.08);
    jambB.castShadow = true; jambB.receiveShadow = true;
    group.add(jambB);
    var lintelTop = new THREE.Mesh(winCapGeo, mats.marble);
    lintelTop.position.set(westFaceX - 0.08, winY + winH / 2 + 0.09, wz2);
    lintelTop.castShadow = true; lintelTop.receiveShadow = true;
    group.add(lintelTop);
    var sill = new THREE.Mesh(winCapGeo, mats.marbleWorn);
    sill.position.set(westFaceX - 0.08, winY - winH / 2 - 0.09, wz2);
    sill.castShadow = true; sill.receiveShadow = true;
    group.add(sill);
  }

  // Monumental North Doorway: entered from the North Porch, one of the most
  // celebrated doors in Greek architecture — the cella above only modelled
  // its east door, leaving the whole north face (behind the porch columns)
  // blank. The north wall is centred at z=-5.4 with thickness 0.8, so its
  // true outer (north/porch-facing) face is z=-5.8 — every element here
  // stays outside that (more negative z).
  var ndX = -7, ndW = 2.6, ndH = 4.4, ndFaceZ = -5.8;
  var ndDark = new THREE.Mesh(new THREE.BoxGeometry(ndW, ndH, 0.12), mats.rockDark);
  ndDark.position.set(ndX, ndH / 2, ndFaceZ - 0.03);
  group.add(ndDark);
  var ndJambGeo = new THREE.BoxGeometry(0.28, ndH, 0.3);
  var ndJambA = new THREE.Mesh(ndJambGeo, mats.marble);
  ndJambA.position.set(ndX - ndW / 2 - 0.14, ndH / 2, ndFaceZ - 0.08);
  ndJambA.castShadow = true; ndJambA.receiveShadow = true;
  group.add(ndJambA);
  var ndJambB = new THREE.Mesh(ndJambGeo, mats.marble);
  ndJambB.position.set(ndX + ndW / 2 + 0.14, ndH / 2, ndFaceZ - 0.08);
  ndJambB.castShadow = true; ndJambB.receiveShadow = true;
  group.add(ndJambB);
  var ndLintel = new THREE.Mesh(new THREE.BoxGeometry(ndW + 0.7, 0.5, 0.34), mats.marble);
  ndLintel.position.set(ndX, ndH + 0.25, ndFaceZ - 0.08);
  ndLintel.castShadow = true; ndLintel.receiveShadow = true;
  group.add(ndLintel);
  var ndTrim = new THREE.Mesh(new THREE.BoxGeometry(ndW + 0.9, 0.12, 0.4), mats.marbleWorn);
  ndTrim.position.set(ndX, ndH + 0.55, ndFaceZ - 0.08);
  ndTrim.castShadow = true; ndTrim.receiveShadow = true;
  group.add(ndTrim);

  // Olive tree at local (-13, 0, 4)
  var trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.4, 2.6, 8), mats.trunk);
  trunk.position.set(-13, 1.3, 4);
  trunk.castShadow = true; trunk.receiveShadow = true;
  group.add(trunk);

  var canopyZPositions = [-1, 0, 1];
  var canopyGeo = new THREE.IcosahedronGeometry(1.9, 0);
  for (var k = 0; k < canopyZPositions.length; k++) {
    var canopy = new THREE.Mesh(canopyGeo, mats.foliageOlive);
    canopy.position.set(-13, 3.5, 4 + canopyZPositions[k]);
    canopy.castShadow = true; canopy.receiveShadow = true;
    group.add(canopy);
  }

  return group;
};

</script>
<script data-module="06-propylaea.js">
// Propylaea (central hall, wings, Nike bastion & temple)
window.buildPropylaea = function (THREE, mats, H) {
  if (window.addFigureHelpers && !window.__figuresWired) {
    window.__figuresWired = true;
    window.addFigureHelpers(THREE, mats, H);
  }

  var group = new THREE.Group();
  group.position.set(-118, 0, -6);

  // CENTRAL HALL

  var centralBase = H.makeSteppedBase(24, 18, 4, 0.5);
  group.add(centralBase);

  // West façade: 6 Doric columns at x = -10.5, z evenly in [-7.5, 7.5]
  var westPos = [];
  for (var i = 0; i < 6; i++) {
    var z = -7.5 + (i / 5) * 15;
    westPos.push([-10.5, z]);
  }
  var westCols = H.makeDoricColumns(westPos, { height: 8.57, baseD: 1.6, topD: 1.25 });
  group.add(westCols);

  // East façade: 6 Doric columns at x = +10.5, same z
  var eastPos = [];
  for (var i = 0; i < 6; i++) {
    var z = -7.5 + (i / 5) * 15;
    eastPos.push([10.5, z]);
  }
  var eastCols = H.makeDoricColumns(eastPos, { height: 8.0, baseD: 1.5, topD: 1.2 });
  group.add(eastCols);

  // Interior: 6 Ionic columns in two rows of 3 (colonnade runs along x, so
  // rotY faces the volutes along z, across the processional way).
  var ionicPos = [];
  for (var row = 0; row < 2; row++) {
    var z = row === 0 ? -2.6 : 2.6;
    for (var col = 0; col < 3; col++) {
      var x = -5 + col * 5;
      ionicPos.push([x, z]);
    }
  }
  var ionicCols = H.makeIonicColumns(ionicPos, { height: 10.25, baseD: 1.0 });
  group.add(ionicCols);

  // Cross-wall at x = +3: 6 pillars and lintel
  var zPositions = [-8.5, -5.4, -2.2, 2.2, 5.4, 8.5];
  var pillarGeo = new THREE.BoxGeometry(1.5, 9, 1.3);
  for (var i = 0; i < zPositions.length; i++) {
    var pillar = new THREE.Mesh(pillarGeo, mats.marbleWorn);
    pillar.position.set(3, 4.5, zPositions[i]);
    pillar.castShadow = true; pillar.receiveShadow = true;
    group.add(pillar);
  }

  var lintelGeo = new THREE.BoxGeometry(1.5, 2, 18);
  var lintel = new THREE.Mesh(lintelGeo, mats.marbleWorn);
  lintel.position.set(3, 8, 0);
  lintel.castShadow = true; lintel.receiveShadow = true;
  group.add(lintel);

  // Entablature (Doric)
  var entablature = H.makeEntablature(24, 18, 2.6, { triglyphs: true, triglyphCount: 12, zCount: 9 });
  entablature.position.y = 8.57;
  group.add(entablature);

  // Pediments
  var pediment1 = H.makePediment(18, 1.0, 2.6, { figures: 0 });
  pediment1.position.set(-12, 11.17, 0);
  pediment1.rotation.y = -Math.PI / 2;
  group.add(pediment1);

  var pediment2 = H.makePediment(18, 1.0, 2.6, { figures: 0 });
  pediment2.position.set(12, 11.17, 0);
  pediment2.rotation.y = Math.PI / 2;
  group.add(pediment2);

  // Roof
  var roof = H.makeGableRoof(18, 24, 0.24, { tiles: true });
  roof.position.y = 11.2;
  roof.rotation.y = Math.PI / 2;
  group.add(roof);

  // WINGS

  // North wing (Pinakotheke) centred at local (-8, 0, -16)
  var northBase = H.makeSteppedBase(12, 10, 2, 0.5);
  northBase.position.set(-8, 0, -16);
  group.add(northBase);

  var northCella = H.makeCella(12, 10, 5.4, { doorWidth: 2.5, doorSide: '+z' });
  northCella.position.set(-8, 0, -16);
  group.add(northCella);

  var northColPos = [];
  for (var i = 0; i < 3; i++) {
    var x = -8 + (-4 + i * 4);
    northColPos.push([x, -16 + 5.5]);
  }
  var northCols = H.makeDoricColumns(northColPos, { height: 5.4, baseD: 1.0, topD: 0.8, simple: true });
  group.add(northCols);

  // Director's r2 review (v-prop): a flat slab roof reads as a plain windowless
  // box from every angle, and with the south wing the same height the whole
  // complex silhouettes as one undifferentiated block. A proper gable (with
  // pediment caps facing the wing's own entrance axis, north-south, matching
  // the columns above) gives the Pinakotheke a distinct temple-like profile
  // and a different ridge height from the central hall and the south wing.
  var northRoof = H.makeGableRoof(12.6, 10.6, 0.24, { tiles: true });
  northRoof.position.set(-8, 5.4, -16);
  group.add(northRoof);

  var northPediment1 = H.makePediment(11.8, 0.5, 1.3, { figures: 0 });
  northPediment1.position.set(-8, 5.4, -16 - 10.6 / 2);
  group.add(northPediment1);

  var northPediment2 = H.makePediment(11.8, 0.5, 1.3, { figures: 0 });
  northPediment2.position.set(-8, 5.4, -16 + 10.6 / 2);
  northPediment2.rotation.y = Math.PI;
  group.add(northPediment2);

  // South wing centred at local (-8, 0, +17)
  var southBase = H.makeSteppedBase(9, 8, 2, 0.5);
  southBase.position.set(-8, 0, 17);
  group.add(southBase);

  // Director's r2 review (v-prop): south wing height dropped from 5.4 to 4.6
  // (matched by its cella/column height below) so the two wings read as
  // distinct chambers with their own roof lines rather than one uniform
  // height repeated across the whole complex.
  var southH = 4.6;
  var southCella = H.makeCella(9, 8, southH, { doorWidth: 2.5, doorSide: '-z' });
  southCella.position.set(-8, 0, 17);
  group.add(southCella);

  var southColPos = [];
  for (var i = 0; i < 3; i++) {
    var x = -8 + (-3 + i * 3);
    southColPos.push([x, 17 - 4.5]);
  }
  var southCols = H.makeDoricColumns(southColPos, { height: southH, baseD: 1.0, topD: 0.8, simple: true });
  group.add(southCols);

  var southRoof = H.makeGableRoof(9.6, 8.6, 0.26, { tiles: true });
  southRoof.position.set(-8, southH, 17);
  group.add(southRoof);

  var southPediment1 = H.makePediment(8.8, 0.4, 1.1, { figures: 0 });
  southPediment1.position.set(-8, southH, 17 - 8.6 / 2);
  group.add(southPediment1);

  var southPediment2 = H.makePediment(8.8, 0.4, 1.1, { figures: 0 });
  southPediment2.position.set(-8, southH, 17 + 8.6 / 2);
  southPediment2.rotation.y = Math.PI;
  group.add(southPediment2);

  // NIKE BASTION AND TEMPLE centred at local (-15, 0, +26)

  var bastionGeo = new THREE.BoxGeometry(9.6, 6, 11.5);
  var bastion = new THREE.Mesh(bastionGeo, mats.rock);
  bastion.position.set(-15, 0.2, 26);
  bastion.castShadow = true; bastion.receiveShadow = true;
  group.add(bastion);

  var ashlarCap = H.makeBlockCourse(9.6, 11.5, 1.2, 1.4);
  ashlarCap.position.set(-15, 2.0, 26);
  group.add(ashlarCap);

  var postGeo = new THREE.CylinderGeometry(0.06, 0.06, 1.2, 6);
  var postPositions = [
    [-15 - 4.8, 3.8, 26 - 5.75], [-15 - 4.8, 3.8, 26 + 5.75],
    [-15 + 4.8, 3.8, 26 - 5.75], [-15 + 4.8, 3.8, 26 + 5.75],
    [-15, 3.8, 26 - 5.75], [-15, 3.8, 26 + 5.75]
  ];
  var postTransforms = [];
  for (var i = 0; i < postPositions.length; i++) postTransforms.push({ p: postPositions[i] });
  var posts = H.instance(postGeo, mats.bronze, postTransforms);
  group.add(posts);

  // Temple of Athena Nike - stepped base
  var templeBase = H.makeSteppedBase(5.44, 8.27, 2, 0.35);
  templeBase.position.set(-15, 3.9, 26);
  group.add(templeBase);

  // Ionic columns: 4 on each short end (rotY faces the volutes along x,
  // across the temple's short ends, matching the real amphiprostyle plan).
  var templeColPos = [];
  var zEnds = [26 - 3.4, 26 + 3.4];
  for (var end = 0; end < 2; end++) {
    var z = zEnds[end];
    for (var col = 0; col < 4; col++) {
      var x = -15 + (-2.1 + (col / 3) * 4.2);
      templeColPos.push([x, z]);
    }
  }
  var templeCols = H.makeIonicColumns(templeColPos, { height: 4.0, baseD: 0.52, y: 3.9, rotY: Math.PI / 2 });
  group.add(templeCols);

  // Cella
  var templeCella = H.makeCella(3.7, 4.4, 4.0, { doorWidth: 1.4, doorSide: '+z', thickness: 0.4 });
  templeCella.position.set(-15, 3.9, 26);
  group.add(templeCella);

  // Entablature (Ionic)
  var templeEntablature = H.makeEntablature(5.44, 8.27, 1.1, { order: 'ionic', triglyphs: false });
  templeEntablature.position.set(-15, 7.9, 26);
  group.add(templeEntablature);

  // Roof
  var templeRoof = H.makeGableRoof(5.6, 8.4, 0.18, { tiles: true });
  templeRoof.position.set(-15, 9.0, 26);
  group.add(templeRoof);

  // Pediments
  var templePediment1 = H.makePediment(5.6, 0.5, 0.9, { figures: 0 });
  templePediment1.position.set(-15, 9.0, 26 - 4.2);
  group.add(templePediment1);

  var templePediment2 = H.makePediment(5.6, 0.5, 0.9, { figures: 0 });
  templePediment2.position.set(-15, 9.0, 26 + 4.2);
  templePediment2.rotation.y = Math.PI;
  group.add(templePediment2);

  return group;
};
