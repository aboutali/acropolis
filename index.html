<title>Acropolis of Athens</title>
<meta name="description" content="Interactive 3D reconstruction of the Acropolis of Athens, rendered procedurally with three.js.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&display=swap">
<style>
  :root { --ink: #f2ece0; --panel: rgba(20, 24, 30, .62); --accent: #e3c78a; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: #87b6de; color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { position: fixed; inset: 0; z-index: 0; }
  #legend, #hint, #autorot, #debug { z-index: 5; }
  #app canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; }
  #legend { position: fixed; left: 12px; bottom: 12px; max-width: min(300px, 46vw); padding: 10px 12px; border-radius: 10px;
    background: var(--panel); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); font-size: 12px; line-height: 1.5; }
  #legend h1 { margin: 0 0 4px; font: 600 14px/1.3 Cinzel, "Trajan Pro", Georgia, serif; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  #legend ul { margin: 0; padding: 0; list-style: none; }
  #legend li::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; background: var(--dot, #e8e0cf); vertical-align: middle; }
  #hint { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); padding: 6px 12px; border-radius: 999px; background: var(--panel);
    backdrop-filter: blur(6px); font-size: 12px; white-space: nowrap; transition: opacity 1.2s ease; pointer-events: none; }
  #autorot { position: fixed; right: 12px; bottom: 12px; width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--panel);
    color: var(--ink); font-size: 20px; cursor: pointer; backdrop-filter: blur(6px); }
  #autorot.off { opacity: .5; }
  #debug { position: fixed; top: 12px; right: 12px; padding: 4px 8px; border-radius: 6px; background: var(--panel); font: 12px ui-monospace, Menlo, Consolas, monospace; }
  @media (max-width: 640px) { #legend { font-size: 11px; padding: 8px 10px; } #legend h1 { font-size: 13px; } }

// 00-config: shared constants
window.CFG = (function () {
  var mobile = (typeof innerWidth === 'number') && innerWidth < 640;
  return {
    PLATEAU_H: 80, PLATEAU_X: 300, PLATEAU_Z: 150, PLATEAU_CX: -45, PLATEAU_CZ: 0,
    MOBILE: mobile,
    SEG: mobile ? { colRadial: 24, colHeight: 2, capital: 16 } : { colRadial: 40, colHeight: 4, capital: 24 }
  };
})();

<script data-module="01-mats.js">
// Module 01: materials with canvas textures
window.buildMats = function (THREE) {
  function noiseTex(size, amp, tint) {
    if (typeof document === 'undefined') return null;
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var ctx = c.getContext('2d');
    ctx.fillStyle = tint;
    ctx.fillRect(0, 0, size, size);
    var seed = 12345;
    function lcg() {
      seed = (seed * 1103515245 + 12345) & 0x7fffffff;
      return seed / 0x7fffffff;
    }
    for (var y = 0; y < size; y += 2) {
      for (var x = 0; x < size; x += 2) {
        var n = lcg();
        ctx.fillStyle = 'rgba(0,0,0,' + (amp * n) + ')';
        ctx.fillRect(x, y, 2, 2);
      }
    }
    ctx.strokeStyle = 'rgba(0,0,0,0.05)';
    for (var i = 0; i < 60; i++) {
      var ly = lcg() * size;
      ctx.beginPath();
      ctx.moveTo(0, ly);
      ctx.lineTo(size, ly);
      ctx.stroke();
    }
    var tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }
  var mats = {};
  if (typeof document === 'undefined') {
    mats.marble = new THREE.MeshStandardMaterial({color: 0xe8e0cf, roughness: 0.75, metalness: 0});
    mats.marbleWorn = new THREE.MeshStandardMaterial({color: 0xd8cdb6, roughness: 0.9, metalness: 0});
    mats.marbleShadowed = new THREE.MeshStandardMaterial({color: 0xcfc4ad, roughness: 0.92, metalness: 0});
    mats.rock = new THREE.MeshStandardMaterial({color: 0x9a8f7a, roughness: 1.0, metalness: 0});
    mats.rockDark = new THREE.MeshStandardMaterial({color: 0x7d735f, roughness: 1.0, metalness: 0});
    mats.ground = new THREE.MeshStandardMaterial({color: 0xa9a08a, roughness: 1.0, metalness: 0});
    mats.city = new THREE.MeshStandardMaterial({color: 0xbfb6a4, roughness: 0.95, metalness: 0, flatShading: true});
    mats.terracotta = new THREE.MeshStandardMaterial({color: 0xb5643c, roughness: 0.85, metalness: 0});
    mats.bronze = new THREE.MeshStandardMaterial({color: 0x6f5b3e, roughness: 0.45, metalness: 0.85});
    mats.foliageOlive = new THREE.MeshStandardMaterial({color: 0x6e7b57, roughness: 1.0, metalness: 0, flatShading: true});
    mats.foliageCypress = new THREE.MeshStandardMaterial({color: 0x38492f, roughness: 1.0, metalness: 0, flatShading: true});
    mats.trunk = new THREE.MeshStandardMaterial({color: 0x584634, roughness: 1.0, metalness: 0});
    return mats;
  }
  var marbleTex = noiseTex(256, 0.08, '#e8e0cf');
  marbleTex.repeat.set(4, 4);
  var marbleWornTex = marbleTex.clone();
  marbleWornTex.needsUpdate = true;
  marbleWornTex.repeat.set(2, 6);
  var rockTex = noiseTex(256, 0.35, '#9a8f7a');
  rockTex.repeat.set(8, 8);
  var rockDarkTex = rockTex.clone();
  rockDarkTex.needsUpdate = true;
  rockDarkTex.repeat.set(6, 3);
  var groundTex = noiseTex(256, 0.2, '#a9a08a');
  groundTex.repeat.set(60, 60);
  mats.marble = new THREE.MeshStandardMaterial({color: 0xe8e0cf, roughness: 0.75, metalness: 0, map: marbleTex});
  mats.marbleWorn = new THREE.MeshStandardMaterial({color: 0xd8cdb6, roughness: 0.9, metalness: 0, map: marbleWornTex});
  mats.marbleShadowed = new THREE.MeshStandardMaterial({color: 0xcfc4ad, roughness: 0.92, metalness: 0});
  mats.rock = new THREE.MeshStandardMaterial({color: 0x9a8f7a, roughness: 1.0, metalness: 0, map: rockTex});
  mats.rockDark = new THREE.MeshStandardMaterial({color: 0x7d735f, roughness: 1.0, metalness: 0, map: rockDarkTex});
  mats.ground = new THREE.MeshStandardMaterial({color: 0xa9a08a, roughness: 1.0, metalness: 0, map: groundTex});
  mats.city = new THREE.MeshStandardMaterial({color: 0xbfb6a4, roughness: 0.95, metalness: 0, flatShading: true});
  mats.terracotta = new THREE.MeshStandardMaterial({color: 0xb5643c, roughness: 0.85, metalness: 0});
  mats.bronze = new THREE.MeshStandardMaterial({color: 0x6f5b3e, roughness: 0.45, metalness: 0.85});
  mats.foliageOlive = new THREE.MeshStandardMaterial({color: 0x6e7b57, roughness: 1.0, metalness: 0, flatShading: true});
  mats.foliageCypress = new THREE.MeshStandardMaterial({color: 0x38492f, roughness: 1.0, metalness: 0, flatShading: true});
  mats.trunk = new THREE.MeshStandardMaterial({color: 0x584634, roughness: 1.0, metalness: 0});
  return mats;
};

</script>
<script data-module="02-helpers.js">
// Module 02: H — shared geometry helpers
window.makeHelpers = function (THREE, mats) {
  var H = {};
  var SEG = (window.CFG && window.CFG.SEG) || { colRadial: 40, colHeight: 4, capital: 24 };
  var PI = Math.PI, sqrt = Math.sqrt, sin = Math.sin, cos = Math.cos, atan2 = Math.atan2;

  // Deterministic value noise
  H.noise2 = function (x, z, seed) {
    function hash(ix, iz) {
      var s = sin(ix * 127.1 + iz * 311.7 + seed * 74.7) * 43758.5453;
      return s - Math.floor(s);
    }
    function smoothstep(t) {
      return t * t * (3 - 2 * t);
    }
    function octave(x, z, scale) {
      var xs = x * scale, zs = z * scale;
      var xi = Math.floor(xs), zi = Math.floor(zs);
      var xf = xs - xi, zf = zs - zi;
      var h00 = hash(xi, zi), h10 = hash(xi + 1, zi);
      var h01 = hash(xi, zi + 1), h11 = hash(xi + 1, zi + 1);
      var u = smoothstep(xf), v = smoothstep(zf);
      var n0 = h00 * (1 - u) + h10 * u;
      var n1 = h01 * (1 - u) + h11 * u;
      return n0 * (1 - v) + n1 * v;
    }
    var o1 = octave(x, z, 1);
    var o2 = octave(x, z, 2);
    var result = 0.65 * (2 * o1 - 1) + 0.35 * (2 * o2 - 1);
    return Math.max(-1, Math.min(1, result));
  };

  // Create InstancedMesh from geometry, material, and transforms
  H.instance = function (geo, mat, transforms) {
    var mesh = new THREE.InstancedMesh(geo, mat, transforms.length);
    for (var i = 0; i < transforms.length; i++) {
      var t = transforms[i];
      var pos = t.p || [0, 0, 0];
      var rot = t.r || [0, 0, 0];
      var scale = t.s || [1, 1, 1];
      var matrix = new THREE.Matrix4();
      var euler = new THREE.Euler(rot[0], rot[1], rot[2]);
      var quat = new THREE.Quaternion().setFromEuler(euler);
      matrix.compose(new THREE.Vector3(pos[0], pos[1], pos[2]), quat, new THREE.Vector3(scale[0], scale[1], scale[2]));
      mesh.setMatrixAt(i, matrix);
    }
    mesh.instanceMatrix.needsUpdate = true;
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
  };

  // Doric columns
  H.makeDoricColumns = function (positions, opts) {
    opts = opts || {};
    var height = opts.height !== undefined ? opts.height : 10.4;
    var baseD = opts.baseD !== undefined ? opts.baseD : 1.9;
    var topD = opts.topD !== undefined ? opts.topD : 1.48;
    var flutes = opts.flutes !== undefined ? opts.flutes : 20;
    var entasis = opts.entasis !== undefined ? opts.entasis : 0.02;
    var y = opts.y !== undefined ? opts.y : 0;
    var group = new THREE.Group();
    var shaftH = height * 0.92;

    // Shaft geometry with flutes
    var shaftGeo = new THREE.CylinderGeometry(topD / 2, baseD / 2, shaftH, Math.min(40, flutes * 2), SEG.colHeight);
    var pos = shaftGeo.getAttribute('position');
    var posArray = pos.array;
    for (var i = 0; i < posArray.length; i += 3) {
      var px = posArray[i], py = posArray[i + 1], pz = posArray[i + 2];
      var theta = atan2(pz, px);
      var r = sqrt(px * px + pz * pz);
      var yN = (py + shaftH / 2) / shaftH;
      var newR = r * (1 - 0.055 * (0.5 + 0.5 * cos(flutes * theta))) * (1 + entasis * sin(PI * yN));
      posArray[i] = newR * cos(theta);
      posArray[i + 2] = newR * sin(theta);
    }
    pos.needsUpdate = true;
    shaftGeo.computeVertexNormals();

    var echinosGeo = new THREE.CylinderGeometry(topD * 0.55, topD * 0.5, 0.35, SEG.capital);
    var abacusGeo = new THREE.BoxGeometry(topD * 1.35, 0.3, topD * 1.35);

    var shaftTransforms = [];
    var echinosTransforms = [];
    var abacusTransforms = [];
    for (var i = 0; i < positions.length; i++) {
      var px = positions[i][0], pz = positions[i][1];
      shaftTransforms.push({ p: [px, y + shaftH / 2, pz] });
      echinosTransforms.push({ p: [px, y + shaftH + 0.175, pz] });
      abacusTransforms.push({ p: [px, y + shaftH + 0.35 + 0.15, pz] });
    }

    group.add(H.instance(shaftGeo, mats.marbleWorn, shaftTransforms));
    group.add(H.instance(echinosGeo, mats.marbleWorn, echinosTransforms));
    group.add(H.instance(abacusGeo, mats.marbleWorn, abacusTransforms));
    return group;
  };

  // Ionic columns
  H.makeIonicColumns = function (positions, opts) {
    opts = opts || {};
    var height = opts.height !== undefined ? opts.height : 6.5;
    var baseD = opts.baseD !== undefined ? opts.baseD : 0.85;
    var topD = opts.topD !== undefined ? opts.topD : 0.72;
    var flutes = opts.flutes !== undefined ? opts.flutes : 24;
    var y = opts.y !== undefined ? opts.y : 0;
    var group = new THREE.Group();
    var shaftH = height * 0.86;

    var baseGeo = new THREE.CylinderGeometry(baseD * 0.62, baseD * 0.68, 0.3, 24);
    var shaftGeo = new THREE.CylinderGeometry(topD / 2, baseD * 0.62, shaftH, Math.min(40, flutes * 2), SEG.colHeight);
    var pos = shaftGeo.getAttribute('position');
    var posArray = pos.array;
    for (var i = 0; i < posArray.length; i += 3) {
      var px = posArray[i], py = posArray[i + 1], pz = posArray[i + 2];
      var theta = atan2(pz, px);
      var r = sqrt(px * px + pz * pz);
      var yN = (py + shaftH / 2) / shaftH;
      var newR = r * (1 - 0.025 * (0.5 + 0.5 * cos(flutes * theta)));
      posArray[i] = newR * cos(theta);
      posArray[i + 2] = newR * sin(theta);
    }
    pos.needsUpdate = true;
    shaftGeo.computeVertexNormals();

    var voluteGeo = new THREE.TorusGeometry(topD * 0.22, topD * 0.09, 6, 12);
    var abacusGeo = new THREE.BoxGeometry(topD * 1.5, 0.22, topD * 1.1);

    var baseTransforms = [], shaftTransforms = [], voluteTransforms = [], abacusTransforms = [];
    for (var i = 0; i < positions.length; i++) {
      var px = positions[i][0], pz = positions[i][1];
      baseTransforms.push({ p: [px, y + 0.15, pz] });
      shaftTransforms.push({ p: [px, y + 0.3 + shaftH / 2, pz] });
      voluteTransforms.push({ p: [px + topD * 0.55, y + 0.3 + shaftH, pz], r: [PI / 2, 0, 0] });
      voluteTransforms.push({ p: [px - topD * 0.55, y + 0.3 + shaftH, pz], r: [PI / 2, 0, 0] });
      abacusTransforms.push({ p: [px, y + 0.3 + shaftH + 0.22 / 2 + 0.11, pz] });
    }

    group.add(H.instance(baseGeo, mats.marbleWorn, baseTransforms));
    group.add(H.instance(shaftGeo, mats.marbleWorn, shaftTransforms));
    group.add(H.instance(voluteGeo, mats.marbleWorn, voluteTransforms));
    group.add(H.instance(abacusGeo, mats.marbleWorn, abacusTransforms));
    return group;
  };

  // Stepped base
  H.makeSteppedBase = function (w, d, steps, stepH, inset) {
    inset = inset !== undefined ? inset : 0.7;
    var group = new THREE.Group();
    for (var i = 0; i < steps; i++) {
      var geo = new THREE.BoxGeometry(w + 2 * inset * i, stepH, d + 2 * inset * i);
      var mesh = new THREE.Mesh(geo, mats.marble);
      mesh.position.y = -stepH * (i + 0.5);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      group.add(mesh);
    }
    return group;
  };

  // Entablature
  H.makeEntablature = function (w, d, h, o) {
    o = o || {};
    var triglyphs = o.triglyphs !== undefined ? o.triglyphs : true;
    var triglyphCount = o.triglyphCount !== undefined ? o.triglyphCount : 8;
    var cornice = o.cornice !== undefined ? o.cornice : true;
    var guttae = o.guttae !== undefined ? o.guttae : false;
    var group = new THREE.Group();

    // Architrave (4 boxes forming a ring)
    var archH = h * 0.40;
    var archThickness = 1.4;
    var aw = w / 2 - archThickness / 2, ad = d / 2 - archThickness / 2;
    var archGeos = [
      new THREE.BoxGeometry(w, archH, archThickness),
      new THREE.BoxGeometry(w, archH, archThickness),
      new THREE.BoxGeometry(archThickness, archH, d),
      new THREE.BoxGeometry(archThickness, archH, d)
    ];
    var archPoses = [
      [0, archH / 2, ad],
      [0, archH / 2, -ad],
      [aw, archH / 2, 0],
      [-aw, archH / 2, 0]
    ];
    for (var i = 0; i < 4; i++) {
      var mesh = new THREE.Mesh(archGeos[i], mats.marble);
      mesh.position.set(archPoses[i][0], archPoses[i][1], archPoses[i][2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      group.add(mesh);
    }

    // Frieze ring
    var friezeH = h * 0.35;
    var frieze = [
      new THREE.BoxGeometry(w, friezeH, archThickness),
      new THREE.BoxGeometry(w, friezeH, archThickness),
      new THREE.BoxGeometry(archThickness, friezeH, d),
      new THREE.BoxGeometry(archThickness, friezeH, d)
    ];
    var frizePoses = [
      [0, archH + friezeH / 2, ad],
      [0, archH + friezeH / 2, -ad],
      [aw, archH + friezeH / 2, 0],
      [-aw, archH + friezeH / 2, 0]
    ];
    for (var i = 0; i < 4; i++) {
      var mesh = new THREE.Mesh(frieze[i], mats.marbleShadowed);
      mesh.position.set(frizePoses[i][0], frizePoses[i][1], frizePoses[i][2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      group.add(mesh);
    }

    // Triglyphs
    if (triglyphs) {
      var trigGeo = new THREE.BoxGeometry(0.85, friezeH, 0.12);
      var trigTransforms = [];
      var xCount = triglyphCount;
      var zCount = Math.round(triglyphCount * d / w);
      var xStep = w / (xCount + 1), zStep = d / (zCount + 1);
      for (var i = 1; i <= xCount; i++) {
        trigTransforms.push({ p: [-(w / 2) + xStep * i, archH + friezeH / 2, d / 2 + 0.06] });
        trigTransforms.push({ p: [-(w / 2) + xStep * i, archH + friezeH / 2, -d / 2 - 0.06] });
      }
      for (var i = 1; i <= zCount; i++) {
        trigTransforms.push({ p: [w / 2 + 0.06, archH + friezeH / 2, -(d / 2) + zStep * i], r: [0, PI / 2, 0] });
        trigTransforms.push({ p: [-w / 2 - 0.06, archH + friezeH / 2, -(d / 2) + zStep * i], r: [0, PI / 2, 0] });
      }
      group.add(H.instance(trigGeo, mats.marble, trigTransforms));
    }

    // Cornice
    if (cornice) {
      var corniceH = h * 0.25;
      var cornOvhg = 0.45;
      var cornW = w + 2 * cornOvhg, cornD = d + 2 * cornOvhg;
      var cornices = [
        new THREE.BoxGeometry(cornW, corniceH, archThickness + 2 * cornOvhg),
        new THREE.BoxGeometry(cornW, corniceH, archThickness + 2 * cornOvhg),
        new THREE.BoxGeometry(archThickness + 2 * cornOvhg, corniceH, cornD),
        new THREE.BoxGeometry(archThickness + 2 * cornOvhg, corniceH, cornD)
      ];
      var cornPoses = [
        [0, archH + friezeH + corniceH / 2, (d / 2 + cornOvhg)],
        [0, archH + friezeH + corniceH / 2, -(d / 2 + cornOvhg)],
        [(w / 2 + cornOvhg), archH + friezeH + corniceH / 2, 0],
        [-(w / 2 + cornOvhg), archH + friezeH + corniceH / 2, 0]
      ];
      for (var i = 0; i < 4; i++) {
        var mesh = new THREE.Mesh(cornices[i], mats.marble);
        mesh.position.set(cornPoses[i][0], cornPoses[i][1], cornPoses[i][2]);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        group.add(mesh);
      }
    }

    return group;
  };

  // Pediment
  H.makePediment = function (w, d, h, o) {
    o = o || {};
    var figures = o.figures !== undefined ? o.figures : 9;
    var relief = o.relief !== undefined ? o.relief : true;
    var group = new THREE.Group();

    // Tympanum (triangular extrude)
    var shape = new THREE.Shape();
    shape.moveTo(-w / 2, 0);
    shape.lineTo(w / 2, 0);
    shape.lineTo(0, h);
    shape.lineTo(-w / 2, 0);
    var tympGeo = new THREE.ExtrudeGeometry(shape, { depth: d, bevelEnabled: false });
    tympGeo.translate(0, 0, -d / 2);
    var tympMesh = new THREE.Mesh(tympGeo, mats.marbleShadowed);
    tympMesh.castShadow = true;
    tympMesh.receiveShadow = true;
    group.add(tympMesh);

    // Raking cornice
    var slopeLen = sqrt((w / 2) * (w / 2) + h * h) + 0.4;
    var angle = atan2(h, w / 2);
    var rakingCornice = [
      new THREE.BoxGeometry(slopeLen, 0.4, d + 0.6),
      new THREE.BoxGeometry(slopeLen, 0.4, d + 0.6)
    ];
    var rakingPos = [
      [w / 4, h / 2, 0],
      [-w / 4, h / 2, 0]
    ];
    var rakingRot = [
      [0, 0, -angle],
      [0, 0, angle]
    ];
    for (var i = 0; i < 2; i++) {
      var mesh = new THREE.Mesh(rakingCornice[i], mats.marble);
      mesh.position.set(rakingPos[i][0], rakingPos[i][1], rakingPos[i][2]);
      mesh.rotation.set(rakingRot[i][0], rakingRot[i][1], rakingRot[i][2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      group.add(mesh);
    }

    // Figures
    for (var i = 0; i < figures; i++) {
      var xi = i / (figures - 1);
      var fx = -w * 0.42 + xi * w * 0.84;
      var fh = Math.max(0.6, 0.85 * h * (1 - Math.abs(fx) / (w / 2)));
      var fig = H.makeFigure(fh);
      fig.position.set(fx, fh / 2, d / 2 + 0.2);
      group.add(fig);
    }

    return group;
  };

  // Gable roof
  H.makeGableRoof = function (w, d, pitch, o) {
    o = o || {};
    var tiles = o.tiles !== undefined ? o.tiles : true;
    var acroteria = o.acroteria !== undefined ? o.acroteria : false;
    var group = new THREE.Group();
    var ridgeH = (w / 2) * pitch;
    var slopeLen = sqrt((w / 2) * (w / 2) + ridgeH * ridgeH);
    var angle = atan2(pitch, 1);

    // Two slabs
    var slab = [
      new THREE.BoxGeometry(slopeLen, 0.25, d),
      new THREE.BoxGeometry(slopeLen, 0.25, d)
    ];
    var slabPos = [[w / 4, ridgeH / 2, 0], [-w / 4, ridgeH / 2, 0]];
    var slabRot = [[0, 0, -angle], [0, 0, angle]];
    for (var i = 0; i < 2; i++) {
      var mesh = new THREE.Mesh(slab[i], mats.terracotta);
      mesh.position.set(slabPos[i][0], slabPos[i][1], slabPos[i][2]);
      mesh.rotation.set(slabRot[i][0], slabRot[i][1], slabRot[i][2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      group.add(mesh);
    }

    // Tiles
    if (tiles) {
      var tileGeo = new THREE.BoxGeometry(0.6, 0.06, 0.7);
      var tileTransforms = [];
      var tileCount = 0;
      var maxTiles = 1200;
      for (var si = 0; si < 2; si++) {
        var sx = si === 0 ? 1 : -1;
        var rowCount = Math.floor(slopeLen / 0.75);
        var colCount = Math.floor(d / 0.65);
        for (var r = 0; r < rowCount && tileCount < maxTiles; r++) {
          for (var c = 0; c < colCount && tileCount < maxTiles; c++) {
            var tx = sx * (w / 4 - (r + 0.5) * 0.75 * cos(angle));
            var ty = ridgeH / 2 + (r + 0.5) * 0.75 * sin(angle) + 0.14 * cos(angle);
            var tz = -(d / 2) + (c + 0.5) * 0.65;
            tileTransforms.push({ p: [tx, ty, tz], r: [0, 0, si === 0 ? -angle : angle] });
            tileCount++;
          }
        }
      }
      group.add(H.instance(tileGeo, mats.terracotta, tileTransforms));
    }

    // Ridge cap
    var ridgeCap = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.3, d), mats.terracotta);
    ridgeCap.position.y = ridgeH;
    ridgeCap.castShadow = true;
    ridgeCap.receiveShadow = true;
    group.add(ridgeCap);

    // Acroteria
    if (acroteria) {
      var acroGeo = new THREE.ConeGeometry(0.4, 1.2, 8);
      var acroTransforms = [
        { p: [0, ridgeH, d / 2] },
        { p: [w / 4, ridgeH, d / 2] },
        { p: [-w / 4, ridgeH, d / 2] },
        { p: [0, ridgeH, -d / 2] },
        { p: [w / 4, ridgeH, -d / 2] },
        { p: [-w / 4, ridgeH, -d / 2] }
      ];
      group.add(H.instance(acroGeo, mats.marble, acroTransforms));
    }

    return group;
  };

  // Figure
  H.makeFigure = function (height) {
    height = height !== undefined ? height : 1.8;
    var group = new THREE.Group();
    var legR = 0.07 * height, legLen = 0.45 * height;
    var legGeo = new THREE.CylinderGeometry(legR, legR, legLen, 8);
    group.add(H.instance(legGeo, mats.marble, [
      { p: [0.06 * height, legLen / 2, 0] },
      { p: [-0.06 * height, legLen / 2, 0] }
    ]));

    var torsoGeo = new THREE.CylinderGeometry(0.11 * height, 0.13 * height, 0.35 * height, 10);
    var torsoMesh = new THREE.Mesh(torsoGeo, mats.marble);
    torsoMesh.position.y = 0.625 * height;
    torsoMesh.castShadow = true;
    torsoMesh.receiveShadow = true;
    group.add(torsoMesh);

    var armR = 0.04 * height, armLen = 0.3 * height;
    var armGeo = new THREE.CylinderGeometry(armR, armR, armLen, 8);
    group.add(H.instance(armGeo, mats.marble, [
      { p: [0.16 * height, 0.62 * height, 0], r: [0, 0, -0.25] },
      { p: [-0.16 * height, 0.62 * height, 0], r: [0, 0, 0.25] }
    ]));

    var neckGeo = new THREE.CylinderGeometry(0.03 * height, 0.03 * height, 0.06 * height, 8);
    var neckMesh = new THREE.Mesh(neckGeo, mats.marble);
    neckMesh.position.y = 0.81 * height;
    neckMesh.castShadow = true;
    neckMesh.receiveShadow = true;
    group.add(neckMesh);

    var headGeo = new THREE.SphereGeometry(0.08 * height, 12, 8);
    var headMesh = new THREE.Mesh(headGeo, mats.marble);
    headMesh.position.y = 0.9 * height;
    headMesh.castShadow = true;
    headMesh.receiveShadow = true;
    group.add(headMesh);

    return group;
  };

  // Caryatid
  H.makeCaryatid = function (height) {
    height = height !== undefined ? height : 2.3;
    var group = new THREE.Group();

    var plinthGeo = new THREE.CylinderGeometry(0.35, 0.38, 0.25, 16);
    var plinthMesh = new THREE.Mesh(plinthGeo, mats.marble);
    plinthMesh.position.y = 0.125;
    plinthMesh.castShadow = true;
    plinthMesh.receiveShadow = true;
    group.add(plinthMesh);

    var bodyGeo = new THREE.CylinderGeometry(0.28, 0.42, height * 0.72, 16);
    var pos = bodyGeo.getAttribute('position');
    var posArray = pos.array;
    for (var i = 0; i < posArray.length; i += 3) {
      var px = posArray[i], pz = posArray[i + 2];
      var theta = atan2(pz, px);
      var r = sqrt(px * px + pz * pz);
      var newR = r * (1 + 0.06 * cos(8 * theta));
      posArray[i] = newR * cos(theta);
      posArray[i + 2] = newR * sin(theta);
    }
    pos.needsUpdate = true;
    var bodyMesh = new THREE.Mesh(bodyGeo, mats.marble);
    bodyMesh.position.y = 0.25 + height * 0.36;
    bodyMesh.castShadow = true;
    bodyMesh.receiveShadow = true;
    group.add(bodyMesh);

    var armGeo = new THREE.CylinderGeometry(0.07, 0.07, height * 0.5, 8);
    group.add(H.instance(armGeo, mats.marble, [
      { p: [0.28 - 0.07, 0.25 + height * 0.36, 0] },
      { p: [-(0.28 - 0.07), 0.25 + height * 0.36, 0] }
    ]));

    var headGeo = new THREE.SphereGeometry(0.14, 12, 8);
    var headMesh = new THREE.Mesh(headGeo, mats.marble);
    headMesh.position.y = 0.25 + height * 0.72 + 0.14;
    headMesh.castShadow = true;
    headMesh.receiveShadow = true;
    group.add(headMesh);

    var capitalGeo = new THREE.CylinderGeometry(0.32, 0.30, 0.28, 16);
    var capitalMesh = new THREE.Mesh(capitalGeo, mats.marble);
    capitalMesh.position.y = 0.25 + height * 0.72 + 0.28 + 0.14;
    capitalMesh.castShadow = true;
    capitalMesh.receiveShadow = true;
    group.add(capitalMesh);

    return group;
  };

  // Wall from polyline
  H.makeWall = function (points, height, thickness, mat) {
    mat = mat !== undefined ? mat : mats.rockDark;
    var group = new THREE.Group();
    for (var i = 0; i < points.length - 1; i++) {
      var p0 = points[i], p1 = points[i + 1];
      var dx = p1[0] - p0[0], dz = p1[1] - p0[1];
      var len = sqrt(dx * dx + dz * dz);
      var angle = -atan2(dz, dx);
      var wallGeo = new THREE.BoxGeometry(len + thickness, height, thickness);
      var wallMesh = new THREE.Mesh(wallGeo, mat);
      wallMesh.position.set((p0[0] + p1[0]) / 2, height / 2, (p0[1] + p1[1]) / 2);
      wallMesh.rotation.y = angle;
      wallMesh.castShadow = true;
      wallMesh.receiveShadow = true;
      group.add(wallMesh);
    }
    return group;
  };

  // Rock outcrop
  H.makeRockOutcrop = function (w, d, h, seed) {
    var geo = new THREE.PlaneGeometry(w, d, 48, 24);
    geo.rotateX(-PI / 2);
    var pos = geo.getAttribute('position');
    var posArray = pos.array;
    for (var i = 0; i < posArray.length; i += 3) {
      var px = posArray[i], pz = posArray[i + 2];
      posArray[i + 1] = h * (0.6 * H.noise2(px * 0.02, pz * 0.02, seed) + 0.4 * H.noise2(px * 0.08, pz * 0.08, seed + 9));
    }
    pos.needsUpdate = true;
    geo.computeVertexNormals();
    var mesh = new THREE.Mesh(geo, mats.rock);
    mesh.castShadow = false;
    mesh.receiveShadow = true;
    return mesh;
  };

  // Cella (interior chamber)
  H.makeCella = function (w, d, h, o) {
    o = o || {};
    var doorWidth = o.doorWidth !== undefined ? o.doorWidth : 4;
    var doorSide = o.doorSide !== undefined ? o.doorSide : '+z';
    var group = new THREE.Group();
    var thickness = 1.2;

    var sideX = new THREE.BoxGeometry(w, h, thickness);
    var sideZ = new THREE.BoxGeometry(thickness, h, d);

    var eastMesh = new THREE.Mesh(sideX, mats.marbleWorn);
    eastMesh.position.set(w / 2 + thickness / 2, h / 2, 0);
    eastMesh.castShadow = true;
    eastMesh.receiveShadow = true;
    group.add(eastMesh);

    var westMesh = new THREE.Mesh(sideX, mats.marbleWorn);
    westMesh.position.set(-w / 2 - thickness / 2, h / 2, 0);
    westMesh.castShadow = true;
    westMesh.receiveShadow = true;
    group.add(westMesh);

    var northMesh = new THREE.Mesh(sideZ, mats.marbleWorn);
    northMesh.position.set(0, h / 2, -d / 2 - thickness / 2);
    northMesh.castShadow = true;
    northMesh.receiveShadow = true;
    group.add(northMesh);

    var southMesh = new THREE.Mesh(sideZ, mats.marbleWorn);
    southMesh.position.set(0, h / 2, d / 2 + thickness / 2);
    southMesh.castShadow = true;
    southMesh.receiveShadow = true;
    group.add(southMesh);

    if (doorSide === '+z' || doorSide === '-z') {
      var dz = doorSide === '+z' ? d / 2 + thickness / 2 : -d / 2 - thickness / 2;
      var halfFlank = (w - doorWidth) / 2;
      var flank1 = new THREE.BoxGeometry(halfFlank, h, thickness);
      var flank1Mesh = new THREE.Mesh(flank1, mats.marbleWorn);
      flank1Mesh.position.set(-halfFlank / 2, h / 2, dz);
      flank1Mesh.castShadow = true;
      flank1Mesh.receiveShadow = true;
      group.add(flank1Mesh);

      var flank2 = new THREE.BoxGeometry(halfFlank, h, thickness);
      var flank2Mesh = new THREE.Mesh(flank2, mats.marbleWorn);
      flank2Mesh.position.set(halfFlank / 2, h / 2, dz);
      flank2Mesh.castShadow = true;
      flank2Mesh.receiveShadow = true;
      group.add(flank2Mesh);

      var lintel = new THREE.BoxGeometry(doorWidth, h * 0.3, thickness);
      var lintelMesh = new THREE.Mesh(lintel, mats.marbleWorn);
      lintelMesh.position.set(0, h * 0.7, dz);
      lintelMesh.castShadow = true;
      lintelMesh.receiveShadow = true;
      group.add(lintelMesh);
    } else if (doorSide === '+x' || doorSide === '-x') {
      var dx = doorSide === '+x' ? w / 2 + thickness / 2 : -w / 2 - thickness / 2;
      var halfFlank = (d - doorWidth) / 2;
      var flank1 = new THREE.BoxGeometry(thickness, h, halfFlank);
      var flank1Mesh = new THREE.Mesh(flank1, mats.marbleWorn);
      flank1Mesh.position.set(dx, h / 2, -halfFlank / 2);
      flank1Mesh.castShadow = true;
      flank1Mesh.receiveShadow = true;
      group.add(flank1Mesh);

      var flank2 = new THREE.BoxGeometry(thickness, h, halfFlank);
      var flank2Mesh = new THREE.Mesh(flank2, mats.marbleWorn);
      flank2Mesh.position.set(dx, h / 2, halfFlank / 2);
      flank2Mesh.castShadow = true;
      flank2Mesh.receiveShadow = true;
      group.add(flank2Mesh);

      var lintel = new THREE.BoxGeometry(thickness, h * 0.3, doorWidth);
      var lintelMesh = new THREE.Mesh(lintel, mats.marbleWorn);
      lintelMesh.position.set(dx, h * 0.7, 0);
      lintelMesh.castShadow = true;
      lintelMesh.receiveShadow = true;
      group.add(lintelMesh);
    }

    return group;
  };

  // Block course ring
  H.makeBlockCourse = function (w, d, h, blockLen) {
    var blockGeo = new THREE.BoxGeometry(blockLen * 0.96, h * 0.96, 1.0);
    var transforms = [];
    var thickness = 1.0;

    // Top side (+z)
    var zTopCount = Math.floor(d / blockLen);
    for (var i = 0; i < zTopCount; i++) {
      var bx = -(w / 2) + thickness / 2;
      var bz = -(d / 2) + (i + 0.5) * blockLen;
      transforms.push({ p: [bx, h / 2, bz], r: [0, Math.PI / 2, 0] });
    }

    // Bottom side (-z)
    var zBottomCount = Math.floor(d / blockLen);
    for (var i = 0; i < zBottomCount; i++) {
      var bx = w / 2 - thickness / 2;
      var bz = -(d / 2) + (i + 0.5) * blockLen;
      transforms.push({ p: [bx, h / 2, bz], r: [0, Math.PI / 2, 0] });
    }

    // Left side (-x)
    var xLeftCount = Math.floor(w / blockLen);
    for (var i = 0; i < xLeftCount; i++) {
      var bx = -(w / 2) + (i + 0.5) * blockLen;
      var bz = d / 2 - thickness / 2;
      transforms.push({ p: [bx, h / 2, bz] });
    }

    // Right side (+x)
    var xRightCount = Math.floor(w / blockLen);
    for (var i = 0; i < xRightCount; i++) {
      var bx = -(w / 2) + (i + 0.5) * blockLen;
      var bz = -(d / 2) + thickness / 2;
      transforms.push({ p: [bx, h / 2, bz] });
    }

    return H.instance(blockGeo, mats.marbleWorn, transforms);
  };

  return H;
};

<script data-module="03-terrain.js">
// Terrain: plateau, cliffs, ground, city blocks, sacred way
window.buildTerrain = function (THREE, mats, H) {
  var group = new THREE.Group();

  // 1. Plateau top
  var top = H.makeRockOutcrop(300, 150, 4, 7);
  var pos = top.geometry.attributes.position;
  var posArray = pos.array;
  for (var i = 0; i < posArray.length; i += 3) {
    var x = posArray[i];
    var y = posArray[i + 1];
    var z = posArray[i + 2];
    var e = Math.sqrt((x / 150) * (x / 150) + (z / 75) * (z / 75));
    if (e < 0.6) {
      posArray[i + 1] = y * 0.25;
    } else if (e > 0.9) {
      posArray[i + 1] = y - (e - 0.9) * 30;
    }
  }
  pos.needsUpdate = true;
  top.geometry.computeVertexNormals();
  top.position.set(-45, 0, 0);
  top.receiveShadow = true;
  group.add(top);

  // 2. Cliff skirt
  var cliffGeo = new THREE.CylinderGeometry(1, 1.06, 80, 40, 6, true);
  var cliffPos = cliffGeo.attributes.position;
  var cliffArray = cliffPos.array;
  for (var i = 0; i < cliffArray.length; i += 3) {
    var x = cliffArray[i];
    var y = cliffArray[i + 1];
    var z = cliffArray[i + 2];
    var f = 1 + 0.04 * H.noise2(x * 3, y * 0.05, 3);
    cliffArray[i] = x * f;
    cliffArray[i + 2] = z * f;
  }
  cliffPos.needsUpdate = true;
  cliffGeo.computeVertexNormals();
  var cliffMesh = new THREE.Mesh(cliffGeo, mats.rockDark);
  cliffMesh.scale.set(150, 1, 75);
  cliffMesh.position.set(-45, -39, 0);
  cliffMesh.castShadow = true;
  cliffMesh.receiveShadow = true;
  group.add(cliffMesh);

  // 3. Ground
  var groundGeo = new THREE.PlaneGeometry(3000, 3000);
  groundGeo.rotateX(-Math.PI / 2);
  var groundMesh = new THREE.Mesh(groundGeo, mats.ground);
  groundMesh.position.y = -80.4;
  groundMesh.receiveShadow = true;
  group.add(groundMesh);

  // 4. City blocks (LCG)
  var transforms = [];
  var seed = 7;
  var count = 0;
  while (count < 220) {
    seed = (seed * 1103515245 + 12345) >>> 0;
    var angle = ((seed >>> 16) & 0x7FFF) / 0x7FFF * 2 * Math.PI;
    seed = (seed * 1103515245 + 12345) >>> 0;
    var r = 220 + ((seed >>> 16) & 0x7FFF) / 0x7FFF * 1080;
    var x = r * Math.cos(angle);
    var z = r * Math.sin(angle);
    var dx = x + 45;
    var ellipse = (dx / 160) * (dx / 160) + (z / 85) * (z / 85);
    if (ellipse < 1) continue;

    seed = (seed * 1103515245 + 12345) >>> 0;
    var sx = 8 + ((seed >>> 16) & 0x7FFF) / 0x7FFF * 14;
    seed = (seed * 1103515245 + 12345) >>> 0;
    var sz = 8 + ((seed >>> 16) & 0x7FFF) / 0x7FFF * 14;
    seed = (seed * 1103515245 + 12345) >>> 0;
    var sy = 6 + ((seed >>> 16) & 0x7FFF) / 0x7FFF * 10;
    seed = (seed * 1103515245 + 12345) >>> 0;
    var yaw = ((seed >>> 16) & 0x7FFF) / 0x7FFF * 2 * Math.PI;

    transforms.push({
      p: [x, -80 + sy / 2, z],
      r: [0, yaw, 0],
      s: [sx, sy, sz]
    });
    count++;
  }
  var cityMesh = H.instance(new THREE.BoxGeometry(1, 1, 1), mats.city, transforms);
  group.add(cityMesh);

  // 5. Sacred Way (30 boxes)
  var sacredTransforms = [];
  for (var i = 0; i < 30; i++) {
    var t = i / 29;
    var px = -200 + t * 60;
    var py = -60 + t * 58;
    var pz = 40 + t * (-36);
    sacredTransforms.push({
      p: [px, py, pz],
      r: [0, 0, 0],
      s: [6, 0.3, 5]
    });
  }
  var sacredMesh = H.instance(new THREE.BoxGeometry(1, 1, 1), mats.marbleShadowed, sacredTransforms);
  sacredMesh.castShadow = false;
  sacredMesh.receiveShadow = true;
  group.add(sacredMesh);

  return group;
};

</script>
<script data-module="04-parthenon.js">
// Module 04 - Parthenon
window.buildParthenon = function (THREE, mats, H) {
  var group = new THREE.Group();

  // Stylobate
  var stylobate = H.makeSteppedBase(30.9, 69.5, 3, 0.55, 0.7);
  group.add(stylobate);

  // Peristyle columns - 8 × 17 = 46 columns
  // Rectangle inset 1.3 from stylobate edge: x = ±14.15, z = ±33.45
  var colPositions = [];

  // Short sides: 8 columns at z = ±33.45
  for (var i = 0; i < 8; i++) {
    var x = -14.15 + (28.3 / 7) * i;
    colPositions.push([x, 33.45]);
    colPositions.push([x, -33.45]);
  }

  // Long sides: 17 columns at x = ±14.15, excluding corners
  for (var i = 1; i < 16; i++) {
    var z = -33.45 + (66.9 / 16) * i;
    colPositions.push([14.15, z]);
    colPositions.push([-14.15, z]);
  }

  var colGroup = H.makeDoricColumns(colPositions, {height: 10.43, baseD: 1.91, topD: 1.48, flutes: 20});
  group.add(colGroup);

  // Entablature at y = 10.43
  var entablature = H.makeEntablature(30.9, 69.5, 3.3, {triglyphs: true, triglyphCount: 16});
  entablature.position.y = 10.43;
  group.add(entablature);

  // Pediments
  var pedimentFront = H.makePediment(30.9, 1.2, 3.4, {figures: 11});
  pedimentFront.position.set(0, 13.73, 34.75);
  group.add(pedimentFront);

  var pedimentBack = H.makePediment(30.9, 1.2, 3.4, {figures: 11});
  pedimentBack.position.set(0, 13.73, -34.75);
  pedimentBack.rotation.y = Math.PI;
  group.add(pedimentBack);

  // Roof at y = 13.7
  var roof = H.makeGableRoof(31.5, 70, 0.22, {tiles: true, acroteria: true});
  roof.position.y = 13.7;
  group.add(roof);

  // Cella at (0, 0, 0)
  var cella = H.makeCella(21.7, 59, 10.0, {doorWidth: 4.5, doorSide: '+z'});
  group.add(cella);

  // Pronaos: 6 Doric columns at z = +26, x evenly in [-9, 9]
  var pronaosCols = [];
  for (var i = 0; i < 6; i++) {
    var x = -9 + (18 / 5) * i;
    pronaosCols.push([x, 26]);
  }
  var pronaoGroup = H.makeDoricColumns(pronaosCols, {height: 8.0, baseD: 1.5, topD: 1.2});
  group.add(pronaoGroup);

  // Opisthodomos: 6 Doric columns at z = -26, x evenly in [-9, 9]
  var opisthodomosCols = [];
  for (var i = 0; i < 6; i++) {
    var x = -9 + (18 / 5) * i;
    opisthodomosCols.push([x, -26]);
  }
  var opisthodoGroup = H.makeDoricColumns(opisthodomosCols, {height: 8.0, baseD: 1.5, topD: 1.2});
  group.add(opisthodoGroup);

  // Interior colonnade: two rows of 10 Doric columns at x = ±7.5, z evenly from -20 to +18
  var interiorCols = [];
  for (var i = 0; i < 10; i++) {
    var z = -20 + (38 / 9) * i;
    interiorCols.push([7.5, z]);
    interiorCols.push([-7.5, z]);
  }
  // Rear row: 5 columns at z = -23, x evenly in [-6, 6]
  for (var i = 0; i < 5; i++) {
    var x = -6 + (12 / 4) * i;
    interiorCols.push([x, -23]);
  }
  var interiorGroup = H.makeDoricColumns(interiorCols, {height: 5.0, baseD: 0.9, topD: 0.75, flutes: 16});
  group.add(interiorGroup);

  // Inner frieze band at y = 9.0
  var frieze = H.makeBlockCourse(22.5, 59.8, 1.0, 1.2);
  frieze.position.y = 9.0;
  group.add(frieze);

  // Cult statue
  var statue = H.makeFigure(11.5);
  statue.position.set(0, 0, -10);
  statue.traverse(function (o) {
    if (o.isMesh) {
      o.material = mats.bronze;
    }
  });
  group.add(statue);

  return group;
};

</script>
<script data-module="05-erechtheion.js">
// Erechtheion: complex split-level temple with east/north/south/west porches and olive tree
window.buildErechtheion = function (THREE, mats, H) {
  var group = new THREE.Group();
  group.position.set(-42, 0, -34);

  // Base: stepped base for the main structure
  var base = H.makeSteppedBase(22.8, 11.6, 2, 0.5);
  group.add(base);

  // Main block: cella with entablature and gable roof
  var cella = H.makeCella(22.8, 11.6, 6.6, {doorWidth: 3, doorSide: '+x'});
  group.add(cella);

  var entablatureMain = H.makeEntablature(22.8, 11.6, 1.6, {triglyphs: false});
  entablatureMain.position.y = 6.6;
  group.add(entablatureMain);

  var roofMain = H.makeGableRoof(11.6, 22.8, 0.2, {tiles: true});
  roofMain.rotation.y = Math.PI / 2;
  roofMain.position.y = 8.2;
  group.add(roofMain);

  // East porch: 6 Ionic columns at x = 12.9, z evenly spaced from -5.2 to 5.2
  var eastPositions = [
    [12.9, -5.2],
    [12.9, -3.12],
    [12.9, -1.04],
    [12.9, 1.04],
    [12.9, 3.12],
    [12.9, 5.2]
  ];

<script data-module="07-walls.js">
// Module 07 — Plateau perimeter walls
window.buildWalls = function (THREE, mats, H) {
  var group = new THREE.Group();
  group.position.set(0, -1, 0);

  // Generate perimeter ellipse points with jitter
  var perimeter = [];
  for (var i = 0; i < 28; i++) {
    var a = (i / 28) * Math.PI * 2;
    var jit = 1 + 0.04 * H.noise2(Math.cos(a) * 5, Math.sin(a) * 5, 11);
    var x = -45 + 148 * Math.cos(a) * jit;
    var z = 73 * Math.sin(a) * jit;
    perimeter.push([x, z]);
  }

  // Filter out gate gap (x < -150 and |z| < 20)
  var filtered = [];
  for (var i = 0; i < perimeter.length; i++) {
    var pt = perimeter[i];
    if (!(pt[0] < -150 && Math.abs(pt[1]) < 20)) {
      filtered.push(pt);
    }
  }

  // Check wraparound distance between last and first point
  if (filtered.length > 1) {
    var lastPt = filtered[filtered.length - 1];
    var firstPt = filtered[0];
    var wrapDist = Math.sqrt((firstPt[0] - lastPt[0]) ** 2 + (firstPt[1] - lastPt[1]) ** 2);

    // If wraparound distance is small (not the gate gap), find the real gap and reorder
    if (wrapDist < 50) {
      // Find the large gap (the real gate gap)
      var gapIdx = -1;
      for (var i = 0; i < filtered.length - 1; i++) {
        var curr = filtered[i];
        var next = filtered[i + 1];
        var dist = Math.sqrt((next[0] - curr[0]) ** 2 + (next[1] - curr[1]) ** 2);
        if (dist > 50) {
          gapIdx = i;
          break;
        }
      }

      // If gap found, reorder array to start right after the gap
      if (gapIdx >= 0) {
        var reordered = [];
        for (var i = gapIdx + 1; i < filtered.length; i++) {
          reordered.push(filtered[i]);
        }
        for (var i = 0; i <= gapIdx; i++) {
          reordered.push(filtered[i]);
        }
        filtered = reordered;
      }
    }
  }

  // Split into contiguous runs (separated by the gap)
  var runs = [];
  var currentRun = [];
  for (var i = 0; i < filtered.length; i++) {
    currentRun.push(filtered[i]);
    // Check if we need to break to next run
    var nextIdx = (i + 1) % filtered.length;
    if (i < filtered.length - 1) {
      var curr = filtered[i];
      var next = filtered[nextIdx];
      var dist = Math.sqrt((next[0] - curr[0]) ** 2 + (next[1] - curr[1]) ** 2);
      if (dist > 50) {
        // Large gap indicates separation
        runs.push(currentRun);
        currentRun = [];
      }
    }
  }
  if (currentRun.length > 0) {
    runs.push(currentRun);
  }

  // Build a map of subRuns with their heights for use in ashlar cap
  var allSubRuns = [];

  // For each run, determine height based on z > 40 threshold and build walls
  for (var r = 0; r < runs.length; r++) {
    var run = runs[r];
    // Split run at z = 40 threshold
    var subRuns = [];
    var currentSub = [];
    for (var i = 0; i < run.length; i++) {
      if (currentSub.length > 0) {
        var lastPt = currentSub[currentSub.length - 1];
        var currPt = run[i];
        // Check if we cross z = 40 threshold
        if ((lastPt[1] > 40) !== (currPt[1] > 40)) {
          // Interpolate crossing point
          var t = (40 - lastPt[1]) / (currPt[1] - lastPt[1]);
          var crossX = lastPt[0] + t * (currPt[0] - lastPt[0]);
          currentSub.push([crossX, 40]);
          subRuns.push(currentSub);
          currentSub = [[crossX, 40]];
        }
      }
      currentSub.push(run[i]);
    }
    if (currentSub.length > 0) {
      subRuns.push(currentSub);
    }

    // Build walls for each sub-run and track them
    for (var s = 0; s < subRuns.length; s++) {
      var sub = subRuns[s];
      var avgZ = 0;
      for (var i = 0; i < sub.length; i++) {
        avgZ += sub[i][1];
      }
      avgZ /= sub.length;
      var h = avgZ > 40 ? 9 : 7;
      var wallGroup = H.makeWall(sub, h, 3.5, mats.rockDark);
      group.add(wallGroup);

      // Store this subRun with its height for ashlar cap
      allSubRuns.push({
        points: sub,
        h: h
      });
    }
  }

  // Ashlar cap on south stretch (z > 40) using subRuns
  var ashlarBlocks = [];
  for (var sr = 0; sr < allSubRuns.length; sr++) {
    var subRun = allSubRuns[sr];
    // Only place caps on subRuns with h === 9 (z > 40 portions)
    if (subRun.h === 9) {
      var run = subRun.points;
      // Place blocks along this subRun
      for (var i = 0; i < run.length - 1; i++) {
        var p1 = run[i];
        var p2 = run[i + 1];
        var dx = p2[0] - p1[0];
        var dz = p2[1] - p1[1];
        var segLen = Math.sqrt(dx * dx + dz * dz);
        var angle = Math.atan2(dz, dx);

        // Place blocks every 1.4 units
        for (var dist = 0; dist < segLen; dist += 1.4) {
          var t = dist / segLen;
          var bx = p1[0] + t * dx;
          var bz = p1[1] + t * dz;
          ashlarBlocks.push({
            p: [bx, 9.4, bz],
            r: [0, angle, 0],
            s: [1, 1, 1]
          });
        }
      }
    }
  }

  if (ashlarBlocks.length > 0) {
    var ashlarGeo = new THREE.BoxGeometry(1.3, 0.8, 3.7);
    var ashlarMesh = H.instance(ashlarGeo, mats.marbleWorn, ashlarBlocks);
    group.add(ashlarMesh);
  }

  // Two flanking towers at the gap
  var towerGeo = new THREE.BoxGeometry(8, 11, 8);
  var tower1 = new THREE.Mesh(towerGeo, mats.rockDark);
  tower1.position.set(-158, 5.5, -22);
  tower1.castShadow = true;
  tower1.receiveShadow = true;
  group.add(tower1);

  var tower2 = new THREE.Mesh(towerGeo, mats.rockDark);
  tower2.position.set(-158, 5.5, 22);
  tower2.castShadow = true;
  tower2.receiveShadow = true;
  group.add(tower2);

  // Beulé gate at (-165, 0, 8)
  // Two towers
  var gateTowerGeo = new THREE.BoxGeometry(5, 9, 5);
  var gateTower1 = new THREE.Mesh(gateTowerGeo, mats.marbleWorn);
  gateTower1.position.set(-165, 4.5, 3);
  gateTower1.castShadow = true;
  gateTower1.receiveShadow = true;
  group.add(gateTower1);

  var gateTower2 = new THREE.Mesh(gateTowerGeo, mats.marbleWorn);
  gateTower2.position.set(-165, 4.5, 13);
  gateTower2.castShadow = true;
  gateTower2.receiveShadow = true;
  group.add(gateTower2);

  // Lintel
  var lintelGeo = new THREE.BoxGeometry(1.5, 1.5, 12);
  var lintel = new THREE.Mesh(lintelGeo, mats.marbleWorn);
  lintel.position.set(-165, 8.5, 8);
  lintel.castShadow = true;
  lintel.receiveShadow = true;
  group.add(lintel);

  return group;
};

  var theatreGroup = new THREE.Group();
  theatreGroup.position.set(-6, -46, 96);

  // Cavea rings (24 rings)
  for (var i = 0; i < 24; i++) {
    var r = 22 + i * 1.05;
    var cavGeom = new THREE.CylinderGeometry(r, r, 0.6, 40, 1, true, -1.75, 3.5);

      var rOuter = 22 + (i + 1) * 1.05;
      var treadGeom = new THREE.RingGeometry(rInner, rOuter, 40, 1, -1.75, 3.5);

  group.add(theatreGroup);

  for (var i = 0; i < 18; i++) {

    if (i < 17) {
      var rInner = r;
      var rOuter = 14 + (i + 1) * 1.33;
      var treadGeom = new THREE.RingGeometry(rInner, rOuter, 40, 1, -1.571, 3.142);
      var treadMesh = new THREE.Mesh(treadGeom, mats.marble);
      treadMesh.rotation.x = -Math.PI / 2;
      treadMesh.rotation.y = Math.PI;
      treadMesh.position.y = i * 0.8 + 0.4;
      treadMesh.receiveShadow = true;
      treadMesh.castShadow = false;
      odeonGroup.add(treadMesh);
    }
  }

  // Half-disc orchestra
  var odorchGeom = new THREE.CylinderGeometry(12, 12, 0.3, 32, 1, false, -1.571, 3.142);
  var odorchMesh = new THREE.Mesh(odorchGeom, mats.marble);
  odorchMesh.castShadow = true;
  odorchMesh.receiveShadow = true;
  odorchMesh.rotation.y = Math.PI;
  odorchMesh.position.y = -0.15;
  odeonGroup.add(odorchMesh);

  // Stage wall
  var stageGeom = new THREE.BoxGeometry(76, 22, 3);
  var stageMesh = new THREE.Mesh(stageGeom, mats.rock);
  stageMesh.castShadow = true;
  stageMesh.receiveShadow = true;
  stageMesh.position.set(0, 11, 22);
  odeonGroup.add(stageMesh);

  // Niches: 3 tiers × 8 = 24 niches
  var nicheGeom = new THREE.BoxGeometry(3, 5, 0.8);
  var nicheTransforms = [];
  for (var tier = 0; tier < 3; tier++) {
    var tierY = [4, 10, 16][tier];
    for (var j = 0; j < 8; j++) {
      var tierX = -33 + (j * 66 / 7);
      nicheTransforms.push({
        p: [tierX, tierY, 22 - 1.2]
      });
    }
  }
  var nicheInstances = H.instance(nicheGeom, mats.marbleShadowed, nicheTransforms);
  odeonGroup.add(nicheInstances);

  // Arches: 3 tiers × 8 = 24 arches
  var archGeom = new THREE.TorusGeometry(1.5, 0.3, 8, 16, Math.PI);
  var archTransforms = [];
  for (var tier = 0; tier < 3; tier++) {
    var tierBaseY = [4, 10, 16][tier];
    var tierY = tierBaseY + 2.5;
    for (var j = 0; j < 8; j++) {
      var tierX = -33 + (j * 66 / 7);
      archTransforms.push({
        p: [tierX, tierY, 22 - 1.2]
      });
    }
  }
  var archInstances = H.instance(archGeom, mats.rock, archTransforms);
  odeonGroup.add(archInstances);

  group.add(odeonGroup);

  return group;
};

<script data-module="09-scenery.js">
// Module 09 - Scenery
window.buildScenery = function (THREE, mats, H) {
  var group = new THREE.Group();

  // Deterministic LCG (seed 42)
  var s = 42;
  function rnd() {
    s = (s * 1664525 + 1013904223) % 4294967296;
    return s / 4294967296;
  }

  // Athena Promachos at (-62, 0, -12)
  var promachos = new THREE.Group();
  promachos.position.set(-62, 0, -12);

  var plinth = new THREE.Mesh(
    new THREE.BoxGeometry(3, 2.5, 3),
    mats.marble
  );
  plinth.position.y = 1.25;
  plinth.castShadow = true;
  plinth.receiveShadow = true;
  promachos.add(plinth);

  var fig = H.makeFigure(9.0);
  fig.position.y = 2.5;
  fig.traverse(function (o) {
    if (o.isMesh) {
      o.material = mats.bronze;
      o.castShadow = true;
      o.receiveShadow = true;
    }
  });
  promachos.add(fig);

  var spear = new THREE.Mesh(
    new THREE.CylinderGeometry(0.08, 0.08, 11, 6),
    mats.bronze
  );
  spear.position.set(-62 + 1.2, 2.5 + 5.5, -12);
  spear.castShadow = true;
  spear.receiveShadow = true;
  group.add(spear);

  group.add(promachos);

  // Great Altar at (-8, 0, -41)
  var altar = new THREE.Group();
  altar.position.set(-8, 0, -41);

  var altarBase = new THREE.Mesh(
    new THREE.BoxGeometry(12, 2.2, 6),
    mats.marble
  );
  altarBase.position.y = 1.1;
  altarBase.castShadow = true;
  altarBase.receiveShadow = true;
  altar.add(altarBase);

  var altarTop = new THREE.Mesh(
    new THREE.BoxGeometry(10, 0.6, 4),
    mats.marble
  );
  altarTop.position.y = 2.5;
  altarTop.castShadow = true;
  altarTop.receiveShadow = true;
  altar.add(altarTop);

  group.add(altar);

  // Olive trees - 34 trees
  var oliveTrees = [];
  var oliveCount = 0;
  var maxAttempts = 1000;
  var attempts = 0;

  while (oliveCount < 34 && attempts < maxAttempts) {
    attempts++;

    var angle = rnd() * Math.PI * 2;
    var radiusFactor = 0.78 + rnd() * (0.92 - 0.78);
    var rx = 148;
    var rz = 73;
    var x = -45 + Math.cos(angle) * rx * radiusFactor;
    var z = 0 + Math.sin(angle) * rz * radiusFactor;

    var excluded = false;
    var exclusions = [
      {x0: -18, z0: -38, x1: 18, z1: 38},      // Parthenon
      {x0: -56, z0: -46, x1: -28, z1: -22},    // Erechtheion
      {x0: -135, z0: -30, x1: -100, z1: 25},   // Propylaea
      {x0: -140, z0: 12, x1: -126, z1: 28},    // Nike
      {x0: -66, z0: -16, x1: -58, z1: -8},     // Promachos
      {x0: -16, z0: -46, x1: 0, z1: -36}       // Altar
    ];

    for (var i = 0; i < exclusions.length; i++) {
      var ex = exclusions[i];
      if (x >= ex.x0 && x <= ex.x1 && z >= ex.z0 && z <= ex.z1) {
        excluded = true;
        break;
      }
    }

    if (!excluded) {
      oliveTrees.push({x: x, z: z});
      oliveCount++;
    }
  }

  // Olive trunks
  var oliveTrunkTransforms = [];
  for (var i = 0; i < oliveTrees.length; i++) {
    oliveTrunkTransforms.push({p: [oliveTrees[i].x, 1.3, oliveTrees[i].z]});
  }

  var oliveTrunk = H.instance(
    new THREE.CylinderGeometry(0.25, 0.4, 2.6, 8),
    mats.trunk,
    oliveTrunkTransforms
  );
  group.add(oliveTrunk);

  // Olive canopies - 3 blobs per tree
  var oliveCanopyTransforms = [];
  for (var i = 0; i < oliveTrees.length; i++) {
    var tree = oliveTrees[i];
    for (var j = 0; j < 3; j++) {
      var offsetAngle = (j / 3) * Math.PI * 2;
      var offsetDist = 1.5;
      var offsetX = tree.x + Math.cos(offsetAngle) * offsetDist;
      var offsetZ = tree.z + Math.sin(offsetAngle) * offsetDist;
      var offsetY = 3.5 + (rnd() - 0.5) * 2 * 0.8;
      var scale = 0.8 + rnd() * (1.2 - 0.8);
      oliveCanopyTransforms.push({
        p: [offsetX, offsetY, offsetZ],
        s: [scale, scale, scale]
      });
    }
  }

  var oliveCanopy = H.instance(
    new THREE.IcosahedronGeometry(1.9, 0),
    mats.foliageOlive,
    oliveCanopyTransforms
  );
  group.add(oliveCanopy);

  // Cypresses - 12 on south slope
  var cypresses = [];
  for (var i = 0; i < 12; i++) {
    var cx = -150 + rnd() * (40 - (-150));
    var cz = 80 + rnd() * (110 - 80);
    var cy = -8 - (cz - 80) * 0.7;
    cypresses.push({x: cx, z: cz, y: cy});
  }

  // Cypress canopies
  var cypressCanopyTransforms = [];
  for (var i = 0; i < cypresses.length; i++) {
    cypressCanopyTransforms.push({
      p: [cypresses[i].x, cypresses[i].y + 5.2, cypresses[i].z]
    });
  }

  var cypressCanopy = H.instance(
    new THREE.ConeGeometry(1.3, 9, 8),
    mats.foliageCypress,
    cypressCanopyTransforms
  );
  group.add(cypressCanopy);

  // Cypress trunks
  var cypressTrunkTransforms = [];
  for (var i = 0; i < cypresses.length; i++) {
    cypressTrunkTransforms.push({
      p: [cypresses[i].x, cypresses[i].y + 0.75, cypresses[i].z]
    });
  }

  var cypressTrunk = H.instance(
    new THREE.CylinderGeometry(0.2, 0.25, 1.5, 6),
    mats.trunk,
    cypressTrunkTransforms
  );
  group.add(cypressTrunk);

  // Rubble blocks - 60 blocks on ellipse at radius factor [0.85, 0.93]
  var rubbleTransforms = [];
  for (var i = 0; i < 60; i++) {
    var angle = (i / 60) * Math.PI * 2;
    var radiusFactor = 0.85 + rnd() * (0.93 - 0.85);
    var rx = 148;
    var rz = 73;
    var rbx = -45 + Math.cos(angle) * rx * radiusFactor;
    var rbz = 0 + Math.sin(angle) * rz * radiusFactor;
    var yaw = rnd() * Math.PI * 2;

    rubbleTransforms.push({
      p: [rbx, 0.25, rbz],
      r: [0, yaw, 0]
    });
  }

  var rubble = H.instance(
    new THREE.BoxGeometry(1.2, 0.5, 0.8),
    mats.marbleWorn,
    rubbleTransforms
  );
  group.add(rubble);

  return group;
};

</script>

<script data-module="11-orbit.js">
// Orbit camera controller
window.makeOrbit = function (THREE, camera, el, opts) {
  opts = opts || {};
  var target = opts.target !== undefined ? opts.target : new THREE.Vector3(0, 0, 0);
  var minDist = opts.minDist !== undefined ? opts.minDist : 25;
  var maxDist = opts.maxDist !== undefined ? opts.maxDist : 900;
  var minPolar = opts.minPolar !== undefined ? opts.minPolar : 0.08;
  var maxPolar = opts.maxPolar !== undefined ? opts.maxPolar : 1.50;
  var damping = opts.damping !== undefined ? opts.damping : 0.09;
  var autoRotate = opts.autoRotate !== undefined ? opts.autoRotate : true;

  var dx = camera.position.x - target.x;
  var dy = camera.position.y - target.y;
  var dz = camera.position.z - target.z;
  var radius = Math.sqrt(dx * dx + dy * dy + dz * dz);
  if (radius === 0) radius = 100;
  var phi = Math.acos(Math.max(-1, Math.min(1, dy / radius)));
  var theta = Math.atan2(dx, dz);

  var theta_t = theta;
  var phi_t = phi;
  var radius_t = radius;
  var lastInteract = performance.now();
  var pointers = new Map();

  el.style.touchAction = 'none';

  function updateCamera() {
    camera.position.set(
      target.x + radius * Math.sin(phi) * Math.sin(theta),
      target.y + radius * Math.cos(phi),
      target.z + radius * Math.sin(phi) * Math.cos(theta)
    );
    camera.lookAt(target);
  }

  function update(dt) {
    if (autoRotate && pointers.size === 0 && performance.now() - lastInteract > 4000) {
      theta_t += 0.04 * dt;
    }

    phi_t = Math.max(minPolar, Math.min(maxPolar, phi_t));
    radius_t = Math.max(minDist, Math.min(maxDist, radius_t));

    theta += (theta_t - theta) * damping;
    phi += (phi_t - phi) * damping;
    radius += (radius_t - radius) * damping;

    updateCamera();
  }

  function setAutoRotate(b) {
    autoRotate = b;
    update(0);
  }

  function onPointerDown(e) {
    el.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    lastInteract = performance.now();
  }

  function onPointerMove(e) {
    if (!pointers.has(e.pointerId)) return;

    var prevPointers = Array.from(pointers.entries());
    var prevDist = null;
    if (prevPointers.length === 2) {
      var p1 = prevPointers[0][1];
      var p2 = prevPointers[1][1];
      prevDist = Math.sqrt((p2.x - p1.x) * (p2.x - p1.x) + (p2.y - p1.y) * (p2.y - p1.y));
    }

    var px = e.clientX;
    var py = e.clientY;
    var oldP = pointers.get(e.pointerId);
    var dx = px - oldP.x;
    var dy = py - oldP.y;

    if (pointers.size === 1) {
      theta_t -= dx * 0.005;
      phi_t -= dy * 0.005;
    } else if (pointers.size === 2) {
      pointers.set(e.pointerId, { x: px, y: py });
      var curPointers = Array.from(pointers.entries());
      var p1 = curPointers[0][1];
      var p2 = curPointers[1][1];
      var curDist = Math.sqrt((p2.x - p1.x) * (p2.x - p1.x) + (p2.y - p1.y) * (p2.y - p1.y));
      if (prevDist !== null && curDist > 0) {
        radius_t *= prevDist / curDist;
      }
      return;
    }

    pointers.set(e.pointerId, { x: px, y: py });
    lastInteract = performance.now();
  }

  function onPointerUp(e) {
    pointers.delete(e.pointerId);
    lastInteract = performance.now();
  }

  function onWheel(e) {
    e.preventDefault();
    radius_t *= 1 + e.deltaY * 0.0012;
    lastInteract = performance.now();
  }

  el.addEventListener('pointerdown', onPointerDown);
  el.addEventListener('pointermove', onPointerMove);
  el.addEventListener('pointerup', onPointerUp);
  el.addEventListener('pointercancel', onPointerUp);
  el.addEventListener('wheel', onWheel, { passive: false });

  update(0);

  return {
    update: update,
    setAutoRotate: setAutoRotate,
    target: target
  };
};

</script>
<script data-module="12-main.js">
// Acropolis scene launcher and main render loop
window.startAcropolis = function () {
  var CFG = window.CFG || { MOBILE: false };
  var W = window.innerWidth, Hh = window.innerHeight;

  var renderer = new THREE.WebGLRenderer({ antialias: !CFG.MOBILE, powerPreference: 'high-performance' });
  renderer.setSize(W, Hh);
  document.getElementById('app').appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(48, W / Hh, 0.5, 4000);
  camera.position.set(170, 95, 205);

  var mats = window.buildMats(THREE);
  var H = window.makeHelpers(THREE, mats);

  [window.buildTerrain, window.buildParthenon, window.buildErechtheion, window.buildPropylaea, window.buildWalls, window.buildSouthSlope, window.buildScenery].forEach(function (f) {
    try {
      if (typeof f === 'function') scene.add(f(THREE, mats, H));
    } catch (e) {
      console.error('builder failed', f && f.name, e);
    }
  });

  var env = window.buildEnv(THREE, scene, renderer);
  var ctrl = window.makeOrbit(THREE, camera, renderer.domElement, { target: new THREE.Vector3(-30, 8, 0) });

  function onResize() {
    var w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }

  var resizeTimer;
  function debounceResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(onResize, 150);
  }

  window.addEventListener('resize', debounceResize);
  window.addEventListener('orientationchange', debounceResize);

  var autorotBtn = document.getElementById('autorot');
  if (autorotBtn) {
    autorotBtn.addEventListener('click', function () {
      var on = autorotBtn.getAttribute('aria-pressed') !== 'true';
      ctrl.setAutoRotate(on);
      autorotBtn.setAttribute('aria-pressed', on);
      autorotBtn.classList.toggle('off', !on);
    });
  }

  var clock = new THREE.Clock();
  var frames = 0;

  function frame() {
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, clock.getDelta());
    ctrl.update(dt);
    env.update(dt);
    renderer.render(scene, camera);
    frames++;
  }
  frame();

  setTimeout(function () {
    var hint = document.getElementById('hint');
    if (hint) hint.style.opacity = '0';
  }, 6000);

  if (location.search.indexOf('debug') >= 0) {
    var dbg = document.getElementById('debug');
    if (dbg) {
      dbg.hidden = false;
      setInterval(function () {
        dbg.textContent = 'tris ' + renderer.info.render.triangles + ' · calls ' + renderer.info.render.calls + ' · geo ' + renderer.info.memory.geometries + ' · fps ' + Math.round(frames * 2);
        frames = 0;
      }, 500);
    }
  }
};

</script>
