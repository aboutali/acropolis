<script data-module="07-walls.js">
// Module 07 — Plateau perimeter walls: battered ashlar/rubble courses, parapet, Beulé gate + bastion
window.buildWalls = function (THREE, mats, H) {
  var group = new THREE.Group();
  group.position.set(0, -1, 0);
  var MOBILE = !!(window.CFG && window.CFG.MOBILE);
  var PI = Math.PI;

  // Generate perimeter ellipse points with jitter
  var perimeter = [];
  for (var i = 0; i < 28; i++) {
    var a = (i / 28) * Math.PI * 2;
    var jit = 1 + 0.04 * H.noise2(Math.cos(a) * 5, Math.sin(a) * 5, 11);
    var x = -45 + 148 * Math.cos(a) * jit;
    var z = 73 * Math.sin(a) * jit;
    perimeter.push([x, z]);
  }

  // Filter out gate gap (x < -150 and |z| < 20)
  var filtered = [];
  for (var i = 0; i < perimeter.length; i++) {
    var pt = perimeter[i];
    if (!(pt[0] < -150 && Math.abs(pt[1]) < 20)) {
      filtered.push(pt);
    }
  }

  // Check wraparound distance between last and first point
  if (filtered.length > 1) {
    var lastPt = filtered[filtered.length - 1];
    var firstPt = filtered[0];
    var wrapDist = Math.sqrt((firstPt[0] - lastPt[0]) ** 2 + (firstPt[1] - lastPt[1]) ** 2);
    if (wrapDist < 50) {
      var gapIdx = -1;
      for (var i = 0; i < filtered.length - 1; i++) {
        var curr = filtered[i];
        var next = filtered[i + 1];
        var dist = Math.sqrt((next[0] - curr[0]) ** 2 + (next[1] - curr[1]) ** 2);
        if (dist > 50) { gapIdx = i; break; }
      }
      if (gapIdx >= 0) {
        var reordered = [];
        for (var i = gapIdx + 1; i < filtered.length; i++) reordered.push(filtered[i]);
        for (var i = 0; i <= gapIdx; i++) reordered.push(filtered[i]);
        filtered = reordered;
      }
    }
  }

  // Split into contiguous runs (separated by the gap)
  var runs = [];
  var currentRun = [];
  for (var i = 0; i < filtered.length; i++) {
    currentRun.push(filtered[i]);
    var nextIdx = (i + 1) % filtered.length;
    if (i < filtered.length - 1) {
      var curr = filtered[i];
      var next = filtered[nextIdx];
      var dist = Math.sqrt((next[0] - curr[0]) ** 2 + (next[1] - curr[1]) ** 2);
      if (dist > 50) { runs.push(currentRun); currentRun = []; }
    }
  }
  if (currentRun.length > 0) runs.push(currentRun);

  // Split each run at z = 40 (Cimonian south wall vs Pelasgian rest) and remember heights.
  var allSubRuns = [];
  for (var r = 0; r < runs.length; r++) {
    var run = runs[r];
    var subRuns = [];
    var currentSub = [];
    for (var i = 0; i < run.length; i++) {
      if (currentSub.length > 0) {
        var lastPt2 = currentSub[currentSub.length - 1];
        var currPt = run[i];
        if ((lastPt2[1] > 40) !== (currPt[1] > 40)) {
          var t = (40 - lastPt2[1]) / (currPt[1] - lastPt2[1]);
          var crossX = lastPt2[0] + t * (currPt[0] - lastPt2[0]);
          currentSub.push([crossX, 40]);
          subRuns.push(currentSub);
          currentSub = [[crossX, 40]];
        }
      }
      currentSub.push(run[i]);
    }
    if (currentSub.length > 0) subRuns.push(currentSub);
    for (var s = 0; s < subRuns.length; s++) {
      var sub = subRuns[s];
      var avgZ = 0;
      for (var i = 0; i < sub.length; i++) avgZ += sub[i][1];
      avgZ /= sub.length;
      var h = avgZ > 40 ? 9 : 7;
      allSubRuns.push({ points: sub, h: h });
    }
  }

  // ---- Battered ashlar/rubble masonry: courses of instanced blocks, wall battered inward with height ----
  // Small seeded LCG (deterministic, no engine RNG): drives per-block length/height/offset jitter.
  function wallRand(seed) {
    var s2 = seed >>> 0;
    return function () { s2 = (s2 * 1664525 + 1013904223) >>> 0; return s2 / 4294967296; };
  }
  var courseGeo = new THREE.BoxGeometry(1, 1, 1);
  var wallT = [], capT = [], parapetT = [];
  var courseH = 1.1;
  for (var sr = 0; sr < allSubRuns.length; sr++) {
    var run = allSubRuns[sr].points, wallH = allSubRuns[sr].h;
    var courses = Math.round(wallH / courseH);
    var baseThick = 3.4;
    // total polyline length -> place blocks of varied length per course, with a randomized start
    // offset each course so the head joints stagger irregularly (no repeating running-bond pattern).
    for (var c = 0; c < courses; c++) {
      var frac = c / courses;
      var batter = baseThick * (1 - 0.26 * frac); // wall thins (battered face) as it rises
      var cy = c * courseH + courseH / 2;
      var rng = wallRand(3000 + sr * 977 + c * 131);
      var dist = -(rng() * 2.3);
      for (var seg = 0; seg < run.length - 1; seg++) {
        var p0 = run[seg], p1 = run[seg + 1];
        var dx = p1[0] - p0[0], dz = p1[1] - p0[1];
        var segLen = Math.sqrt(dx * dx + dz * dz);
        var ang = Math.atan2(dz, dx);
        var d0 = dist;
        while (d0 < segLen) {
          // Each block's own length, drawn fresh so courses read as irregular coursed rubble
          // (varied 0.8-2.5m blocks) instead of one long uniform "plank".
          var blockLen = 0.8 + rng() * 1.7;
          if (d0 >= 0) {
            var t = d0 / segLen;
            var bx = p0[0] + t * dx, bz = p0[1] + t * dz;
            var thisLen = Math.min(blockLen, segLen - d0);
            var hJit = 0.78 + rng() * 0.36; // per-block height variation
            var faceJit = (rng() - 0.5) * 0.12 * batter; // tiny in/out jitter: no two faces perfectly flush
            var cyJit = cy + (rng() - 0.5) * courseH * 0.1;
            wallT.push({
              p: [bx + Math.cos(ang) * thisLen / 2 - Math.sin(ang) * faceJit, cyJit, bz + Math.sin(ang) * thisLen / 2 + Math.cos(ang) * faceJit],
              r: [0, -ang, 0], s: [thisLen * 0.92, courseH * hJit, batter]
            });
          }
          d0 += blockLen;
        }
        dist = d0 - segLen;
      }
    }
    // Coping cap block along the top
    for (var seg2 = 0; seg2 < run.length - 1; seg2++) {
      var p0b = run[seg2], p1b = run[seg2 + 1];
      var dx2 = p1b[0] - p0b[0], dz2 = p1b[1] - p0b[1];
      var segLen2 = Math.sqrt(dx2 * dx2 + dz2 * dz2);
      var ang2 = Math.atan2(dz2, dx2);
      var count2 = Math.max(1, Math.round(segLen2 / 2.1));
      for (var k = 0; k < count2; k++) {
        var t2 = (k + 0.5) / count2;
        var bx2 = p0b[0] + t2 * dx2, bz2 = p0b[1] + t2 * dz2;
        capT.push({ p: [bx2, wallH + 0.15, bz2], r: [0, -ang2, 0], s: [1.3, 0.3, 3.7] });
      }
    }
    // Parapet merlons on the south (taller) stretch only
    if (wallH === 9 && !MOBILE) {
      for (var seg3 = 0; seg3 < run.length - 1; seg3++) {
        var p0c = run[seg3], p1c = run[seg3 + 1];
        var dx3 = p1c[0] - p0c[0], dz3 = p1c[1] - p0c[1];
        var segLen3 = Math.sqrt(dx3 * dx3 + dz3 * dz3);
        var ang3 = Math.atan2(dz3, dx3);
        var count3 = Math.max(1, Math.round(segLen3 / 2.2));
        for (var k2 = 0; k2 < count3; k2 += 2) {
          var t3 = (k2 + 0.5) / count3;
          var bx3 = p0c[0] + t3 * dx3, bz3 = p0c[1] + t3 * dz3;
          parapetT.push({ p: [bx3, wallH + 0.9, bz3], r: [0, -ang3, 0], s: [1.1, 1.2, 1.6] });
        }
      }
    }
  }
  group.add(H.instance(courseGeo, mats.rockDark, wallT));
  group.add(H.instance(courseGeo, mats.marbleWorn, capT));
  if (parapetT.length) group.add(H.instance(courseGeo, mats.rockDark, parapetT));

  // Two flanking bastion towers at the gap, with battered coursing
  var towerCourseT = [];
  var towerPositions = [[-158, -22], [-158, 22]];
  for (var tw = 0; tw < 2; tw++) {
    var tx = towerPositions[tw][0], tz = towerPositions[tw][1];
    var towerCourses = 15;
    for (var tc = 0; tc < towerCourses; tc++) {
      var tfrac = tc / towerCourses;
      var tsize = 8.4 * (1 - 0.18 * tfrac);
      towerCourseT.push({ p: [tx, tc * 0.73 + 0.36, tz], s: [tsize, 0.7, tsize] });
    }
  }
  group.add(H.instance(courseGeo, mats.rockDark, towerCourseT));

  // Beulé gate bastion: stepped ashlar podium + two marble towers + lintel
  var bastionT = [];
  var bastionCourses = 6;
  for (var bc = 0; bc < bastionCourses; bc++) {
    var bfrac = bc / bastionCourses;
    bastionT.push({ p: [-165, bc * 0.8 + 0.4, 8], s: [18 * (1 - 0.1 * bfrac), 0.75, 22 * (1 - 0.1 * bfrac)] });
  }
  group.add(H.instance(courseGeo, mats.rockDark, bastionT));

  var gateTowerGeo = new THREE.BoxGeometry(5, 9, 5);
  var gateTower1 = new THREE.Mesh(gateTowerGeo, mats.marbleWorn);
  gateTower1.position.set(-165, 4.5 + 4.8, 3);
  gateTower1.castShadow = true; gateTower1.receiveShadow = true;
  group.add(gateTower1);
  var gateTower2 = new THREE.Mesh(gateTowerGeo, mats.marbleWorn);
  gateTower2.position.set(-165, 4.5 + 4.8, 13);
  gateTower2.castShadow = true; gateTower2.receiveShadow = true;
  group.add(gateTower2);

  var lintelGeo = new THREE.BoxGeometry(1.5, 1.5, 12);
  var lintel = new THREE.Mesh(lintelGeo, mats.marbleWorn);
  lintel.position.set(-165, 8.5 + 4.8, 8);
  lintel.castShadow = true; lintel.receiveShadow = true;
  group.add(lintel);

  // Voussoir arch over the gate passage (real arched opening, not a flat lintel alone)
  var archGeo = new THREE.TorusGeometry(6.2, 0.55, 6, MOBILE ? 10 : 16, PI);
  var gateArch = new THREE.Mesh(archGeo, mats.marbleWorn);
  gateArch.rotation.z = PI;
  gateArch.rotation.y = PI / 2;
  gateArch.position.set(-165, 9.2 + 4.8, 8);
  gateArch.castShadow = true; gateArch.receiveShadow = true;
  group.add(gateArch);

  return group;
};

</script>
<script data-module="08-southslope.js">
// Module 08: South Slope — Theatre of Dionysus (aisles, thrones, paved orchestra, skene colonnade)
// and Odeon of Herodes Atticus (arched stage facade built from real piers + arches).
window.buildSouthSlope = function (THREE, mats, H) {
  var group = new THREE.Group();
  var MOBILE = !!(window.CFG && window.CFG.MOBILE);
  var PI = Math.PI, sin = Math.sin, cos = Math.cos;
  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }

  // Rock-face vertical weathering: a sine-wave streak whose phase is perturbed by low-frequency
  // noise (irregular spacing, not a perfectly even ripple), ramped so staining concentrates near
  // the base of an exposed face and fades upward -- used to paint the apron below.
  function apronWeatherTint(x, y, z) {
    var base = 0.86 + 0.10 * H.noise2(x * 0.02, z * 0.02, 951) + 0.05 * H.noise2(x * 0.07, z * 0.07, 952);
    var phase = x * 0.28 + H.noise2(x * 0.015, z * 0.015, 953) * 5;
    var band = Math.pow(Math.max(0, cos(phase)), 6);
    var ramp = clamp01((-y - 35) / 75); // darker toward the plain, fading upward toward the plateau
    var irregular = 0.4 + 0.6 * (0.5 + 0.5 * H.noise2(x * 0.05, y * 0.09, 954));
    var streak = band * ramp * irregular;
    var mult = base * (1 - 0.42 * streak);
    return [clamp01(mult), clamp01(mult * (1 - 0.05 * streak)), clamp01(mult * (1 - 0.14 * streak))];
  }

  // Stepped auditorium as one mesh: per row a riser facing the orchestra and a tread facing up.
  var seatMat = mats.marbleShadowed.clone();
  seatMat.side = THREE.DoubleSide;
  seatMat.vertexColors = true;
  // Duller, dirtier base tone used only under the lower, foot-trafficked/rain-channelled rows.
  var wornSeatMat = mats.marbleShadowed.clone();
  wornSeatMat.side = THREE.DoubleSide;
  wornSeatMat.vertexColors = true;
  wornSeatMat.color = new THREE.Color(0xab9a72);

  // Gravity-biased weathering: seating darkens toward the lower rows, with rust-orange staining
  // patches and high-frequency worn/dirt spots layered on top.
  function caveaVertexColor(x, y, z, rowFrac) {
    var wear = H.noise2(x * 0.15, z * 0.15, 831);
    var spotN = H.noise2(x * 0.6, z * 0.6, 833);
    var rustN = H.noise2(x * 0.09, z * 0.11, 835);
    var grav = 0.6 + 0.4 * rowFrac; // rowFrac: 0 at the front/lowest row, 1 at the top
    var spotWear = spotN > 0.55 ? (spotN - 0.55) * 0.95 : 0;
    var base = grav * (1 - spotWear) * (0.92 + 0.08 * wear);
    var rustAmt = rustN > 0.28 ? (rustN - 0.28) * 0.7 * (1 - rowFrac * 0.5) : 0;
    return [
      clamp01(base * (1 + rustAmt * 0.35)),
      clamp01(base * (1 - rustAmt * 0.12)),
      clamp01(base * (1 - rustAmt * 0.42))
    ];
  }

  // wornFrac: fraction of rows (counted from the front/lowest row) built with the duller,
  // grime-caked worn material instead of the regular seating marble.
  function makeCavea(r0, dr, dy, rows, halfA, segs, wornFrac) {
    wornFrac = wornFrac || 0;
    var wornRows = Math.round(rows * wornFrac);
    function pt(r, y, phi) { return [r * sin(phi), y, -r * cos(phi)]; }
    function buildRange(rowStart, rowEnd, mat) {
      var pos = [], col = [];
      function pushPt(p, rowFrac) {
        pos.push(p[0], p[1], p[2]);
        var c = caveaVertexColor(p[0], p[1], p[2], rowFrac);
        col.push(c[0], c[1], c[2]);
      }
      function quad(a, b, c, d, rowFrac) {
        pushPt(a, rowFrac); pushPt(b, rowFrac); pushPt(c, rowFrac);
        pushPt(a, rowFrac); pushPt(c, rowFrac); pushPt(d, rowFrac);
      }
      for (var i = rowStart; i < rowEnd; i++) {
        var r = r0 + i * dr, y0 = i * dy, y1 = (i + 1) * dy;
        var rowFrac = rows > 1 ? i / (rows - 1) : 0;
        for (var k = 0; k < segs; k++) {
          var p0 = -halfA + (2 * halfA * k) / segs, p1 = -halfA + (2 * halfA * (k + 1)) / segs;
          quad(pt(r, y0, p0), pt(r, y1, p0), pt(r, y1, p1), pt(r, y0, p1), rowFrac);
          quad(pt(r, y1, p0), pt(r + dr, y1, p0), pt(r + dr, y1, p1), pt(r, y1, p1), rowFrac);
        }
      }
      var geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
      geo.computeVertexNormals();
      var mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }
    var g = new THREE.Group();
    if (wornRows > 0) g.add(buildRange(0, wornRows, wornSeatMat));
    g.add(buildRange(wornRows, rows, seatMat));
    return g;
  }
  // Rock apron
  // Lower amplitude than the helper's default reads as a real hillside apron rather than dunes;
  // nudged up from 4.5 (art-pass note: the carved bowls read as too flat/artificial around the
  // theatres) while staying well short of dune territory -- the bowl carving below clips it back
  // down around the seating anyway, so this only adds relief to the untouched slope in between.
  var apron = H.makeRockOutcrop(260, 120, 6, 3);
  apron.position.set(-60, -45, 85);
  apron.rotation.x = 0.31;
  group.add(apron);

  // ============================= Theatre of Dionysus =============================
  var theatreGroup = new THREE.Group();
  theatreGroup.position.set(-6, -55, 124);
  var dRows = 24, dR0 = 22, dDr = 1.05, dDy = 0.6, dHalfA = 1.75;
  theatreGroup.add(makeCavea(dR0, dDr, dDy, dRows, dHalfA, MOBILE ? 22 : 40, 0.35));

  // Klimakes: 8 radial aisle strips dividing the cavea into 7 wedges
  var dWedges = MOBILE ? 4 : 7;
  var aisleGeo = new THREE.BoxGeometry(0.9, 0.12, 1);
  var aisleT = [];
  for (var w = 0; w <= dWedges; w++) {
    var phi = -dHalfA + (2 * dHalfA * w) / dWedges;
    for (var i = 0; i < dRows; i++) {
      var r = dR0 + i * dDr + dDr * 0.5;
      var y = i * dDy + dDy * 0.5 + 0.06;
      aisleT.push({ p: [r * sin(phi), y, -r * cos(phi)], r: [0, -phi, 0], s: [1, 1, dDr * 1.02] });
    }
  }
  theatreGroup.add(H.instance(aisleGeo, mats.marbleWorn, aisleT));

  // Front-row thrones (proedria): seat + backrest facing the orchestra, one per wedge column
  var throneSeatGeo = new THREE.BoxGeometry(1.5, 0.55, 1.3);
  var throneBackGeo = new THREE.BoxGeometry(1.5, 1.1, 0.18);
  var seatT = [], backT = [];
  var throneCols = MOBILE ? 10 : 18;
  for (var tc = 0; tc < throneCols; tc++) {
    var tphi = -dHalfA + (2 * dHalfA * (tc + 0.5)) / throneCols;
    var tr = dR0 - 0.6;
    var tx = tr * sin(tphi), tz = -tr * cos(tphi);
    seatT.push({ p: [tx, 0.28, tz], r: [0, -tphi, 0] });
    var bx = tx - sin(tphi) * 0.66, bz = tz + cos(tphi) * 0.66;
    backT.push({ p: [bx, 1.1, bz], r: [0, -tphi, 0] });
  }
  theatreGroup.add(H.instance(throneSeatGeo, mats.marble, seatT));
  theatreGroup.add(H.instance(throneBackGeo, mats.marble, backT));

  // Paved orchestra: pale plaster paving (visually distinct from the surrounding worn-marble
  // seating) with raised concentric ring steps -- not just painted-on lines -- and a compact
  // white-marble thymele block at the centre.
  var orchGeom = new THREE.CylinderGeometry(19, 19, 0.3, MOBILE ? 24 : 40);
  var orchMesh = new THREE.Mesh(orchGeom, mats.plaster);
  orchMesh.castShadow = true; orchMesh.receiveShadow = true;
  orchMesh.position.y = -0.15;
  theatreGroup.add(orchMesh);
  // Concentric paving rings as real raised steps (thin annular cylinders), each a touch higher
  // than the last, reading as distinct pavement courses rather than a flat unmarked disc.
  var ringCount = 4, ringT = [];
  var ringGeo = new THREE.CylinderGeometry(1, 1, 0.14, MOBILE ? 20 : 36, 1, true);
  for (var ring = 1; ring <= ringCount; ring++) {
    var rr = ring * 4.2;
    ringT.push({ p: [0, 0.07 + ring * 0.07, 0], s: [rr, 1, rr] });
  }
  var ringMesh = H.instance(ringGeo, mats.marbleWorn, ringT);
  ringMesh.castShadow = false;
  theatreGroup.add(ringMesh);
  var thymele = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.85, 0.8, 12), mats.marble);
  thymele.position.y = 0.4;
  thymele.castShadow = true; thymele.receiveShadow = true;
  theatreGroup.add(thymele);

  // Skene (stage building) with a colonnaded proscaenium facing the orchestra
  var skeneBack = new THREE.Mesh(new THREE.BoxGeometry(30, 6, 2), mats.marbleWorn);
  skeneBack.position.set(0, 3, 21.3);
  skeneBack.castShadow = true; skeneBack.receiveShadow = true;
  theatreGroup.add(skeneBack);
  var proColumns = [];
  var proN = MOBILE ? 4 : 6;
  for (var pc = 0; pc < proN; pc++) proColumns.push([-13.5 + pc * (27 / (proN - 1)), 19.6]);
  theatreGroup.add(H.makeDoricColumns(proColumns, { height: 3.4, baseD: 0.62, topD: 0.5, y: 0 }));
  // Plain architrave/frieze/cornice only (no triglyph+guttae detail): a small stage-front
  // colonnade doesn't need full Doric ornament, and it keeps the theatre's triangle budget low.
  var proEnt = H.makeEntablature(28, 2, 0.9, { triglyphs: false, cornice: true });
  proEnt.position.set(0, 3.4 * 0.92, 20.1);
  theatreGroup.add(proEnt);

  group.add(theatreGroup);

  // ============================= Odeon of Herodes Atticus =============================
  var odeonGroup = new THREE.Group();
  odeonGroup.position.set(-140, -52, 101);
  var oRows = 18, oR0 = 14, oDr = 1.33, oDy = 0.8, oHalfA = PI / 2;
  odeonGroup.add(makeCavea(oR0, oDr, oDy, oRows, oHalfA, MOBILE ? 18 : 32));

  var oWedges = MOBILE ? 3 : 5;
  var oAisleT = [];
  for (var ow = 0; ow <= oWedges; ow++) {
    var ophi = -oHalfA + (2 * oHalfA * ow) / oWedges;
    for (var oi = 0; oi < oRows; oi++) {
      var or_ = oR0 + oi * oDr + oDr * 0.5;
      var oy = oi * oDy + oDy * 0.5 + 0.07;
      oAisleT.push({ p: [or_ * sin(ophi), oy, -or_ * cos(ophi)], r: [0, -ophi, 0], s: [1, 1, oDr * 1.02] });
    }
  }
  odeonGroup.add(H.instance(aisleGeo, mats.marbleWorn, oAisleT));

  // Half-disc orchestra, paved
  var odorchGeom = new THREE.CylinderGeometry(12, 12, 0.3, MOBILE ? 20 : 32, 1, false, -1.571, 3.142);
  var odorchMesh = new THREE.Mesh(odorchGeom, mats.marble);
  odorchMesh.castShadow = true; odorchMesh.receiveShadow = true;
  odorchMesh.rotation.y = PI;
  odorchMesh.position.y = -0.15;
  odeonGroup.add(odorchMesh);

  // Stage facade: real piers + arched openings across 3 tiers, not a slab with applied rings.
  // A thin recessed back wall gives the openings depth; piers and arch bands carry the load visually.
  var facadeHalfW = 38, bayCount = MOBILE ? 6 : 8;
  var bayW = (facadeHalfW * 2) / bayCount;
  var tierY = [0, 6.4, 12.8], tierH = 6.0, sillH = 0;
  // Recessed well behind the pier/arch front face (23.4) so each bay reads as a real shadowed
  // opening with depth, not a flat wall with lines painted on it.
  var backWall = new THREE.Mesh(new THREE.BoxGeometry(facadeHalfW * 2 + 2, 19.5, 1.2), mats.rockDark);
  backWall.position.set(0, 9.75, 19.0);
  backWall.castShadow = true; backWall.receiveShadow = true;
  odeonGroup.add(backWall);

  var pierGeo = new THREE.BoxGeometry(1.1, tierH * 3 + 2, 2.4);
  var pierT = [];
  for (var bp = 0; bp <= bayCount; bp++) {
    var bx2 = -facadeHalfW + bp * bayW;
    pierT.push({ p: [bx2, (tierH * 3 + 2) / 2, 22.2] });
  }
  odeonGroup.add(H.instance(pierGeo, mats.marbleWorn, pierT));

  // Tier entablature bands (visually separate the 3 storeys of arcading)
  var bandGeo = new THREE.BoxGeometry(facadeHalfW * 2 + 1.6, 0.7, 2.4);
  var bandT = [];
  for (var bt = 0; bt < 3; bt++) bandT.push({ p: [0, tierY[bt] + tierH + 0.35, 22.2] });
  odeonGroup.add(H.instance(bandGeo, mats.marbleWorn, bandT));

  // Arched openings per bay per tier: a chunky semicircular voussoir band standing proud on the
  // piers' own front face (not recessed inside them), sitting on a projecting springer lintel,
  // with an open reveal beneath it down to the recessed dark back wall -- a real shadowed opening.
  var archGeo = new THREE.TorusGeometry(bayW * 0.39, 0.5, 6, MOBILE ? 10 : 16, PI);
  var archT = [];
  var springerGeo = new THREE.BoxGeometry(bayW - 1.1, 0.35, 2.6);
  var springerT = [];
  var archZ = 23.35; // flush with the piers' front face (22.2 +/- 1.2 half-depth)
  for (var tier = 0; tier < 3; tier++) {
    for (var bay = 0; bay < bayCount; bay++) {
      var cx = -facadeHalfW + bayW * (bay + 0.5);
      var springY = tierY[tier] + tierH * 0.62;
      springerT.push({ p: [cx, springY, archZ] });
      archT.push({ p: [cx, springY, archZ] }); // default torus orientation: upper semicircle in the XY plane, facing +z
    }
  }
  odeonGroup.add(H.instance(archGeo, mats.marbleWorn, archT));
  odeonGroup.add(H.instance(springerGeo, mats.marbleWorn, springerT));

  // Recessed niche floor + back panel visible through each opening: with the back wall now ~4.4m
  // behind the arch face, this dark, shadowed rectangle is what reads as "depth" from a distance.
  var nicheFloorGeo = new THREE.BoxGeometry(bayW - 1.3, 0.15, 1.6);
  var nicheBackGeo = new THREE.BoxGeometry(bayW - 1.2, tierH * 0.72, 0.2);
  var nicheFloorT = [], nicheBackT = [];
  for (var tier2 = 0; tier2 < 3; tier2++) {
    for (var bay2 = 0; bay2 < bayCount; bay2++) {
      var cx2 = -facadeHalfW + bayW * (bay2 + 0.5);
      nicheFloorT.push({ p: [cx2, tierY[tier2] + 0.1, 20.0] });
      nicheBackT.push({ p: [cx2, tierY[tier2] + tierH * 0.36 + 0.1, 19.65] });
    }
  }
  odeonGroup.add(H.instance(nicheFloorGeo, mats.marbleShadowed, nicheFloorT));
  odeonGroup.add(H.instance(nicheBackGeo, mats.rockDark, nicheBackT));

  // Cornice capping the whole facade
  var facadeCornice = new THREE.Mesh(new THREE.BoxGeometry(facadeHalfW * 2 + 3, 0.8, 3), mats.marble);
  facadeCornice.position.set(0, tierH * 3 + 2.4, 21.8);
  facadeCornice.castShadow = true; facadeCornice.receiveShadow = true;
  odeonGroup.add(facadeCornice);

  group.add(odeonGroup);

  // Carve the rock apron so both auditoria and their stages sit on the slope.
  var bowls = [
    { x: -6, y: -55, z: 124, r0: 22, dr: 1.05, dy: 0.6, rows: 24, sw: 19, sd: 23 },
    { x: -140, y: -52, z: 101, r0: 14, dr: 1.33, dy: 0.8, rows: 18, sw: 40, sd: 25 }
  ];
  function floorAt(wx, wz) {
    var f = Infinity;
    for (var b = 0; b < bowls.length; b++) {
      var o = bowls[b];
      var dx = wx - o.x, dz = wz - o.z;
      var d = Math.sqrt(dx * dx + dz * dz);
      var rMax = o.r0 + o.rows * o.dr;
      var top = o.y + o.rows * o.dy;
      if (dz <= 0.2 * d && d < rMax + 12) {
        var g = d < o.r0 ? o.y : d < rMax ? o.y + ((d - o.r0) / o.dr) * o.dy : top + (d - rMax) * 0.9;
        f = Math.min(f, g - 1.0);
      } else if (dz > 0 && Math.abs(dx) < o.sw && dz < o.sd) {
        f = Math.min(f, o.y - 1.0);
      }
    }
    return f;
  }
  // Outer-edge blend: the apron is a flat 260x120 rock-outcrop patch (see H.makeRockOutcrop call
  // above), so without this its south/city-facing and lateral edges just stop -- a thick, dead-flat
  // slab boundary hanging above the plain. Pull those true mesh edges down to the plain (y=-80) over
  // the last stretch of each axis so the hillside visibly runs out to meet the city ground instead of
  // ending in a hard line. The hill-facing edge (negative local z, tucked under the plateau's own
  // cliff mesh) is left alone.
  var apronHalfX = 130, apronHalfZ = 60; // half-extents of the 260 x 120 outcrop plane
  function apronEdgeFactor(xl, zl) {
    var zf = zl > 0 ? clamp01((zl / apronHalfZ - 0.8) / 0.2) : 0;
    var xf = clamp01((Math.abs(xl) / apronHalfX - 0.86) / 0.14);
    var t = Math.max(zf, xf);
    return t * t * (3 - 2 * t);
  }
  apron.updateMatrix();
  var toWorld = apron.matrix.clone();
  var toLocal = new THREE.Matrix4().copy(toWorld).invert();
  var apPos = apron.geometry.getAttribute('position');
  var v = new THREE.Vector3();
  for (var k = 0; k < apPos.count; k++) {
    var xl0 = apPos.getX(k), zl0 = apPos.getZ(k);
    v.fromBufferAttribute(apPos, k).applyMatrix4(toWorld);
    var fl = floorAt(v.x, v.z);
    if (v.y > fl) v.y = fl;
    var et = apronEdgeFactor(xl0, zl0);
    if (et > 0) v.y = v.y * (1 - et) + (-80) * et;
    v.applyMatrix4(toLocal);
    apPos.setXYZ(k, v.x, v.y, v.z);
  }
  apPos.needsUpdate = true;
  apron.geometry.computeVertexNormals();

  // Vertical water-stain weathering on the apron's exposed rock, concentrated near the base and
  // fading toward the plateau rim. Cloned so the shared mats.rock instance from
  // H.makeRockOutcrop (also used unmodified elsewhere) is never mutated.
  var apronMat = mats.rock.clone();
  apronMat.vertexColors = true;
  // mats.rock's baked strata read as a tight regular ripple when box-projected onto a mostly
  // horizontal/gently-sloped surface at its native 14m tile; a much larger tile on this clone
  // only spreads the same texture into broad, soft bands instead (see 03-terrain.js's plateau
  // for the same fix). Fresh userData object so the shared mats.rock instance isn't mutated.
  apronMat.userData = {};
  for (var auk in mats.rock.userData) apronMat.userData[auk] = mats.rock.userData[auk];
  apronMat.userData.uvScale = 18;
  apron.material = apronMat;
  var apCol = new Float32Array(apPos.count * 3);
  var wv = new THREE.Vector3();
  for (var k2 = 0; k2 < apPos.count; k2++) {
    wv.fromBufferAttribute(apPos, k2).applyMatrix4(toWorld);
    var c2 = apronWeatherTint(wv.x, wv.y, wv.z);
    apCol[k2 * 3] = c2[0]; apCol[k2 * 3 + 1] = c2[1]; apCol[k2 * 3 + 2] = c2[2];
  }
  apron.geometry.setAttribute('color', new THREE.Float32BufferAttribute(apCol, 3));

  // Cypresses: scattered around the auditoria, each dropped onto the apron by a downward ray
  var seed = 11;
  function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
  apron.updateMatrixWorld(true);
  var ray = new THREE.Raycaster();
  var down = new THREE.Vector3(0, -1, 0);
  var canopyT = [], trunkT = [];
  // Denser cypress cover on the hillside apron between the two theatres (raised again per the art
  // pass: the south-slope surroundings still read sparse/artificial next to the theatres) -- and
  // sized/placed with more spread so the crowns don't read as one uniform height across the slope.
  var cypressTarget = MOBILE ? 32 : 62;
  for (var tries = 0; tries < 1300 && canopyT.length < cypressTarget; tries++) {
    var cx3 = -175 + rnd() * 215, cz3 = 70 + rnd() * 70;
    if (floorAt(cx3, cz3) < Infinity) continue;
    ray.set(new THREE.Vector3(cx3, 50, cz3), down);
    var hit = ray.intersectObject(apron);
    if (!hit.length || hit[0].point.y < -75) continue;
    var gy = hit[0].point.y, sc = 0.65 + rnd() * 0.85; // wider height range: young saplings to tall old cypresses
    // Asymmetric xz scale (0.8-1.3x independently per axis) so each cone canopy reads as a
    // slightly irregular, wind-shaped crown instead of a perfect cone of revolution.
    var ccx = 0.8 + rnd() * 0.5, ccz = 0.8 + rnd() * 0.5;
    canopyT.push({ p: [cx3, gy + 1.2 + 4.5 * sc, cz3], s: [sc * ccx, sc, sc * ccz] });
    trunkT.push({ p: [cx3, gy + 0.75, cz3], s: [sc, sc, sc] });
  }
  group.add(H.instance(new THREE.ConeGeometry(1.3, 9, 8), mats.foliageCypress, canopyT));
  group.add(H.instance(new THREE.CylinderGeometry(0.2, 0.25, 1.5, 6), mats.trunk, trunkT));

  // A scatter of broadleaf olive trees mixed in among the cypresses so the hillside reads as a
  // real mixed Mediterranean slope, not a uniform conifer plantation -- same drop-onto-apron
  // technique, single-lobe canopy since these sit well back from camera in every south-slope view.
  var oliveCanopyT2 = [], oliveTrunkT2 = [];
  var oliveTarget2 = MOBILE ? 8 : 22;
  for (var otries = 0; otries < 500 && oliveCanopyT2.length < oliveTarget2; otries++) {
    var ocx = -175 + rnd() * 215, ocz = 70 + rnd() * 70;
    if (floorAt(ocx, ocz) < Infinity) continue;
    ray.set(new THREE.Vector3(ocx, 50, ocz), down);
    var ohit = ray.intersectObject(apron);
    if (!ohit.length || ohit[0].point.y < -75) continue;
    var ogy = ohit[0].point.y, osc = 0.7 + rnd() * 0.6;
    oliveTrunkT2.push({ p: [ocx, ogy + 0.9 * osc, ocz], s: [osc, osc, osc] });
    oliveCanopyT2.push({ p: [ocx, ogy + 1.6 * osc, ocz], r: [0, rnd() * PI * 2, 0], s: [osc * 1.3, osc, osc * 1.3] });
  }
  group.add(H.instance(new THREE.CylinderGeometry(0.14, 0.22, 1.6, 6), mats.trunk, oliveTrunkT2));
  group.add(H.instance(new THREE.IcosahedronGeometry(1.3, 0), mats.foliageOlive, oliveCanopyT2));

  return group;
};

<script data-module="09-scenery.js">
// Module 09 - Scenery: Athena Promachos (built by 13-figures.js), Great Altar, gnarled olive
// groves, and scattered marble fragments on the plateau.
window.buildScenery = function (THREE, mats, H) {
  var group = new THREE.Group();
  var MOBILE = !!(window.CFG && window.CFG.MOBILE);
  var PI = Math.PI;

  // Deterministic LCG (seed 42)
  var s = 42;
  function rnd() {
    s = (s * 1664525 + 1013904223) % 4294967296;
    return s / 4294967296;
  }

  // Athena Promachos at (-62, 0, -12), built by 13-figures.js — kept as-is, not rebuilt here.
  var promachos = H.makePromachos({});
  promachos.position.set(-62, 0, -12);
  group.add(promachos);

  // Great Altar at (-8, 0, -41), with a low relief frieze on the long faces
  var altar = new THREE.Group();
  altar.position.set(-8, 0, -41);

  var altarBase = new THREE.Mesh(new THREE.BoxGeometry(12, 2.2, 6), mats.marble);
  altarBase.position.y = 1.1;
  altarBase.castShadow = true;
  altarBase.receiveShadow = true;
  altar.add(altarBase);

  var altarTop = new THREE.Mesh(new THREE.BoxGeometry(10, 0.6, 4), mats.marble);
  altarTop.position.y = 2.5;
  altarTop.castShadow = true;
  altarTop.receiveShadow = true;
  altar.add(altarTop);

  var friezeN = MOBILE ? 2 : 3;
  var friezeFront = H.makeRelief(10.5, 1.8, { figures: friezeN, lowDetail: MOBILE, seed: 5 });
  friezeFront.position.set(0, 1.1, 3.02);
  altar.add(friezeFront);
  var friezeBack = H.makeRelief(10.5, 1.8, { figures: friezeN, lowDetail: MOBILE, seed: 9 });
  friezeBack.position.set(0, 1.1, -3.02);
  friezeBack.rotation.y = PI;
  altar.add(friezeBack);

  group.add(altar);

  // ---------------- Olive groves: gnarled, twisted trunks with clumpy grey-green canopies ----------------
  var oliveTrees = [];
  var oliveCount = 0;
  var maxAttempts = 2000;
  var attempts = 0;

  var oliveTarget = MOBILE ? 38 : 52;
  while (oliveCount < oliveTarget && attempts < maxAttempts) {
    attempts++;
    var angle = rnd() * Math.PI * 2;
    // Kept inside the flat esplanade (e < ~0.86): trees sit at a fixed trunk height, and past
    // that radius the plateau surface starts folding down to meet the cliff mesh below.
    var radiusFactor = 0.72 + rnd() * (0.85 - 0.72);
    var rx = 148, rz = 73;
    var x = -45 + Math.cos(angle) * rx * radiusFactor;
    var z = 0 + Math.sin(angle) * rz * radiusFactor;

    var excluded = false;
    var exclusions = [
      { x0: -18, z0: -38, x1: 18, z1: 38 },
      { x0: -56, z0: -46, x1: -28, z1: -22 },
      { x0: -135, z0: -30, x1: -100, z1: 25 },
      { x0: -140, z0: 12, x1: -126, z1: 28 },
      { x0: -66, z0: -16, x1: -58, z1: -8 },
      { x0: -16, z0: -46, x1: 0, z1: -36 }
    ];
    for (var i = 0; i < exclusions.length; i++) {
      var ex = exclusions[i];
      if (x >= ex.x0 && x <= ex.x1 && z >= ex.z0 && z <= ex.z1) { excluded = true; break; }
    }
    if (!excluded) { oliveTrees.push({ x: x, z: z, seed: (oliveCount * 977 + 31) >>> 0 }); oliveCount++; }
  }

  // Gnarled trunk: a short, thick, lathe-twisted stump instead of a plain tapered cylinder.
  var trunkSeg = MOBILE ? 7 : 10;
  var trunkGeo = new THREE.CylinderGeometry(0.16, 0.5, 2.3, trunkSeg, 4);
  var tp = trunkGeo.attributes.position, tarr = tp.array;
  for (var ti = 0; ti < tarr.length; ti += 3) {
    var tx = tarr[ti], ty = tarr[ti + 1], tz = tarr[ti + 2];
    var theta = Math.atan2(tz, tx), r = Math.sqrt(tx * tx + tz * tz);
    var yN = (ty + 1.15) / 2.3;
    var gnarl = 1 + 0.22 * Math.cos(theta * 5 + yN * 6) * (1 - yN * 0.4);
    var lean = 0.18 * Math.sin(yN * PI * 0.5);
    tarr[ti] = r * gnarl * Math.cos(theta) + lean;
    tarr[ti + 2] = r * gnarl * Math.sin(theta);
  }
  tp.needsUpdate = true;
  trunkGeo.computeVertexNormals();

  var trunkTopY = 2.05; // where the bare trunk ends and the crown of branches begins
  var oliveTrunkTransforms = [];
  for (var i = 0; i < oliveTrees.length; i++) {
    var ot = oliveTrees[i];
    var rot = ((ot.seed % 1000) / 1000) * PI * 2;
    oliveTrunkTransforms.push({ p: [ot.x, 1.15, ot.z], r: [0, rot, 0] });
  }
  group.add(H.instance(trunkGeo, mats.trunk, oliveTrunkTransforms));

  // A couple of low gnarled root-boles at the trunk base for extra character
  var rootGeo = new THREE.SphereGeometry(0.42, 6, 5);
  var rootT = [];
  for (var i = 0; i < oliveTrees.length; i++) {
    var ot2 = oliveTrees[i];
    rootT.push({ p: [ot2.x, 0.25, ot2.z], s: [1.1, 0.55, 1.1] });
  }
  group.add(H.instance(rootGeo, mats.trunk, rootT));

  // Visible branches: a few thin gnarled limbs fork from the bare trunk top up toward each main
  // canopy clump, so the crown reads as foliage carried on woodwork instead of a blob glued to a
  // post. Cheap open-ended 4-sided cylinder (8 tris) per branch, oriented exactly at its clump.
  // Orientation is worked out with plain trig (no Vector3/Quaternion) so a unit direction
  // (dx,dy,dz) maps to an XYZ Euler [asin(dz), 0, atan2(-dx,dy)] that carries the cylinder's local
  // +Y axis onto that direction.
  var branchGeo = new THREE.CylinderGeometry(0.05, 0.11, 1, 4, 1, true);
  var branchT = [];

  // Clumpy canopies: several smaller, more widely-spaced blobs per tree with visible gaps between
  // them (and the bare branch carrying each one visible beneath it), instead of a few large lobes
  // that merge into one smooth silhouette at a distance.
  var oliveCanopyTransforms = [];
  for (var i = 0; i < oliveTrees.length; i++) {
    var tree = oliveTrees[i];
    var lobes = 4 + (i % 2);
    for (var j = 0; j < lobes; j++) {
      var offsetAngle = (j / lobes) * Math.PI * 2 + rnd() * 0.6;
      // Lobe separation kept wide relative to each clump's own (smaller) size so the gaps between
      // clumps stay legible at medium distance instead of the crown reading as one fused blob.
      var offsetDist = 1.5 + rnd() * 1.5;
      var offsetX = tree.x + Math.cos(offsetAngle) * offsetDist;
      var offsetZ = tree.z + Math.sin(offsetAngle) * offsetDist;
      var offsetY = 3.15 + (rnd() - 0.5) * 2 * 0.85;
      var scale = 0.36 + rnd() * 0.3; // smaller clumps than before (was 0.5-0.9)
      // Independent per-axis scale (0.8-1.3x each) so every lobe is a lopsided, irregular clump
      // rather than a scaled-uniform icosahedron -- breaks the "perfect blob" geometric look.
      var lcx = 0.8 + rnd() * 0.5, lcz = 0.8 + rnd() * 0.5;
      oliveCanopyTransforms.push({
        p: [offsetX, offsetY, offsetZ],
        r: [rnd() * PI, rnd() * PI, rnd() * PI],
        s: [scale * lcx, scale * (0.75 + rnd() * 0.3), scale * lcz]
      });
      // A branch reaching from the trunk top to just under this clump (skip the odd tallest lobe
      // so a bit of canopy still floats free of visible woodwork, as real crowns do).
      if (j < 3) {
        var bdx = offsetX - tree.x, bdy = (offsetY - 0.3 * scale) - trunkTopY, bdz = offsetZ - tree.z;
        var blen = Math.sqrt(bdx * bdx + bdy * bdy + bdz * bdz) || 0.001;
        var bnx = bdx / blen, bny = bdy / blen, bnz = bdz / blen;
        var bPitch = Math.asin(Math.max(-1, Math.min(1, bnz)));
        var bYaw = Math.atan2(-bnx, bny);
        branchT.push({
          p: [tree.x + bnx * blen * 0.5, trunkTopY + bny * blen * 0.5, tree.z + bnz * blen * 0.5],
          r: [bPitch, 0, bYaw],
          s: [1, blen, 1]
        });
      }
    }
    // A central anchor lobe so the crown still reads as one tree, not just a ring of blobs.
    var acx = 0.85 + rnd() * 0.4, acz = 0.85 + rnd() * 0.4;
    oliveCanopyTransforms.push({
      p: [tree.x, 3.05 + (rnd() - 0.5), tree.z],
      r: [rnd() * PI, rnd() * PI, rnd() * PI],
      s: [0.58 * acx, 0.46, 0.58 * acz]
    });
  }
  group.add(H.instance(branchGeo, mats.trunk, branchT));
  group.add(H.instance(new THREE.IcosahedronGeometry(1.55, 0), mats.foliageOlive, oliveCanopyTransforms));

  // Cypresses live in 08-southslope, which drops them onto the carved rock apron

  // ---------------- Scattered marble fragments: broken column drums, capitals, slabs ----------------
  // Each shape gets 3 weathering tints (InstancedMesh in r128 has no per-instance colour), so
  // fragments read with varied lichen/patina rather than one flat material.
  var drumGeo = new THREE.CylinderGeometry(0.7, 0.75, 0.6, MOBILE ? 8 : 12);
  var capGeo = new THREE.BoxGeometry(1.1, 0.5, 1.1);
  var slabGeo = new THREE.BoxGeometry(1.6, 0.35, 1.0);
  var fragBuckets = { drum: [[], [], []], cap: [[], [], []], slab: [[], [], []] };
  var fragCount = MOBILE ? 26 : 60;
  for (var i = 0; i < fragCount; i++) {
    var angle2 = (i / fragCount) * Math.PI * 2 + rnd() * 0.3;
    // Kept inside the flat esplanade (e < ~0.86): past that the plateau surface folds down to
    // meet the cliff, and these fragments sit at a fixed y so they'd float above/sink into it.
    var radiusFactor2 = 0.78 + rnd() * (0.85 - 0.78);
    var rbx = -45 + Math.cos(angle2) * 148 * radiusFactor2;
    var rbz = 0 + Math.sin(angle2) * 73 * radiusFactor2;
    var yaw = rnd() * Math.PI * 2;
    var tilt = (rnd() - 0.5) * 0.45;
    var pick = rnd();
    var bucket = (rnd() * 3) | 0;
    if (pick < 0.4) fragBuckets.drum[bucket].push({ p: [rbx, 0.3, rbz], r: [tilt, yaw, tilt * 0.7] });
    else if (pick < 0.65) fragBuckets.cap[bucket].push({ p: [rbx, 0.25, rbz], r: [tilt * 0.3, yaw, tilt * 0.3] });
    else fragBuckets.slab[bucket].push({ p: [rbx, 0.18, rbz], r: [tilt * 0.2, yaw, tilt * 0.2] });
  }
  var fragTints = [0.74, 0.93, 1.1]; // weathered-dark, mid, cleaner-worn
  [['drum', drumGeo], ['cap', capGeo], ['slab', slabGeo]].forEach(function (entry) {
    var shape = entry[0], geo = entry[1];
    for (var b = 0; b < 3; b++) {
      var list = fragBuckets[shape][b];
      if (!list.length) continue;
      var m = mats.marbleWorn.clone();
      m.color.setScalar(fragTints[b]);
      group.add(H.instance(geo, m, list));
    }
  });

  return group;
};

</script>
<script data-module="10-env.js">
// Module 10: Environment — physically-inspired sky, image-based lighting, sun + shadows,
// aerial haze, and cheap distant land/sea. Late-afternoon light from the west-southwest.
window.buildEnv = function (THREE, scene, renderer) {
  var CFG = window.CFG || { MOBILE: false, PLATEAU_CX: -45, PLATEAU_CZ: 0 };
  var MOBILE = !!CFG.MOBILE;
  var cx = (typeof CFG.PLATEAU_CX === 'number') ? CFG.PLATEAU_CX : -45;
  var cz = (typeof CFG.PLATEAU_CZ === 'number') ? CFG.PLATEAU_CZ : 0;

  // Deterministic value-noise + fBm (no built-in random, no imports): a fixed-hash lattice noise
  // combined across 4 octaves at 0.5 persistence gives the multi-scale, fractal-like ridgeline
  // variation real mountain profiles have (broad shoulders + medium bumps + fine jaggedness),
  // instead of the old per-column independent-random ("cardboard cutout") look.
  function latticeHash(i, seed) {
    var x = Math.sin(i * 12.9898 + seed * 78.233 + 1.0) * 43758.5453;
    return x - Math.floor(x);
  }
  function valueNoise1D(x, seed) {
    var i0 = Math.floor(x), f = x - i0;
    var a = latticeHash(i0, seed), b = latticeHash(i0 + 1, seed);
    var u = f * f * (3.0 - 2.0 * f);
    return a + (b - a) * u;
  }
  function fbm1D(x, seed, octaves, persistence) {
    var total = 0, amp = 1, freq = 1, maxAmp = 0;
    for (var o = 0; o < octaves; o++) {
      total += valueNoise1D(x * freq, seed + o * 101.0) * amp;
      maxAmp += amp;
      amp *= persistence;
      freq *= 2.0;
    }
    return maxAmp > 0 ? total / maxAmp : 0;
  }
  function smoothstepJs(e0, e1, x) {
    var t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0)));
    return t * t * (3 - 2 * t);
  }

  // Late-afternoon sun: elevation ~30 deg, bearing WSW (247.5 deg from north, +x East / +z South)
  // so the sun sits fairly high and a touch south-of-west, lighting the south and west facades
  // without the low, reddened light of true sunset.
  var sunElRad = 30 * Math.PI / 180;
  var sunBearingRad = 247.5 * Math.PI / 180;
  var sunDirX = Math.sin(sunBearingRad) * Math.cos(sunElRad);
  var sunDirY = Math.sin(sunElRad);
  var sunDirZ = -Math.cos(sunBearingRad) * Math.cos(sunElRad);
  var sunDirVec = new THREE.Vector3(sunDirX, sunDirY, sunDirZ);

  // Afternoon sky, not sunset: a deep, clear blue overhead falls off to a PALE WARM-WHITE haze
  // at the horizon (never orange/red — that reads as sunset, and the sun here is ~30 deg up).
  // The warm tint is concentrated in a fairly narrow cone around the sun's azimuth (real
  // forward-scatter haze brightening near the sun), everywhere else the horizon just pales
  // toward a cool, neutral blue-grey.
  var zenithColor = new THREE.Color(0x123d6e);
  var horizonColor = new THREE.Color(0xc3d2e3);
  var horizonWarmColor = new THREE.Color(0xfdf2dc);
  var sunSkyColor = new THREE.Color(0xfff2d4);
  var groundDusk = new THREE.Color(0x26221d);
  var RAYLEIGH_K = 3.3;

  var skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    uniforms: {
      sunDir: { value: sunDirVec },
      sunColor: { value: sunSkyColor },
      zenith: { value: zenithColor },
      horizon: { value: horizonColor },
      horizonWarm: { value: horizonWarmColor },
      groundCol: { value: groundDusk },
      rayleighK: { value: RAYLEIGH_K }
    },
    vertexShader: 'varying vec3 vW; void main(){ vW = (modelMatrix * vec4(position, 1.0)).xyz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: 'uniform vec3 sunDir; uniform vec3 sunColor; uniform vec3 zenith; uniform vec3 horizon; uniform vec3 horizonWarm; uniform vec3 groundCol; uniform float rayleighK; varying vec3 vW;' +
      'void main(){' +
      ' vec3 dir = normalize(vW);' +
      ' float up = dir.y;' +
      ' float horizonMix = exp(-max(up, 0.0) * rayleighK);' +
      // Warm the horizon only in a cone around the sun's azimuth, and keep that cone tighter
      // than before so the brightening reads as haze near the sun rather than a band that
      // wraps most of the horizon.
      ' vec2 dirXZ = normalize(dir.xz + vec2(1e-5));' +
      ' vec2 sunXZ = normalize(sunDir.xz + vec2(1e-5));' +
      ' float azDot = dot(dirXZ, sunXZ);' +
      // Wider still, more gradual horizon-to-zenith blend so the pale-warm and deep-blue
      // tones melt into each other with no visible transition band or step.
      ' float warmMix = smoothstep(-0.1, 0.8, azDot);' +
      ' vec3 horizonTone = mix(horizon, horizonWarm, warmMix);' +
      ' vec3 col = mix(zenith, horizonTone, clamp(horizonMix, 0.0, 1.0));' +
      ' float cosGamma = clamp(dot(dir, sunDir), -1.0, 1.0);' +
      // Broad luminous zone around the sun (~50 degree cone) — real bright afternoon sun
      // washes out a wide swath of sky, not just a tight corona.
      ' float sunHalo = pow(max(cosGamma, 0.0), 6.0);' +
      ' float mieOuter = pow(max(cosGamma, 0.0), 70.0);' +
      ' float mieInner = pow(max(cosGamma, 0.0), 1600.0);' +
      ' float corona = pow(max(cosGamma, 0.0), 3000.0);' +
      ' col += sunColor * sunHalo * 0.16;' +
      ' col += sunColor * mieOuter * 0.08;' +
      ' col += sunColor * mieInner * 0.30;' +
      ' col += sunColor * corona * 1.2;' +
      ' float disk = smoothstep(0.99975, 0.99992, cosGamma);' +
      ' col = mix(col, sunColor * 2.0, disk);' +
      // Below-horizon darkening only matters where the dome peeks under distant geometry.
      ' float below = smoothstep(0.0, -0.3, up);' +
      ' col = mix(col, groundCol, below);' +
      ' gl_FragColor = vec4(col, 1.0);' +
      '}'
  });

  var skySegs = MOBILE ? [22, 11] : [32, 16];
  var sky = new THREE.Mesh(new THREE.SphereGeometry(2400, skySegs[0], skySegs[1]), skyMat);
  sky.frustumCulled = false;
  scene.add(sky);

  // Image-based lighting: bake a cheap vertex-coloured approximation of the sky gradient
  // (+ a simple warm ground tone) into a PMREM environment, so MeshStandardMaterial gets
  // realistic ambient light and reflections. A plain vertex-colour mesh (not the live
  // ShaderMaterial dome) is used for the bake: feeding a custom ShaderMaterial through
  // PMREMGenerator's cube capture reliably produced a broken (all-black) environment here.
  var envSkyGeo = new THREE.SphereGeometry(1, 20, 10);
  var envPos = envSkyGeo.attributes.position;
  var envCol = new Float32Array(envPos.count * 3);
  var tmpCol = new THREE.Color();
  var tmpHz = new THREE.Color();
  for (var evi = 0; evi < envPos.count; evi++) {
    var epx = envPos.getX(evi), epy = envPos.getY(evi), epz = envPos.getZ(evi);
    var elen = Math.sqrt(epx * epx + epy * epy + epz * epz) || 1;
    var eux = epx / elen, euy = epy / elen, euz = epz / elen;
    var eHorizonMix = Math.min(1, Math.max(0, Math.exp(-Math.max(euy, 0) * RAYLEIGH_K)));
    var eAzLen = Math.sqrt(epx * epx + epz * epz) || 1;
    var eSunAzLen = Math.sqrt(sunDirX * sunDirX + sunDirZ * sunDirZ) || 1;
    var eAzDot = (epx / eAzLen) * (sunDirX / eSunAzLen) + (epz / eAzLen) * (sunDirZ / eSunAzLen);
    var eWarmMix = smoothstepJs(-0.1, 0.8, eAzDot);
    tmpHz.copy(horizonColor).lerp(horizonWarmColor, eWarmMix);
    tmpCol.copy(zenithColor).lerp(tmpHz, eHorizonMix);
    var eCosGamma = eux * sunDirX + euy * sunDirY + euz * sunDirZ;
    var eHalo = Math.pow(Math.max(eCosGamma, 0), 6) * 0.16;
    var eGlow = Math.pow(Math.max(eCosGamma, 0), 20) * 0.30 + eHalo;
    tmpCol.r += sunSkyColor.r * eGlow; tmpCol.g += sunSkyColor.g * eGlow; tmpCol.b += sunSkyColor.b * eGlow;
    if (euy < 0) tmpCol.lerp(groundDusk, Math.min(1, Math.max(0, -euy / 0.3)));
    // Dim the baked copy well below the dome's on-screen brightness: this feeds ambient/
    // reflection only, and direct sun should still dominate the shading contrast.
    envCol[evi * 3] = tmpCol.r * 0.55; envCol[evi * 3 + 1] = tmpCol.g * 0.55; envCol[evi * 3 + 2] = tmpCol.b * 0.55;
  }
  envSkyGeo.setAttribute('color', new THREE.BufferAttribute(envCol, 3));
  var envScene = new THREE.Scene();
  var envSky = new THREE.Mesh(envSkyGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide }));
  envScene.add(envSky);
  var envGroundMat = new THREE.MeshBasicMaterial({ color: 0x776b52 });
  var envGround = new THREE.Mesh(new THREE.CircleGeometry(1, 16), envGroundMat);
  envGround.rotation.x = -Math.PI / 2;
  envGround.position.y = -0.02;
  envScene.add(envGround);
  var pmrem = new THREE.PMREMGenerator(renderer);
  var envRT = pmrem.fromScene(envScene, 0.03, 0.1, 10);
  scene.environment = envRT.texture;
  pmrem.dispose();

  // Hemisphere gives the overall warm/cool modelling light (pale gold sky bounce over a
  // warm-earth ground bounce); ambient is a soft, pale-blue sky-reflectance fill so shadowed
  // marble reads as cool-in-shadow rather than pure black.
  // Hemisphere trimmed back down (was 0.30): at 5.5x sun intensity the previous round's
  // foreground paved areas were overexposed relative to the faded distance — 0.22 keeps the
  // sky/ground bounce fill without competing with direct sun for the near-field highlights.
  scene.add(new THREE.HemisphereLight(0xe9e0c9, 0x6b5c46, 0.22));
  scene.add(new THREE.AmbientLight(0xc8d8e8, 0.18));

  // Sun: a soft warm-white gold rather than a saturated orange, so marble reads warm without
  // tipping into an orange cast (that belongs to sunset, not a 30-degree afternoon sun).
  // Intensity brought back down from the previous round's 5.5 (which, combined with the
  // hemisphere fill, overexposed near-field paving and blew the distant hill ranges to
  // near-white under ACES) to 4.7 — still a bright, clear afternoon sun, but with headroom for
  // hue to survive tonemapping on distant, lower-albedo surfaces. Color pulled slightly less
  // red/orange (0xffc877, was 0xffe7c0) so marble reads warm cream rather than peachy.
  var sun = new THREE.DirectionalLight(0xffc877, 4.7);
  var sunDist = 300;
  sun.position.set(cx + sunDirX * sunDist, sunDirY * sunDist, cz + sunDirZ * sunDist);
  sun.castShadow = true;
  var mapSize = MOBILE ? 2048 : 4096;
  sun.shadow.mapSize.set(mapSize, mapSize);
  var camR = 195;
  sun.shadow.camera.left = -camR;
  sun.shadow.camera.right = camR;
  sun.shadow.camera.top = camR;
  sun.shadow.camera.bottom = -camR;
  sun.shadow.camera.near = 60;
  sun.shadow.camera.far = 560;
  sun.shadow.bias = -0.00018;
  sun.shadow.normalBias = 0.55;
  sun.target.position.set(cx, 0, cz);
  scene.add(sun);
  scene.add(sun.target);

  // Aerial perspective: fog colour matches the sky's pale horizon tone exactly, and density is
  // tuned so the flat ground plain (and everything else) visibly fades to blue-grey haze by
  // roughly a kilometre out, instead of staying crisp (and warm-tinted) all the way to a bright
  // band at the horizon.
  // Density lowered from the previous round (0.00082/0.00068): that value, stacked on top of
  // the (now-fixed) light overexposure, fogged the ground plain to a hard-edged pale wall a
  // short distance out instead of a smooth continuous gradient. This still fully hazes the
  // plain by ~1.5-2km but the exponential falloff is gentler in between, so there's no visible
  // seam between the near, clear ground and the fully-hazed distance.
  // Color fixed to the pure warm horizon tone (previous round) made EVERY fogged surface fade
  // to gold, even the ground looking away from the sun — a render check on the parthenon preset
  // (camera facing roughly south/away from the sun) showed the plain fading to warm cream all
  // the way to the frame edge instead of blue-grey. FogExp2 only takes one color, so this mostly
  // cool tone (a mild lean toward the warm tone, not the full horizonWarm) reads as the target's
  // "blue-grey haze matching the sky horizon" in most directions, while the sky shader itself
  // still shows the strong warm brightening exactly toward the sun.
  var fogColor = horizonColor.clone().lerp(horizonWarmColor, 0.18);
  var fogDensity = MOBILE ? 0.00046 : 0.00058;
  scene.fog = new THREE.FogExp2(fogColor.getHex(), fogDensity);

  // Distant hill ranges: real heightfield strips (a handful of rows deep, a few dozen columns
  // wide) rather than a single flat ribbon, so slopes are rounded, ridgelines are noisy, and a
  // proper lit material lets the sun model the terrain instead of it reading as a flat unlit
  // cutout. Three staggered layers (Hymettus east, Parnitha north, Aigaleo west); farther
  // layers use a paler, bluer base colour so they read as sitting further back through haze.
  // Engine fog is left off this material (at 4-5 km it would wash the layers to nothing before
  // they ever reached the screen) and a single, distance-scaled manual haze blend is baked into
  // the colour once instead — gentle enough that the ranges stay a readable silhouette, as they
  // do in reference photos of Hymettus/Parnitha seen from the Acropolis.
  // Distant-atmosphere tint: real Mediterranean haze on far ranges leans grey-purple rather
  // than neutral blue-grey, and near ranges keep a subtle warm-grey undertone from the low
  // afternoon sun raking across them. Kept separate from the ground/sky fog colour (which
  // stays matched to the pale horizon tone) so the two are tuned independently.
  // Used undiluted (not lerped toward the pale fog colour): the sun's high intensity plus ACES
  // tonemapping already compresses a lot of saturation out of distant geometry, so the source
  // tint needs real saturation of its own for a grey-purple/warm-grey undertone to actually
  // survive onto screen (see the emissive veil below, which is what mainly carries this hue).
  var hazeCool = new THREE.Color(0x6f5490);
  var hazeWarm = new THREE.Color(0xc08a52);
  function buildHillGeometry(b0, b1, radius, baseY, hMin, hMax, seed, cols, rows) {
    var peak = [];
    for (var c = 0; c <= cols; c++) {
      // 4-octave fBm (0.5 persistence) over a fixed-hash lattice gives a fractal-like
      // ridgeline: broad shoulders from the low octave, medium bumps and fine jaggedness
      // layered on top, instead of independent per-column randomness.
      var fbmVal = fbm1D((c / cols) * 6.0, seed, 4, 0.5);
      peak.push(0.35 + 0.65 * fbmVal);
    }
    var pos = [];
    var norml = [];
    var idx = [];
    for (var r = 0; r <= rows; r++) {
      var rt = r / rows;
      // Rounded cross-section: 0 at the near and far edge of the strip, cresting a bit past
      // the middle row — this is what gives the range real rounded slopes (and normals the
      // sun can model) instead of a flat vertical ribbon.
      var envelope = Math.sin(Math.PI * Math.pow(rt, 0.85));
      // Depth about three times the peak height so slopes are gentle hills, not a wall
      var rowRadius = radius + (rt - 0.5) * hMax * 3;
      for (var c = 0; c <= cols; c++) {
        var t = c / cols;
        // Taper each range toward its ends so it does not stop in a vertical cut
        var endTaper = Math.pow(Math.sin(Math.PI * t), 0.6);
        var bearing = (b0 + (b1 - b0) * t) * Math.PI / 180;
        var dx = Math.sin(bearing), dz = -Math.cos(bearing);
        var x = cx + dx * rowRadius, z = cz + dz * rowRadius;
        // Small additional detail octave, offset per row so rows are not identical, but built
        // from the SAME smooth-interpolated fBm lattice as the main ridgeline rather than an
        // independent per-vertex random sample. The old per-vertex LCG jitter here was
        // uncorrelated between neighbouring columns, which is exactly what produced the
        // discontinuous, "stair-stepped" silhouette the art director flagged; this stays

        var i2 = i0 + (cols + 1);

  // 0.50) so there's no visible atmospheric-density step between ranges, and each layer mixes
  // its own warm/cool haze balance ("warm": 1 = warm-grey undertone from raking sun, 0 = cooler
  // grey-purple distant-atmosphere tone) — nearer ranges lean warm, the farthest leans purple.

    { b0: 55, b1: 128, r: 4200, base: -90, hMin: 60, hMax: 520, seed: 71, color: 0x5b6d72, haze: 0.33, warm: 0.45 },   // Hymettus, east (mid distance)
    { b0: -38, b1: 42, r: 5200, base: -90, hMin: 120, hMax: 640, seed: 133, color: 0x556570, haze: 0.40, warm: 0.15 }, // Parnitha, north (farthest -> palest, most purple)
    { b0: 232, b1: 306, r: 3900, base: -90, hMin: 40, hMax: 380, seed: 205, color: 0x60717a, haze: 0.28, warm: 0.70 }  // Aigaleo, west (nearest -> least faded, warmest)
  ];

  // It keeps ordinary scene fog (unlike the hill ranges) so it genuinely reads as a hazy blue

  var seaSegs = MOBILE ? 10 : 18;
  var innerR = 1250, outerR = 5600, seaB0 = 172, seaB1 = 288, seaY = -79.4;
  var seaVerts = [], seaNormals = [];
  for (var si = 0; si < seaSegs; si++) {
    var t0 = si / seaSegs, t1 = (si + 1) / seaSegs;
    var a0 = (seaB0 + (seaB1 - seaB0) * t0) * Math.PI / 180;
    var a1 = (seaB0 + (seaB1 - seaB0) * t1) * Math.PI / 180;
    var ix0 = cx + Math.sin(a0) * innerR, iz0 = cz - Math.cos(a0) * innerR;
    var ox0 = cx + Math.sin(a0) * outerR, oz0 = cz - Math.cos(a0) * outerR;
    var ix1 = cx + Math.sin(a1) * innerR, iz1 = cz - Math.cos(a1) * innerR;

    seaVerts.push(ix0, seaY, iz0, ox0, seaY, oz0, ox1, seaY, oz1);
    seaVerts.push(ix0, seaY, iz0, ox1, seaY, oz1, ix1, seaY, iz1);

  seaGeo.setAttribute('normal', new THREE.Float32BufferAttribute(seaNormals, 3));

  // gulf reads as a distinct hazy blue strip rather than blending into the pale ground haze.
  var seaMat = new THREE.MeshStandardMaterial({ color: 0x1a3a5a, roughness: 0.12, metalness: 0.08, envMapIntensity: 1.4, side: THREE.DoubleSide });
  var sea = new THREE.Mesh(seaGeo, seaMat);
  sea.frustumCulled = false;
  scene.add(sea);

  // Renderer: filmic tone mapping, sRGB output, exposure tuned for a warm but unclipped glow.
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  // Slightly under 1.0: with the sun/hemisphere trimmed back this keeps the zenith reading as a
  // crisp, saturated blue rather than a bleached pale one, and gives distant low-albedo surfaces
  // (hills, sea) a little more headroom before ACES' highlight rolloff flattens their hue.
  renderer.toneMappingExposure = 0.96;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  return { sun: sun, update: function (dt) {} };
};

// Orbit camera controller
window.makeOrbit = function (THREE, camera, el, opts) {
  opts = opts || {};
  var target = opts.target !== undefined ? opts.target : new THREE.Vector3(0, 0, 0);
  var minDist = opts.minDist !== undefined ? opts.minDist : 12;
  var maxDist = opts.maxDist !== undefined ? opts.maxDist : 900;
  var minPolar = opts.minPolar !== undefined ? opts.minPolar : 0.08;
  var maxPolar = opts.maxPolar !== undefined ? opts.maxPolar : 1.50;
  var damping = opts.damping !== undefined ? opts.damping : 0.09;
  var autoRotate = opts.autoRotate !== undefined ? opts.autoRotate : true;

  var dx = camera.position.x - target.x;
  var dy = camera.position.y - target.y;
  var dz = camera.position.z - target.z;
  var radius = Math.sqrt(dx * dx + dy * dy + dz * dz);
  if (radius === 0) radius = 100;
  var phi = Math.acos(Math.max(-1, Math.min(1, dy / radius)));
  var theta = Math.atan2(dx, dz);

  var theta_t = theta;
  var phi_t = phi;
  var radius_t = radius;
  var target_t = target.clone();
  var lastInteract = performance.now();
  var pointers = new Map();

  el.style.touchAction = 'none';

  function updateCamera() {
    camera.position.set(
      target.x + radius * Math.sin(phi) * Math.sin(theta),
      target.y + radius * Math.cos(phi),
      target.z + radius * Math.sin(phi) * Math.cos(theta)
    );
    camera.lookAt(target);
  }

  function update(dt) {
    applyKeys(dt || 0);
    if (autoRotate && pointers.size === 0 && performance.now() - lastInteract > 4000) {
      theta_t += 0.04 * dt;
    }

    phi_t = Math.max(minPolar, Math.min(maxPolar, phi_t));
    radius_t = Math.max(minDist, Math.min(maxDist, radius_t));

    target.lerp(target_t, damping);
    theta += (theta_t - theta) * damping;
    phi += (phi_t - phi) * damping;
    radius += (radius_t - radius) * damping;

    updateCamera();
  }

  // Glide to a preset: v = { t: [x, y, z], r: radius, theta: azimuth, phi: polar }
  function flyTo(v) {
    target_t.set(v.t[0], v.t[1], v.t[2]);

    d -= Math.round(d / (2 * Math.PI)) * 2 * Math.PI;
    theta_t += d;
    phi_t = v.phi;
    radius_t = v.r;
    lastInteract = performance.now();

  function jumpTo(v) {
    flyTo(v);
    target.copy(target_t);
    theta = theta_t;
    phi = phi_t;
    radius = radius_t;
    updateCamera();

    autoRotate = b;
    update(0);

  var panLimit = opts.panLimit !== undefined ? opts.panLimit : 1200;

    var h = el.clientHeight || 800;

        phi_t -= dy * 0.005;

    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    lastInteract = performance.now();

  function onPointerUp(e) {
    pointers.delete(e.pointerId);
    lastInteract = performance.now();

    if (keys.arrowright || keys.d) panBy(-step, 0);
    if (keys.arrowup || keys.w) panBy(0, step);
    if (keys.arrowdown || keys.s) panBy(0, -step);

    if (keys.e) theta_t -= 1.2 * dt;
    if (keys['+'] || keys['=']) radius_t *= 1 - 1.2 * dt;
    if (keys['-']) radius_t *= 1 + 1.2 * dt;
  }

  el.addEventListener('pointerdown', onPointerDown);
  el.addEventListener('pointermove', onPointerMove);
  el.addEventListener('pointerup', onPointerUp);
  el.addEventListener('pointercancel', onPointerUp);
  el.addEventListener('wheel', onWheel, { passive: false });
  el.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    window.addEventListener('keydown', onKey);
    window.addEventListener('keyup', onKey);
    window.addEventListener('blur', function () { keys = {}; });
  }

  update(0);

  return {
    update: update,
    setAutoRotate: setAutoRotate,
    flyTo: flyTo,
    jumpTo: jumpTo,
    target: target
  };
};

<script data-module="12-main.js">
// Acropolis scene launcher and main render loop
window.startAcropolis = function () {
  var CFG = window.CFG || { MOBILE: false };
  var W = window.innerWidth, Hh = window.innerHeight;

  var renderer = new THREE.WebGLRenderer({ antialias: !CFG.MOBILE, powerPreference: 'high-performance' });
  renderer.setSize(W, Hh);
  // The debug readout counts every pass of a frame, so reset per frame by hand
  renderer.info.autoReset = false;
  document.getElementById('app').appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(48, W / Hh, 1.0, 9000);
  camera.position.set(170, 95, 205);

  var mats = window.buildMats(THREE);
  var H = window.makeHelpers(THREE, mats);

  [window.buildTerrain, window.buildParthenon, window.buildErechtheion, window.buildPropylaea, window.buildWalls, window.buildSouthSlope, window.buildScenery].forEach(function (f) {
    try {
      if (typeof f === 'function') scene.add(f(THREE, mats, H));
    } catch (e) {
      console.error('builder failed', f && f.name, e);
    }
  });

  var env = window.buildEnv(THREE, scene, renderer);
  if (mats.finishScene) mats.finishScene(scene, renderer);
  // Photo textures and scanned statues replace procedural ones as they arrive
  if (window.loadAssets) {
    try { window.loadAssets(THREE, scene, mats, renderer, H); } catch (e) { console.error('assets failed', e); }
  }

  // Post-processing on desktop: ambient occlusion, soft bloom, gamma, FXAA. Phones render directly.
  var composer = null, ssao = null, fxaa = null;
  if (!CFG.MOBILE && THREE.EffectComposer && THREE.SSAOPass && location.search.indexOf('nofx') < 0) {
    try {
      composer = new THREE.EffectComposer(renderer);
      ssao = new THREE.SSAOPass(scene, camera, W, Hh);
      // Distances are fractions of the camera range (far = 9000 m): about 0.5 m to 36 m
      ssao.kernelRadius = 3.5;
      ssao.minDistance = 0.00006;
      ssao.maxDistance = 0.004;
      // Stock SSAO is faint at this scale: raise its occlusion term to a power
      ssao.ssaoMaterial.fragmentShader = ssao.ssaoMaterial.fragmentShader.replace(
        'gl_FragColor = vec4( vec3( 1.0 - occlusion ), 1.0 );',
        // Fade out beyond ~400 m (viewZ is negative), where depth precision turns AO into dither
        'gl_FragColor = vec4( vec3( mix( pow( 1.0 - occlusion, 3.0 ), 1.0, smoothstep( 250.0, 450.0, -viewZ ) ) ), 1.0 );');
      ssao.ssaoMaterial.needsUpdate = true;
      if (location.search.indexOf('aoonly') >= 0) ssao.output = THREE.SSAOPass.OUTPUT.SSAO;
      composer.addPass(ssao);
      composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(W, Hh), 0.18, 0.5, 0.92));
      composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader));
      fxaa = new THREE.ShaderPass(THREE.FXAAShader);
      fxaa.material.uniforms.resolution.value.set(1 / (W * renderer.getPixelRatio()), 1 / (Hh * renderer.getPixelRatio()));
      composer.addPass(fxaa);
    } catch (e) {
      console.error('post-processing disabled', e);
      composer = null;
    }
  }
  var ctrl = window.makeOrbit(THREE, camera, renderer.domElement, { target: new THREE.Vector3(-30, 8, 0) });

  // Camera presets: ?view=<name> on load, legend buttons at runtime
  var VIEWS = {
    overview: { t: [-30, 8, 0], r: 298, theta: 0.77, phi: 1.27 },
    parthenon: { t: [0, 8, 0], r: 78, theta: 0.6, phi: 1.28 },
    erechtheion: { t: [-38, 4, -32], r: 38, theta: -0.25, phi: 1.3 },
    propylaea: { t: [-122, 5, 6], r: 62, theta: -1.25, phi: 1.3 },
    promachos: { t: [-62, 7, -12], r: 30, theta: 0.9, phi: 1.32 },
    southslope: { t: [-70, -48, 110], r: 150, theta: 0.1, phi: 0.95 }
  };
  // Portrait screens see less width, so back the camera off
  function fit(v) {
    var k = Math.min(2, Math.max(1, 1 / camera.aspect));
    return { t: v.t, r: v.r * k, theta: v.theta, phi: v.phi };
  }
  var m = /[?&]view=([a-z]+)/.exec(location.search);
  if (m && VIEWS[m[1]]) {
    ctrl.jumpTo(fit(VIEWS[m[1]]));
    if (location.search.indexOf('still') >= 0) ctrl.setAutoRotate(false);
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-view]'), function (b) {
    b.addEventListener('click', function () {
      var v = VIEWS[b.getAttribute('data-view')];
      if (v) ctrl.flyTo(fit(v));
    });
  });

  function onResize() {
    var w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    if (composer) {
      composer.setSize(w, h);
      if (fxaa) fxaa.material.uniforms.resolution.value.set(1 / (w * renderer.getPixelRatio()), 1 / (h * renderer.getPixelRatio()));
    }
  }

  var resizeTimer;
  function debounceResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(onResize, 150);
  }

  window.addEventListener('resize', debounceResize);
  window.addEventListener('orientationchange', debounceResize);

  var autorotBtn = document.getElementById('autorot');
  if (autorotBtn) {
    autorotBtn.addEventListener('click', function () {
      var on = autorotBtn.getAttribute('aria-pressed') !== 'true';
      ctrl.setAutoRotate(on);
      autorotBtn.setAttribute('aria-pressed', on);
      autorotBtn.classList.toggle('off', !on);
    });
  }

  var clock = new THREE.Clock();
  var frames = 0;

  function frame() {
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, clock.getDelta());
    ctrl.update(dt);
    env.update(dt);
    renderer.info.reset();
    if (composer) composer.render(dt); else renderer.render(scene, camera);
    frames++;

  frame();

  setTimeout(function () {
    var hint = document.getElementById('hint');
    if (hint) hint.style.opacity = '0';
  }, 6000);

  if (location.search.indexOf('debug') >= 0) {
    window.acropolisCtrl = ctrl;
    window.acropolisScene = scene;
    window.acropolisCamera = camera;
    var dbg = document.getElementById('debug');
    if (dbg) {
      dbg.hidden = false;
      setInterval(function () {
        dbg.textContent = 'tris ' + renderer.info.render.triangles + ' · calls ' + renderer.info.render.calls + ' · geo ' + renderer.info.memory.geometries + ' · fps ' + Math.round(frames * 2);
        frames = 0;
      }, 500);
    }
  }
};

</script>

  // ================= H.makeStatue =================

  };

  // ================= relief panels (metopes / friezes) =================
  // Manual BufferGeometry merge (no addon merge helpers allowed in this build).
  function mergeGeoms(geoList) {
    var positions = [], normals = [];
    for (var gi = 0; gi < geoList.length; gi++) {
      var g = geoList[gi];
      var src = g.index ? g.toNonIndexed() : g;
      if (!src.getAttribute('normal')) src.computeVertexNormals();
      var p = src.getAttribute('position').array;
      var n = src.getAttribute('normal').array;
      for (var i = 0; i < p.length; i++) positions.push(p[i]);
      for (var j = 0; j < n.length; j++) normals.push(n[j]);
    }
    var merged = new THREE.BufferGeometry();
    merged.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    merged.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
    return merged;
  }

  // A flattened, low-relief figure built from a handful of boxes squashed in z —
  // boxes (12 tris each) rather than the previous cylinders/spheres (20-48 tris
  // each) because a relief panel this small never shows the difference in
  // roundness, and there can be well over 150 of these across the temple's
  // metopes and friezes, where every triangle is multiplied by that count.
  // variant: 'lapith' (human, weapon arm raised) | 'centaur' (human torso on an
  // elongated four-legged body) | 'procession' (walking figure, frieze default).
  function reliefFigureGeoms(cx, baseY, fh, depth, seed, lowDetail, variant) {
    var rnd = makeRng(seed);
    var geoms = [];
    var legR = fh * 0.09, torsoW = fh * 0.22, torsoH = fh * 0.40, headS = fh * 0.16;
    var stance = (rnd() - 0.5) * fh * 0.18;
    // Director's r1 review: metope/frieze figures read as generic and static —
    // widened the swing range so limbs spread further from a neutral pose,
    // giving combat pairs and marchers alike more dynamic, varied silhouettes.
    var armSwing = (rnd() - 0.5) * fh * 0.6;
    var dz = Math.min(depth, fh * 0.5);

    function pushBox(w, h, d, x, y, z, rz) {
      var bg = new THREE.BoxGeometry(w, h, Math.min(d, depth));
      if (rz) bg.rotateZ(rz);
      bg.translate(x, y, z);
      geoms.push(bg);
    }

    if (variant === 'centaur') {
      // Human torso and arms rising from an elongated four-legged horse body —
      // reads clearly as a centaur in silhouette without a full quadruped rig.
      var bodyLen = fh * 0.62, bodyH = fh * 0.30;
      pushBox(bodyLen, bodyH, depth * 0.9, cx + fh * 0.05, baseY + bodyH * 0.55, 0, 0);
      // Foreleg/hindleg distinction (director's r1 review: all four legs read
      // identically): the forelegs (nearer the human torso, lg 2-3) rear up —
      // raised higher, bent at a steeper angle, as a centaur lunging into a
      // fight would — while the hindlegs (lg 0-1) stay planted and vertical.
      // Same box count/cost, just reposed.
      for (var lg = 0; lg < 4; lg++) {
        var lx = cx - bodyLen * 0.32 + lg * (bodyLen * 0.6 / 3);
        var isFore = lg >= 2;
        var legRot = isFore ? (lg < 3 ? -0.55 : 0.45) : (lg < 1 ? -0.05 : 0.05);
        var legY = baseY + fh * (isFore ? 0.24 : 0.19);
        pushBox(legR * 0.75, fh * (isFore ? 0.40 : 0.36), legR * 0.75, lx, legY, isFore ? dz * 0.12 : 0, legRot);
      }
      var htx = cx + bodyLen * 0.30;
      pushBox(torsoW * 0.9, torsoH, depth * 0.85, htx, baseY + bodyH + torsoH * 0.5, dz * 0.1, 0.08);
      pushBox(legR * 0.7, fh * 0.30, legR * 0.7, htx - torsoW * 0.4, baseY + bodyH + fh * 0.18, dz * 0.15, 0.6 + armSwing * 0.01);
      pushBox(legR * 0.7, fh * 0.30, legR * 0.7, htx + torsoW * 0.4, baseY + bodyH + fh * 0.18, dz * 0.15, -0.6 - armSwing * 0.01);

    pushBox(legR, fh * 0.42, legR, cx - fh * 0.07 + stance * 0.4, baseY + fh * 0.21, 0, 0.05);
    pushBox(legR, fh * 0.42, legR, cx + fh * 0.07 - stance * 0.4, baseY + fh * 0.21, 0, -0.05);
    // torso
    pushBox(torsoW, torsoH, depth * 0.9, cx, baseY + fh * 0.42 + torsoH / 2, 0, 0);
    // arms — a Lapith gets one arm raised overhead with a weapon; everyone else swings both
    var armLen = fh * 0.36;
    var raised = variant === 'lapith';
    // off-hand: a Lapith's non-weapon arm grips a shield braced in front of the
    // body rather than just swinging free — its hand pose bends toward the
    // shield face instead of hanging straight down.
    var offArmX = cx - torsoW * 0.55 + armSwing * 0.3;
    var offArmRot = raised ? 0.85 : (0.5 + armSwing * 0.01);
    pushBox(legR * 0.75, armLen, legR * 0.75, offArmX, baseY + fh * (raised ? 0.55 : 0.62), dz * 0.1, offArmRot);
    pushBox(legR * 0.75, armLen, legR * 0.75, cx + torsoW * 0.55 - armSwing * 0.3, baseY + fh * (raised ? 0.74 : 0.62), dz * 0.1, raised ? -1.15 : (-0.5 - armSwing * 0.01));
    if (raised) {
      // weapon: a thin diagonal bar gripped in the raised hand
      pushBox(legR * 0.35, fh * 0.34, legR * 0.35, cx + torsoW * 0.85, baseY + fh * 0.92, dz * 0.15, -0.3);
      // shield: a round hoplite shield (approximated as a flattened disc-like
      // box, cheap and readable at metope scale) braced on the off arm,
      // covering the torso's near side — without it a Lapith is just a bare
      // fighter with a stick, not a readable combat scene.
      var shieldR = fh * 0.30;
      pushBox(shieldR * 2, shieldR * 2, depth * 0.55, offArmX - legR * 0.4, baseY + fh * 0.46, dz * 0.05, 0);
    }
    // head
    pushBox(headS, headS, Math.min(headS, depth), cx, baseY + fh * 0.42 + torsoH + headS * 0.5, dz * 0.15, 0);

    if (!lowDetail) {
      // a light drape fold across the torso for frieze-grade panels
      pushBox(torsoW * 1.1, torsoH * 0.14, depth * 0.7, cx, baseY + fh * 0.5, dz * 0.25, 0.3);
    }
    return geoms;
  }

  // H.makeRelief(w, h, {figures, lowDetail, seed}) -> single merged Mesh, mats.marbleRelief.
  // Square-ish panels (w/h < 2.2, i.e. metope-shaped) get an alternating Lapith/
  // centaur combat pair; wide strips (friezes) get a plain marching procession —
  // this is decided from the panel's own proportions so every existing call site
  // (metopes, the Panathenaic frieze, the altar frieze) gets the right reading
  // without needing to pass a new option.
  H.makeRelief = function (w, h, o) {
    o = o || {};
    var figures = o.figures !== undefined ? o.figures : 2;
    var lowDetail = !!o.lowDetail;
    var seed = (o.seed !== undefined ? o.seed : 1) * 97 + 13;
    var depth = 0.15;
    var slabThickness = depth * 0.5;
    var combat = (w / h) < 2.2;

    var geoms = [];
    var slab = new THREE.BoxGeometry(w, h, slabThickness);
    slab.translate(0, 0, -slabThickness / 2);
    geoms.push(slab);

    var reliefDepth = depth - slabThickness;
    for (var i = 0; i < figures; i++) {
      var t = figures > 1 ? i / (figures - 1) : 0.5;
      var fx = (t - 0.5) * w * 0.82;
      var fh = h * (lowDetail ? 0.80 : 0.86);
      var baseY = -h / 2 + h * 0.03;
      var variant = combat ? (i % 2 === 0 ? 'lapith' : 'centaur') : 'procession';
      var fgeoms = reliefFigureGeoms(fx, baseY, fh, reliefDepth, seed + i * 7, lowDetail, variant);
      for (var k = 0; k < fgeoms.length; k++) geoms.push(fgeoms[k]);

    var merged = mergeGeoms(geoms);
    var mesh = new THREE.Mesh(merged, mats.marbleRelief);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.userData.slot = 'relief';
    mesh.userData.w = w;
    mesh.userData.h = h;
    mesh.userData.combat = combat;
    mesh.userData.index = o.seed !== undefined ? o.seed : 1;
    return mesh;
  };

  // ================= H.makePromachos =================
  // 2.5m moulded marble plinth; 9m bronze Athena Promachos: Corinthian helmet with high crest,
  // aegis, long peplos, shield resting on the ground by the left leg, spear (gilded tip) in the
  // right hand reaching ~11m. Origin at the plinth base.

    o = o || {};
    var group = new THREE.Group();
    var plinthH = 2.5;
    var seed = 71;

    var base = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.3, 3.5), mats.marble);
    base.position.y = 0.15;
    base.castShadow = true; base.receiveShadow = true;

    // dark blob rather than a clean silhouette. foldScale/leanScale exaggerate the
    // peplos folds and the contrapposto lean so the bronze reads as a shaped figure
    // — not flat color — even under the patina's dark, uneven material.
    // Director's r3 review: good silhouette (keep it — bodyBulk: 0 opts out of
    // the heavier pediment-figure proportions below), wants more drapery fold

    var aegisR = built.maxR * 1.55;
    var aegisBulge = aegisR * 0.7;
    var aegisProfile = [
      new THREE.Vector2(aegisR, 0),
      new THREE.Vector2(aegisR * 0.88, aegisBulge * 0.30),
      new THREE.Vector2(aegisR * 0.55, aegisBulge * 0.65),
      new THREE.Vector2(0.001, aegisBulge)

    var aegis = foldedLathe(aegisProfile, {
      material: mat, seed: seed + 3, span: aegisBulge, radial: MOBILE ? 16 : 26,

    var shieldX = -built.maxR * 2.1, shieldZ = height * 0.16;

    var shieldBoss = makeHead(shieldR * 0.44, { material: mat, hair: true, hairMaterial: mat, lowRes: true });
    shieldBoss.rotation.y = 0.12;
    shieldBoss.position.set(shieldX + shieldR * 0.02, shieldY, shieldZ + shieldR * 0.20);
    group.add(shieldBoss);

    group.add(taperedLimb(leftShoulder, leftElbow, height * 0.032, height * 0.026, MOBILE ? 6 : 9, mat));
    group.add(taperedLimb(leftElbow, leftHand, height * 0.026, height * 0.021, MOBILE ? 6 : 9, mat));
    group.add(jointBall(leftShoulder, height * 0.030, mat));
    group.add(jointBall(leftElbow, height * 0.024, mat));
    group.add(ballMesh(height * 0.022, 5, mat, leftHand));

    // Spear: right hand raised, shaft ~11m tall with a gilded leaf-shaped tip
    var rightShoulder = new THREE.Vector3(built.maxR * 0.92, shoulderY, height * 0.015);
    var rightElbow = new THREE.Vector3(built.maxR * 1.05, shoulderY - height * 0.06, height * 0.10);
